      - name: Generate all textures and custom sounds, then validate resources
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python3 scripts/generate_textures.py
          python3 scripts/generate_sounds.py
          python3 - <<'PYVALIDATE'
          import json, pathlib, struct
          for path in pathlib.Path('src/main/resources').rglob('*.json'):
              json.loads(path.read_text(encoding='utf-8'))
          pngs = list(pathlib.Path('src/main/resources').rglob('*.png'))
          for path in pngs:
              data = path.read_bytes()
              if data[:8] != b'\x89PNG\r\n\x1a\n' or struct.unpack('>II', data[16:24]) != (128, 128):
                  raise SystemExit(f'Invalid/non-128x128 PNG: {path}')
          sounds_json = json.loads(pathlib.Path('src/main/resources/assets/immersivecctv/sounds.json').read_text(encoding='utf-8'))
          sound_dir = pathlib.Path('src/main/resources/assets/immersivecctv/sounds')
          missing = [name for name, spec in sounds_json.items() if not (sound_dir / (spec['sounds'][0]['name'].split(':', 1)[1] + '.ogg')).is_file()]
          if missing:
              raise SystemExit('Missing sound assets: ' + ', '.join(missing))
          if len(sounds_json) < 200:
              raise SystemExit(f'Expected at least 200 sound events, got {len(sounds_json)}')
          print(f'Validated JSON resources, {len(pngs)} generated 128x128 textures, {len(sounds_json)} sound events, and all generated OGG files.')
          PYVALIDATE

      - name: Set up Gradle 8.1.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.1.1'

      - name: Compile and reobfuscate mod JAR
        run: gradle --no-daemon build

      - name: Assemble distributable ZIPs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          JAR_PATH="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' -print -quit)"
          if [[ -z "$JAR_PATH" ]]; then echo 'Build succeeded but no JAR was found in build/libs' >&2; exit 1; fi
          cp "$JAR_PATH" dist/ImmersiveCCTV-Forge-1.20.1.jar
          cat > dist/INSTALL.txt <<'INSTALL_EOF'
          Immersive CCTV 1.4.0 — Minecraft Forge 1.20.1

          Requires Minecraft Java Edition 1.20.1, Forge 47.2.0 and Java 17.
          Copy ImmersiveCCTV-Forge-1.20.1.jar into the game's mods folder.

          PHYSICAL CONNECTIONS:
          1. Place a Wall Power Outlet against a solid wall. Use AC Charger 12V on the XVR rear DC jack, then use Power Cable from the outlet to the XVR. Repeat outlet + Power Cable for the monitor.
          2. Place Bullet IR HD Camera for a fixed view, or PTZ Pan-Tilt-Zoom Camera for controllable pan/tilt.
          3. Hold the HDMI cable item. Click the monitor's rear HDMI jack, then the XVR's rear HDMI socket.
          4. Hold the blue PoE cable item. Click the camera's rear RJ45 jack, then one of the eight individual RJ45 sockets on the FRONT of the XVR.
          5. Use an empty hand and click the physical POWER button on the XVR front panel.
          6. Wait through cold boot and sequential camera connection, then right-click the powered monitor to open the console.
          7. On PTZ cameras, use LEFT/RIGHT to pan, UP/DOWN to tilt, and HOME to centre the view.
          8. PLAY starts local DVR playback; PAUSE/RESUME controls playback, LIVE returns to live view, and the seek arrows step through saved frames.
          9. Use XVR SETTINGS to toggle/restart the active camera or shut down the XVR. Shift-right-click the monitor/camera to disconnect its CCTV link, or the XVR to disconnect all.

          DVR NOTE: timestamped PNG frames are captured on the client every 2.5 seconds while the console is open, up to 360 frames per camera. Files are kept under .minecraft/immersive_cctv/recordings. This is local frame-based playback, not continuous background video; no feed frames are recorded while the console is closed.

          VIDEO NOTE: the 384x216 preview is a textured block-outline raycast approximation, not a full second Minecraft renderer. Animated entities, player skins, particles, clouds, fluids and some transparent blocks may differ from the normal view. The UI places compact controls above the feed to prevent label overlap.
          INSTALL_EOF
          (cd dist && zip -j -q ImmersiveCCTV-Forge-1.20.1.zip ImmersiveCCTV-Forge-1.20.1.jar INSTALL.txt)
          zip -q -r dist/ImmersiveCCTV-Source.zip build.gradle settings.gradle gradle.properties src scripts README.md .github/workflows/build.yml
          echo 'Generated packages:'
          ls -lh dist/*.zip dist/*.jar

      - name: Upload JAR and source/distribution ZIPs
        uses: actions/upload-artifact@v4
        with:
          name: ImmersiveCCTV-Forge-1.20.1
          path: |
            dist/ImmersiveCCTV-Forge-1.20.1.zip
            dist/ImmersiveCCTV-Source.zip
            dist/ImmersiveCCTV-Forge-1.20.1.jar
          if-no-files-found: error
          retention-days: 14
