          archive = lzma.decompress(base64.b64decode(encoded))
          root = pathlib.Path('project')
          root.mkdir(exist_ok=True)
          with tarfile.open(fileobj=io.BytesIO(archive), mode='r:') as tf:
              tf.extractall(root, filter='data')
          if (root / 'build.gradle').exists():
              project_dir = root
          else:
              projects = [p for p in root.iterdir() if p.is_dir() and (p / 'build.gradle').exists()]
              if len(projects) != 1:
                  raise SystemExit(f'Expected one Gradle project, found {len(projects)}')
              project_dir = projects[0]
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write(f'PROJECT_DIR={project_dir.resolve()}\n')
          print(f'Project restored at {project_dir.resolve()}')
          PYCODE

      - name: Validate feature source files
        shell: bash
        run: |
          set -euo pipefail
          test -f "$PROJECT_DIR/src/main/java/ro/immersivecctv/client/CameraViewController.java"
          test -f "$PROJECT_DIR/src/main/java/ro/immersivecctv/block/RouterBlock.java"
          test -f "$PROJECT_DIR/src/main/java/ro/immersivecctv/block/InternetBlock.java"
          test -f "$PROJECT_DIR/src/main/java/ro/immersivecctv/item/CloudAccessRemoteItem.java"
          test -f "$PROJECT_DIR/src/main/java/ro/immersivecctv/client/CloudRemoteLoginScreen.java"
          grep -Rqs 'Host unreachable' "$PROJECT_DIR/src/main/java"
          grep -Rqs 'Cannot obtain' "$PROJECT_DIR/src/main/java"
          echo 'Camera, router/fibre and cloud-access source checks passed.'

      - name: Regenerate textures and sound assets
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          python3 scripts/generate_textures.py
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python3 scripts/generate_sounds.py
          python3 scripts/validate_resources.py

      - name: Install Gradle 8.8
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://services.gradle.org/distributions/gradle-8.8-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo '/tmp/gradle-8.8/bin' >> "$GITHUB_PATH"

      - name: Build Forge mod
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon clean build

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: immersive-cctv-forge-1.20.1-java17
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
