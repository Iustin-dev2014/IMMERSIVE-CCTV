name: Repository Time Machine - Git History Dashboard

on:
  workflow_dispatch:
    inputs:
      commit_count:
        description: Number of recent commits to display (5-100)
        required: true
        default: '30'
  push:
    branches: [main]
    paths: ['.github/workflows/repository-time-machine.yml']

permissions:
  contents: read

jobs:
  dashboard:
    name: Generate a visual repository time capsule
    runs-on: [self-hosted, windows]
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build HTML dashboard
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $count = 30
          $parsed = 0
          if ([int]::TryParse('${{ inputs.commit_count }}', [ref]$parsed)) { $count = [Math]::Max(5, [Math]::Min(100, $parsed)) }
          $repo = '${{ github.repository }}'
          $branch = '${{ github.ref_name }}'
          $head = (git rev-parse --short HEAD).Trim()
          $total = [int](git rev-list --count HEAD)
          $files = @(git ls-files)
          $log = @(git log -n $count --date=short --pretty=format:'%h%x1f%an%x1f%ad%x1f%s')
          $rows = foreach ($line in $log) {
            if ([string]::IsNullOrWhiteSpace($line)) { continue }
            $p = $line -split [char]31, 4
            if ($p.Count -lt 4) { continue }
            $sha = [System.Net.WebUtility]::HtmlEncode($p[0]); $author = [System.Net.WebUtility]::HtmlEncode($p[1]); $date = [System.Net.WebUtility]::HtmlEncode($p[2]); $subject = [System.Net.WebUtility]::HtmlEncode($p[3])
            $url = 'https://github.com/' + $repo + '/commit/' + $p[0]
            '<article><div class="sha">' + $sha + '</div><div><small>' + $date + ' · ' + $author + '</small><h3>' + $subject + '</h3><a href="' + $url + '" target="_blank">Open commit ↗</a></div></article>'
          }
          $exts = @{}
          foreach ($f in $files) { $e = [IO.Path]::GetExtension($f).ToLowerInvariant(); if (!$e) { $e = '[no extension]' }; if (!$exts.ContainsKey($e)) { $exts[$e] = 0 }; $exts[$e]++ }
          $max = 1; foreach ($v in $exts.Values) { if ($v -gt $max) { $max = $v } }
          $bars = foreach ($e in ($exts.GetEnumerator() | Sort-Object Value -Descending | Select-Object -First 12)) { $label = [System.Net.WebUtility]::HtmlEncode($e.Key); $w = [Math]::Max(3,[Math]::Round(100*$e.Value/$max)); '<div class="bar"><span>'+$label+'</span><div class="track"><i style="width:'+$w+'%"></i></div><b>'+$e.Value+'</b></div>' }
          $authors = git log -n $count --format='%an' | Group-Object | Sort-Object Count -Descending | Select-Object -First 8
          $authorRows = foreach ($a in $authors) { '<li><span>'+[System.Net.WebUtility]::HtmlEncode($a.Name)+'</span><b>'+$a.Count+'</b></li>' }
          $stamp = Get-Date -Format 'yyyy-MM-dd HH:mm:ss K'
          $html = @'
<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Repository Time Machine</title><style>
:root{color-scheme:dark;--bg:#080d18;--panel:#121d31;--line:#293b59;--text:#edf4ff;--muted:#9badc8;--cyan:#66eee1;--purple:#9c8cff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top right,#25335e,transparent 45%),var(--bg);color:var(--text);font:16px/1.5 system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:28px 18px 60px}.hero,.panel,.stat{border:1px solid var(--line);border-radius:20px;background:var(--panel);padding:22px}.hero{padding:34px;background:linear-gradient(135deg,#182946,#121629)}.eyebrow{color:var(--cyan);letter-spacing:.15em;font-weight:800;font-size:12px}.hero h1{font-size:clamp(34px,7vw,62px);line-height:1;margin:14px 0}.muted,small{color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:16px 0}.stat strong{display:block;font-size:30px;color:var(--cyan)}.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}.panel{margin-bottom:16px}.commit{display:flex;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}.sha{background:#223653;color:var(--cyan);padding:8px;border-radius:9px;height:max-content;font-weight:800}.commit h3{margin:3px 0;overflow-wrap:anywhere;font-size:16px}.commit a{color:var(--cyan);font-size:13px;text-decoration:none}.bar{display:grid;grid-template-columns:100px 1fr 25px;gap:8px;align-items:center;margin:12px 0;font-size:13px}.bar span{overflow-wrap:anywhere;color:var(--muted)}.track{height:8px;border-radius:10px;background:#27344a;overflow:hidden}.track i{display:block;height:100%;background:linear-gradient(90deg,var(--purple),var(--cyan))}.people{list-style:none;padding:0}.people li{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}footer{text-align:center;color:var(--muted);font-size:12px;margin-top:20px}@media(max-width:760px){.grid{grid-template-columns:1fr}.hero{padding:24px}.bar{grid-template-columns:80px 1fr 25px}}
</style></head><body><main><section class="hero"><div class="eyebrow">◉ GIT HISTORY / LIVE SNAPSHOT</div><h1>Repository<br>Time Machine</h1><p>A visual time capsule of this repository: commit timeline, contributor activity and the project's file-type DNA. It does not inspect or alter the mod's gameplay.</p><p><b>'@ + $repo + '</b> · branch <b>' + $branch + '</b> · HEAD <b>' + $head + '</b></p></section>
<section class="stats"><div class="stat"><strong>' + $total + '</strong><span>Total commits</span></div><div class="stat"><strong>' + $files.Count + '</strong><span>Tracked files</span></div><div class="stat"><strong>' + $rows.Count + '</strong><span>Timeline entries</span></div><div class="stat"><strong>' + $authors.Count + '</strong><span>Active contributors shown</span></div></section>
<section class="grid"><div class="panel"><h2>⏳ Commit timeline</h2><p class="muted">Newest first · hashes open their GitHub commit page</p>' + ($rows -join "`n") + '</div><div><div class="panel"><h2>🧬 File DNA</h2><p class="muted">Most common tracked file types</p>' + ($bars -join "`n") + '</div><div class="panel"><h2>👥 Contributor activity</h2><ul class="people">' + ($authorRows -join "`n") + '</ul></div><div class="panel"><h2>📍 Snapshot</h2><p class="muted">Generated: ' + $stamp + '</p><p class="muted">Commit window: ' + $count + '</p></div></div></section><footer>Repository Time Machine · generated by GitHub Actions · no external service needed</footer></main></body></html>
          '@
          Set-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'repository-time-machine.html') -Value $html -Encoding UTF8
          Write-Host ('Dashboard ready. Commits=' + $total + '; tracked files=' + $files.Count + '; timeline entries=' + $rows.Count)
      - name: Upload HTML dashboard
        uses: actions/upload-artifact@v4
        with:
          name: repository-time-machine-dashboard
          path: repository-time-machine.html
          if-no-files-found: error
          retention-days: 30
