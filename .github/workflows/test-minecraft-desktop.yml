name: Test temporary Minecraft desktop proxy

on:
  pull_request:
    paths:
      - ".github/scripts/minecraft-desktop-proxy.cjs"
      - ".github/workflows/temporary-minecraft-linux-desktop.yml"
      - ".github/workflows/test-minecraft-desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proxy-smoke-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate proxy syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check .github/scripts/minecraft-desktop-proxy.cjs
          npm install --prefix "$RUNNER_TEMP/minecraft-proxy-test" --no-save http-proxy@1.18.1

      - name: Verify authentication gate and upstream proxy
        shell: bash
        env:
          VM_WEB_PASSWORD: test-only-password-not-a-real-secret
          NODE_PATH: ${{ runner.temp }}/minecraft-proxy-test/node_modules
        run: |
          set -euo pipefail

          node -e 'require("http").createServer((req,res)=>{res.writeHead(200,{"Content-Type":"text/html"});res.end("<html><title>noVNC test</title></html>")}).listen(6080,"127.0.0.1")' &
          UPSTREAM_PID=$!
          VM_UI_PORT=8090 DESKTOP_UPSTREAM=http://127.0.0.1:6080 node .github/scripts/minecraft-desktop-proxy.cjs &
          PROXY_PID=$!

          cleanup() {
            kill "$PROXY_PID" "$UPSTREAM_PID" 2>/dev/null || true
            wait "$PROXY_PID" "$UPSTREAM_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          READY=0
          for attempt in $(seq 1 15); do
            CODE="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8090/ || true)"
            if [[ "$CODE" == "401" ]]; then
              READY=1
              break
            fi
            sleep 1
          done
          if [[ "$READY" -ne 1 ]]; then
            echo "::error::Unauthenticated requests were not blocked."
            exit 1
          fi

          curl --fail --silent --show-error --user "cctvtest:${VM_WEB_PASSWORD}" \
            http://127.0.0.1:8090/ -o "$RUNNER_TEMP/proxy-response.html"
          grep -q "noVNC test" "$RUNNER_TEMP/proxy-response.html"
          echo "PASS: unauthenticated access returns 401 and authenticated access reaches the upstream."
