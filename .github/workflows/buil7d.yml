          cat > src/main/java/com/immersivecctv/XvrView.java <<'EOF_FILE'
          package com.immersivecctv;

          import net.minecraft.core.BlockPos;
          import net.minecraft.resources.ResourceLocation;
          import net.minecraft.world.level.Level;

          import java.time.LocalDateTime;
          import java.time.format.DateTimeFormatter;

          /** Everything that appears on the monitor (in the world and in the full screen UI). Virtual size 160 x 90. */
          public final class XvrView {
              public static final float W = 160F;
              public static final float H = 90F;

              private static final DateTimeFormatter[] FORMATS = {
                      DateTimeFormatter.ofPattern("yyyy-MM-dd HH:mm:ss"),
                      DateTimeFormatter.ofPattern("dd-MM-yyyy HH:mm:ss"),
                      DateTimeFormatter.ofPattern("MM-dd-yyyy HH:mm:ss")
              };
              private static final String[] BOOT_LINES = {
                      "BIOS v2.31   CPU ......... OK",
                      "Memory 512MB .......... OK",
                      "HDD 1TB ............... OK",
                      "Loading firmware...",
                      "LAN switch: 16 ports PoE",
                      "Init video channels",
                      "System ready"
              };
              private static final int[] BOOT_AT = {25, 45, 65, 90, 120, 150, 178};

              private XvrView() {
              }

              public static void draw(ScreenCanvas c, XvrBlockEntity xvr, Level level, float t, int focus, boolean allowLive) {
                  if (!xvr.isPowered()) {
                      noSignal(c);
                      return;
                  }
                  float el = t - xvr.getPowerOnTime();
                  if (el < XvrBlockEntity.BOOT_TICKS) {
                      boot(c, xvr, el);
                      return;
                  }
                  grid(c, xvr, level, t, focus, allowLive);
              }

              public static void noSignal(ScreenCanvas c) {
                  c.rect(0, 0, W, H, 0F, 0xFF0A1030);
                  c.textC("NO SIGNAL", W / 2F, 32F, 2.0F, 0xFFFFFFFF);
                  c.textC("Check HDMI source", W / 2F, 56F, 0.9F, 0xFFAAB4D0);
              }

              private static void boot(ScreenCanvas c, XvrBlockEntity xvr, float el) {
                  c.rect(0, 0, W, H, 0F, 0xFF000000);
                  if (el >= 8F) {
                      c.text(xvr.getDeviceName(), 8F, 5F, 1.0F, 0xFFFFFFFF);
                  }
                  for (int i = 0; i < BOOT_LINES.length; i++) {
                      if (el >= BOOT_AT[i]) {
                          c.text(BOOT_LINES[i], 8F, 17F + i * 8F, 0.85F, 0xFF66FF66);
                      }
                  }
                  float p = Math.max(0F, Math.min(1F, (el - 20F) / 170F));
                  c.text("Starting up... " + (int) (p * 100F) + "%", 10F, 74F, 0.75F, 0xFFCCCCCC);
                  c.rect(10F, 82F, 150F, 87F, 0.1F, 0xFF303030);
                  c.rect(11F, 83F, 11F + 138F * p, 86F, 0.2F, 0xFF33CC55);
              }

              private static String clock(XvrBlockEntity x, Level level) {
                  if (x.isTimeReal()) {
                      return LocalDateTime.now().plusHours(x.getTzOffset()).format(FORMATS[x.getDateFmt() % 3]);
                  }
                  long dt = level.getDayTime();
                  long day = dt / 24000L + 1L;
                  long sec = (long) ((dt % 24000L) * 3.6D + 21600D + x.getTzOffset() * 3600D);
                  sec = ((sec % 86400L) + 86400L) % 86400L;
                  return String.format("Day %d  %02d:%02d:%02d", day, sec / 3600, (sec % 3600) / 60, sec % 60);
              }

              private static void grid(ScreenCanvas c, XvrBlockEntity xvr, Level level, float t, int focus,
                                       boolean allowLive) {
                  int n = focus >= 0 ? 1 : xvr.getLayout();
                  int cols = n == 1 ? 1 : n == 4 ? 2 : n == 9 ? 3 : 4;
                  float tw = W / cols;
                  float th = H / cols;
                  String clock = clock(xvr, level);
                  boolean recActive = xvr.isRecordingActive(level.getGameTime());
                  for (int idx = 0; idx < n; idx++) {
                      int ch = focus >= 0 ? focus : xvr.getPage() * n + idx;
                      float tx = (idx % cols) * tw;
                      float ty = (idx / cols) * th;
                      if (ch >= XvrBlockEntity.CHANNELS) {
                          c.rect(tx, ty, tx + tw - 1F, ty + th - 1F, 0F, 0xFF050505);
                          continue;
                      }
                      tile(c, xvr, level, t, ch, tx, ty, tw - 1F, th - 1F, clock, recActive, allowLive);
                  }
              }

              private static void tile(ScreenCanvas c, XvrBlockEntity xvr, Level level, float t, int ch,
                                       float tx, float ty, float w, float h, String clock, boolean recActive,
                                       boolean allowLive) {
                  float k = Math.max(0.45F, w / 80F);
                  if (!xvr.isChannelEnabled(ch)) {
                      c.rect(tx, ty, tx + w, ty + h, 0F, 0xFF050505);
                      c.text(xvr.getChannelName(ch) + "  OFF", tx + 3F * k, ty + 3F * k, 0.6F * k, 0xFF808080);
                      return;
                  }
                  if (!xvr.isOnline(ch)) {
                      noiseTile(c, ch, tx, ty, w, h, t, k);
                      return;
                  }
                  BlockPos cam = xvr.getCamera(ch);
                  float since = t - Math.max(xvr.getCameraTime(ch), xvr.getPowerOnTime() + XvrBlockEntity.BOOT_TICKS);
                  if (since < 80F) {
                      c.rect(tx, ty, tx + w, ty + h, 0F, 0xFF0E1216);
                      String dots = ".".repeat(((int) (t / 6F)) % 4);
                      c.text("CONNECTING" + dots, tx + w * 0.2F, ty + h * 0.4F, 0.75F * k, 0xFFE0E0E0);
                      float p = Math.max(0F, Math.min(1F, since / 80F));
                      c.rect(tx + w * 0.15F, ty + h * 0.7F, tx + w * 0.85F, ty + h * 0.78F, 0.1F, 0xFF303840);
                      c.rect(tx + w * 0.15F, ty + h * 0.7F, tx + w * (0.15F + 0.7F * p), ty + h * 0.78F, 0.2F, 0xFF3CB4FF);
                      osdName(c, xvr, ch, tx, ty, k);
                      return;
                  }
                  ResourceLocation feed = allowLive ? CameraFeeds.request(cam) : null;
                  int v = Math.min(255, xvr.getBrightness() * 255 / 100);
                  int tint = 0xFF000000 | (v << 16) | (v << 8) | v;
                  if (feed != null) {
                      float u0 = xvr.isChannelMirror(ch) ? 1F : 0F;
                      c.image(feed, tx, ty, tx + w, ty + h, 0.02F, u0, 1F, 1F - u0, 0F, tint);
                  } else {
                      int[] sky = {0xFF6F7F88, 0xFF7B8B94, 0xFF8797A0, 0xFF93A3AC};
                      int[] gnd = {0xFF4E524C, 0xFF43473F, 0xFF383C35, 0xFF2E322B};
                      for (int i = 0; i < 4; i++) {
                          c.rect(tx, ty + i * h * 0.1125F, tx + w, ty + (i + 1) * h * 0.1125F, 0F, sky[i]);
                          c.rect(tx, ty + h * 0.45F + i * h * 0.1375F, tx + w, ty + h * 0.45F + (i + 1) * h * 0.1375F, 0F, gnd[i]);
                      }
                      c.text(allowLive ? "LOADING LIVE VIEW..." : "OUT OF RANGE", tx + w * 0.12F, ty + h * 0.45F, 0.7F * k, 0xFFFFFFFF);
                  }
                  osdName(c, xvr, ch, tx, ty, k);
                  if (xvr.isOsdTime()) {
                      float s = 0.55F * k;
                      float tw = c.width(clock) * s;
                      c.rect(tx + 2F * k, ty + h - 8F * k, tx + 2F * k + tw + 3F * k, ty + h - 2F * k, 0.1F, 0x99000000);
                      c.text(clock, tx + 3.5F * k, ty + h - 7.2F * k, s, 0xFFFFFFFF);
                  }
                  if (xvr.isRecInd() && recActive && xvr.isChannelRec(ch)) {
                      if (((int) (t / 10F)) % 2 == 0) {
                          c.rect(tx + w - 17F * k, ty + 3F * k, tx + w - 13F * k, ty + 7F * k, 0.2F, 0xFFE02020);
                      }
                      c.text("REC", tx + w - 12F * k, ty + 2.8F * k, 0.6F * k, 0xFFFFFFFF);
                  }
              }

              private static void osdName(ScreenCanvas c, XvrBlockEntity xvr, int ch, float tx, float ty, float k) {
                  if (!xvr.isOsdName()) {
                      return;
                  }
                  String name = xvr.getChannelName(ch);
                  float s = 0.7F * k;
                  float tw = c.width(name) * s;
                  c.rect(tx + 2F * k, ty + 2F * k, tx + 2F * k + tw + 3F * k, ty + 9F * k, 0.1F, 0x99000000);
                  c.text(name, tx + 3.5F * k, ty + 3F * k, s, 0xFFFFFFFF);
              }

              private static void noiseTile(ScreenCanvas c, int ch, float tx, float ty, float w, float h, float t, float k) {
                  int seed = (int) (t / 2F);
                  float ou = (hash(seed, ch, 1) & 255) / 255F;
                  float ov = (hash(seed, ch, 2) & 255) / 255F;
                  c.image(ScreenCanvas.NOISE, tx, ty, tx + w, ty + h, 0.01F, ou, ov, ou + 0.5F, ov + 0.28F, 0xFFFFFFFF);
                  c.rect(tx + w * 0.15F, ty + h * 0.36F, tx + w * 0.85F, ty + h * 0.64F, 0.1F, 0xCC000000);
                  c.textC("NO SIGNAL", tx + w / 2F, ty + h * 0.42F, 0.8F * k, 0xFFFF3030);
                  c.rect(tx + 2F * k, ty + 2F * k, tx + 18F * k, ty + 9F * k, 0.1F, 0xAA000000);
                  c.text("CH" + (ch + 1), tx + 3.5F * k, ty + 3F * k, 0.7F * k, 0xFFFFFFFF);
              }

              private static int hash(int a, int b, int c) {
                  int h = a * 374761393 + b * 668265263 + c * 1274126177;
                  h = (h ^ (h >>> 13)) * 1274126177;
                  return h ^ (h >>> 16);
              }
          }
          EOF_FILE
          cat > tools/gen_assets.py <<'EOF_FILE'
          import os, json, zlib, struct, random, math

          random.seed(2024)
          MODID = 'immersivecctv'
          RES = os.path.join('src', 'main', 'resources')
          ASSETS = os.path.join(RES, 'assets', MODID)
          DATA = os.path.join(RES, 'data', MODID)


          def clamp(v):
              return max(0, min(255, int(v)))


          def ensure(path):
              d = os.path.dirname(path)
              if d:
                  os.makedirs(d, exist_ok=True)


          def wjson(path, obj):
              ensure(path)
              with open(path, 'w') as f:
                  json.dump(obj, f, indent=2)


          def wtext(path, text):
              ensure(path)
              with open(path, 'w') as f:
                  f.write(text)


          class Img:
              def __init__(self, w, h, base=(0, 0, 0), alpha=255):
                  self.w = w
                  self.h = h
                  self.px = [[base[0], base[1], base[2], alpha] for _ in range(w * h)]

              def put(self, x, y, c):
                  x = int(x)
                  y = int(y)
                  if 0 <= x < self.w and 0 <= y < self.h:
                      self.px[y * self.w + x] = [clamp(c[0]), clamp(c[1]), clamp(c[2]), 255]

              def blend(self, x, y, c, f):
                  x = int(x)
                  y = int(y)
                  if 0 <= x < self.w and 0 <= y < self.h:
                      p = self.px[y * self.w + x]
                      for k in range(3):
                          p[k] = clamp(p[k] + (c[k] - p[k]) * f)
                      p[3] = 255

              def rect(self, x0, y0, x1, y1, c):
                  for y in range(int(y0), int(y1)):
                      for x in range(int(x0), int(x1)):
                          self.put(x, y, c)

              def shade(self, x0, y0, x1, y1, top, bot):
                  n = max(1, int(y1) - int(y0) - 1)
                  for y in range(int(y0), int(y1)):
                      t = (y - int(y0)) / n
                      c = tuple(top[k] + (bot[k] - top[k]) * t for k in range(3))
                      for x in range(int(x0), int(x1)):
                          self.put(x, y, c)

              def circle(self, cx, cy, r, c):
                  for y in range(int(cy - r - 1), int(cy + r + 2)):
                      for x in range(int(cx - r - 1), int(cx + r + 2)):
                          if (x + 0.5 - cx) ** 2 + (y + 0.5 - cy) ** 2 <= r * r:
                              self.put(x, y, c)

              def ring(self, cx, cy, r0, r1, c):
                  for y in range(int(cy - r1 - 1), int(cy + r1 + 2)):
                      for x in range(int(cx - r1 - 1), int(cx + r1 + 2)):
                          d = (x + 0.5 - cx) ** 2 + (y + 0.5 - cy) ** 2
                          if r0 * r0 <= d <= r1 * r1:
                              self.put(x, y, c)

              def glow(self, cx, cy, r, c, strength):
                  for y in range(int(cy - r - 1), int(cy + r + 2)):
                      for x in range(int(cx - r - 1), int(cx + r + 2)):
                          d = math.sqrt((x + 0.5 - cx) ** 2 + (y + 0.5 - cy) ** 2)
                          if d < r:
                              self.blend(x, y, c, (1 - d / r) * strength)

              def line(self, x0, y0, x1, y1, c, r=0.8):
                  n = int(max(abs(x1 - x0), abs(y1 - y0)) * 2) + 1
                  for i in range(n + 1):
                      t = i / n
                      self.circle(x0 + (x1 - x0) * t, y0 + (y1 - y0) * t, r, c)

              def noise(self, amt, x0=0, y0=0, x1=None, y1=None):
                  x1 = self.w if x1 is None else x1
                  y1 = self.h if y1 is None else y1
                  for y in range(y0, y1):
                      for x in range(x0, x1):
                          p = self.px[y * self.w + x]
                          if p[3] == 0:
                              continue
                          d = random.randint(-amt, amt)
                          for k in range(3):
                              p[k] = clamp(p[k] + d)

              def save(self, path):
                  ensure(path)
                  raw = bytearray()
                  for y in range(self.h):
                      raw.append(0)
                      for x in range(self.w):
                          raw.extend(bytes(self.px[y * self.w + x]))

                  def chunk(t, d):
                      c = struct.pack('>I', len(d)) + t + d
                      return c + struct.pack('>I', zlib.crc32(t + d) & 0xffffffff)

                  png = b'\x89PNG\r\n\x1a\n'
                  png += chunk(b'IHDR', struct.pack('>IIBBBBB', self.w, self.h, 8, 6, 0, 0, 0))
                  png += chunk(b'IDAT', zlib.compress(bytes(raw), 9))
                  png += chunk(b'IEND', b'')
                  with open(path, 'wb') as f:
                      f.write(png)


          def brushed(im, base, amt=4, streak=2):
              im.rect(0, 0, im.w, im.h, base)
              for y in range(im.h):
                  d = random.randint(-streak, streak)
                  for x in range(im.w):
                      p = im.px[y * im.w + x]
                      n = random.randint(-amt, amt) + d
                      for k in range(3):
                          p[k] = clamp(p[k] + n)


          def tex(name, im):
              im.save(os.path.join(ASSETS, 'textures', 'block', name + '.png'))


          def itex(name, im):
              im.save(os.path.join(ASSETS, 'textures', 'item', name + '.png'))


          METAL = (150, 152, 158)
          DARK = (8, 8, 10)
          GOLD = (205, 175, 60)

          # ---------------------------------------------------------------- helpers in "uv units"
          # Face regions use a 16x16 uv grid on a 128 px texture => 8 px per unit.
          # XVR front/back: u = 0..16, y 0.5..5.5 (top at 5.5) maps to px rows 48..88.


          def uvrect(im, u0, u1, y0, y1, c):
              im.rect(u0 * 8, 48 + (5.5 - y1) * 8, u1 * 8, 48 + (5.5 - y0) * 8, c)


          def uvcirc(im, u, y, r, c):
              im.circle(u * 8, 48 + (5.5 - y) * 8, r * 8, c)


          def xvr_base(top, bot):
              im = Img(128, 128, (22, 22, 25))
              brushed(im, (24, 24, 27), 3, 2)
              im.shade(8, 48, 120, 88, top, bot)
              im.rect(8, 48, 120, 49, (78, 78, 86))
              im.rect(8, 87, 120, 88, (10, 10, 12))
              im.rect(8, 48, 9, 88, (54, 54, 60))
              im.rect(119, 48, 120, 88, (14, 14, 16))
              return im


          def xvr_front():
              im = xvr_base((44, 44, 49), (24, 24, 27))
              # brand badge
              uvrect(im, 1.8, 4.8, 3.9, 5.0, METAL)
              uvrect(im, 1.9, 4.7, 4.0, 4.9, (40, 40, 46))
              for k in range(3):
                  uvrect(im, 2.2 + k * 0.8, 2.6 + k * 0.8, 4.2, 4.7, (170, 172, 178))
              # drive bay with vents
              uvrect(im, 5.6, 9.8, 3.2, 4.7, (6, 6, 7))
              uvrect(im, 5.6, 9.8, 3.05, 3.2, (72, 72, 78))
              for k in range(10):
                  uvrect(im, 5.8 + k * 0.4, 5.9 + k * 0.4, 3.5, 4.4, (28, 28, 32))
              # two USB ports
              for ux in (1.8, 3.3):
                  uvrect(im, ux, ux + 1.2, 1.3, 2.2, METAL)
                  uvrect(im, ux + 0.1, ux + 1.1, 1.4, 2.1, DARK)
                  uvrect(im, ux + 0.2, ux + 1.0, 1.6, 1.9, (40, 70, 170))
              # LED lenses (unlit; the lit state is drawn live by the game)
              for u, col in ((10.4, (70, 12, 12)), (11.1, (12, 28, 70)), (11.8, (12, 60, 20))):
                  uvrect(im, u - 0.2, u + 0.2, 3.2, 3.6, col)
              # power button
              uvcirc(im, 13.2, 3.0, 1.0, (14, 14, 16))
              uvcirc(im, 13.2, 3.0, 0.85, (88, 90, 96))
              uvcirc(im, 13.2, 3.0, 0.62, (130, 132, 138))
              im.line(13.2 * 8, 48 + (5.5 - 3.5) * 8, 13.2 * 8, 48 + (5.5 - 3.0) * 8, (40, 40, 44), 0.8)
              return im


          def xvr_back():
              im = xvr_base((36, 36, 40), (24, 24, 27))
              # power inlet
              uvcirc(im, 1.9, 1.7, 0.62, METAL)
              uvcirc(im, 1.9, 1.7, 0.45, DARK)
              uvcirc(im, 1.9, 1.7, 0.12, GOLD)
              # fan grille
              fu, fy = 4.2, 1.8
              uvcirc(im, fu, fy, 0.92, (50, 50, 55))
              uvcirc(im, fu, fy, 0.8, (10, 10, 12))
              for a in range(8):
                  ang = a * math.pi / 4
                  im.line(fu * 8, 48 + (5.5 - fy) * 8,
                          fu * 8 + math.cos(ang) * 6.4, 48 + (5.5 - fy) * 8 + math.sin(ang) * 6.4, (70, 70, 76), 0.5)
              uvcirc(im, fu, fy, 0.18, (60, 60, 66))
              # VGA (decorative)
              uvrect(im, 1.2, 2.2, 3.55, 4.25, (40, 60, 150))
              for k in range(5):
                  im.put(1.35 * 8 + k * 4, 48 + (5.5 - 3.9) * 8, (200, 200, 210))
              # HDMI OUT
              uvrect(im, 2.3, 4.3, 3.5, 4.3, METAL)
              uvrect(im, 2.4, 4.2, 3.6, 4.2, DARK)
              uvrect(im, 2.6, 4.0, 3.65, 3.8, GOLD)
              uvrect(im, 2.3, 4.3, 3.4, 3.5, (60, 60, 66))
              # 16 LAN (RJ45) ports in two rows of eight, with link LED lenses on top
              for i in range(16):
                  cx = 5.6 + (i % 8) * 1.15
                  cyy = 4.35 if i < 8 else 2.55
                  uvrect(im, cx - 0.5, cx + 0.5, cyy - 0.625, cyy + 0.625, METAL)
                  uvrect(im, cx - 0.42, cx + 0.42, cyy - 0.55, cyy + 0.25, DARK)
                  uvrect(im, cx - 0.12, cx + 0.12, cyy + 0.0, cyy + 0.25, (28, 28, 32))
                  uvrect(im, cx - 0.36, cx + 0.36, cyy - 0.5, cyy - 0.3, GOLD)
                  for k in range(4):
                      im.rect((cx - 0.34) * 8 + k * 1.9, 48 + (5.5 - (cyy - 0.3)) * 8,
                              (cx - 0.34) * 8 + k * 1.9 + 0.6, 48 + (5.5 - (cyy - 0.5)) * 8, (90, 70, 20))
                  uvrect(im, cx - 0.42, cx - 0.1, cyy + 0.32, cyy + 0.58, (14, 50, 22))
                  uvrect(im, cx + 0.1, cx + 0.42, cyy + 0.32, cyy + 0.58, (70, 38, 10))
              return im


          def xvr_top():
              im = Img(128, 128, (34, 34, 38))
              brushed(im, (34, 34, 38), 3, 2)
              for x in range(20, 108, 5):
                  im.rect(x, 36, x + 2, 76, (10, 10, 12))
                  im.rect(x + 2, 36, x + 3, 76, (52, 52, 58))
              im.rect(80, 88, 114, 106, (205, 205, 208))
              im.rect(80, 88, 114, 89, (150, 150, 155))
              k = 84
              while k < 110:
                  w = random.choice([1, 1, 2])
                  im.rect(k, 92, k + w, 102, (30, 30, 30))
                  k += w + random.choice([1, 2])
              for sx, sy in ((14, 22), (114, 22), (14, 106), (114, 106)):
                  im.circle(sx, sy, 2.6, (92, 92, 98))
                  im.line(sx - 1.6, sy, sx + 1.6, sy, (30, 30, 34), 0.5)
              return im


          def xvr_side():
              im = Img(128, 128, (28, 28, 32))
              brushed(im, (28, 28, 32), 3, 2)
              im.rect(16, 48, 112, 49, (70, 70, 76))
