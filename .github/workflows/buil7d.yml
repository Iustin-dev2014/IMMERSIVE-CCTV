          package com.immersivecctv;

          import com.mojang.blaze3d.vertex.PoseStack;
          import net.minecraft.client.Minecraft;
          import net.minecraft.client.gui.GuiGraphics;
          import net.minecraft.client.gui.components.Button;
          import net.minecraft.client.gui.components.EditBox;
          import net.minecraft.client.gui.screens.Screen;
          import net.minecraft.core.BlockPos;
          import net.minecraft.network.chat.Component;
          import net.minecraft.world.level.Level;
          import net.minecraft.world.level.block.entity.BlockEntity;

          import java.time.LocalDateTime;
          import java.time.format.DateTimeFormatter;
          import java.util.function.Consumer;

          /** Full screen XVR interface: live view with the mouse, plus the real settings menu. */
          public class XvrScreen extends Screen {
              private static final String[] TAB_NAMES = {"Display", "Channels", "Record", "Time", "Network", "System"};
              private static final String[] TAB_SHORT = {"Disp", "Chan", "Rec", "Time", "Net", "Sys"};
              private static final int TOOLBAR_H = 24;

              private final BlockPos monitorPos;
              private int tab = -1;          // -1 = live view, -2 = PIN prompt, 0..5 = menu tabs
              private int selCh = 0;
              private int focus = -1;
              private boolean unlocked = false;
              private boolean wrongPin = false;
              private boolean confirmReset = false;
              private String usedPin = "";
              private int lastHash = 0;

              private String nameText = null;
              private String devText = null;
              private String pinText = "";
              private String newPinText = "";

              // layout of the menu panel (recomputed in init)
              private int px;
              private int py;
              private int pw;
              private int ph;
              private int c1;
              private int c2;
              private int cw;
              private int cy;
              private int rowH = 22;
              private int btnH = 18;
              private int infoY;

              public XvrScreen(BlockPos monitorPos) {
                  super(Component.literal("XVR"));
                  this.monitorPos = monitorPos;
              }

              @Override
              public boolean isPauseScreen() {
                  return false;
              }

              private XvrBlockEntity xvr() {
                  Level lv = Minecraft.getInstance().level;
                  if (lv == null) {
                      return null;
                  }
                  BlockEntity be = lv.getBlockEntity(monitorPos);
                  if (!(be instanceof MonitorBlockEntity)) {
                      return null;
                  }
                  BlockPos xp = ((MonitorBlockEntity) be).getXvrPos();
                  if (xp == null) {
                      return null;
                  }
                  BlockEntity xb = lv.getBlockEntity(xp);
                  return xb instanceof XvrBlockEntity ? (XvrBlockEntity) xb : null;
              }

              private boolean needsPin(XvrBlockEntity x) {
                  return x != null && !x.getPin().isEmpty() && !unlocked;
              }

              private void send(int action, int arg, String text) {
                  XvrBlockEntity x = xvr();
                  if (x == null) {
                      return;
                  }
                  Net.CHANNEL.sendToServer(new XvrActionPacket(x.getBlockPos(), action, arg,
                          text == null ? "" : text, usedPin));
              }

              /** Runs a protected action, asking for the PIN first if one is set. */
              private void secure(Runnable r) {
                  if (needsPin(xvr())) {
                      tab = -2;
                      rebuildWidgets();
                  } else {
                      r.run();
                  }
              }

              private String fit(String s, int w) {
                  return this.font.plainSubstrByWidth(s, Math.max(10, w));
              }

              private Button btn(int x, int y, int w, String label, Runnable r) {
                  return addRenderableWidget(Button.builder(Component.literal(fit(label, w - 8)), b -> r.run())
                          .bounds(x, y, w, btnH).build());
              }

              private EditBox edit(int x, int y, int w, String value, int max, Consumer<String> responder) {
                  EditBox box = new EditBox(this.font, x, y, w, btnH, Component.literal(""));
                  box.setMaxLength(max);
                  box.setValue(value == null ? "" : value);
                  box.setResponder(responder);
                  addRenderableWidget(box);
                  return box;
              }

              private static String onOff(boolean b) {
                  return b ? "ON" : "OFF";
              }

              private static String layoutName(int n) {
                  return n == 1 ? "1x1" : n == 4 ? "2x2" : n == 9 ? "3x3" : "4x4";
              }

              // ------------------------------------------------------------------ widgets

              @Override
              protected void init() {
                  XvrBlockEntity x = xvr();
                  if (x != null) {
                      lastHash = x.settingsHash();
                      if (!x.isPowered() && tab != -1) {
                          tab = -1;
                      }
                  }
                  // compact metrics for small screens
                  ph = height - TOOLBAR_H - 8;
                  rowH = ph < 200 ? 20 : 22;
                  btnH = rowH - 4;
                  toolbar(x);
                  if (tab == -2) {
                      buildPin();
                  } else if (tab >= 0 && x != null) {
                      buildMenu(x);
                  }
              }

              private void toolbar(XvrBlockEntity x) {
                  int y = height - TOOLBAR_H + 3;
                  int gap = 4;
                  int avail = width - 12 - 5 * gap;
                  float[] wt = {2.0F, 2.6F, 0.8F, 0.8F, 2.2F, 1.6F};
                  int[] w = new int[6];
                  for (int i = 0; i < 6; i++) {
                      w[i] = Math.max(22, (int) (avail * wt[i] / 10.0F));
                  }
                  boolean compact = w[1] < 84;
                  int bx = 6;
                  btn(bx, y, w[0], tab == -1 ? "Menu" : (compact ? "Live" : "Live view"), () -> {
                      if (tab == -1) {
                          tab = needsPin(xvr()) ? -2 : 0;
                      } else {
                          tab = -1;
                      }
                      rebuildWidgets();
                  });
                  bx += w[0] + gap;
                  int cur = x == null ? 4 : x.getLayout();
                  btn(bx, y, w[1], compact ? layoutName(cur) : "Layout: " + layoutName(cur), () -> {
                      int next = cur == 1 ? 4 : cur == 4 ? 9 : cur == 9 ? 16 : 1;
                      focus = -1;
                      send(XvrBlockEntity.A_LAYOUT, next, null);
                  });
                  bx += w[1] + gap;
                  btn(bx, y, w[2], "<", () -> nav(-1));
                  bx += w[2] + gap;
                  btn(bx, y, w[3], ">", () -> nav(1));
                  bx += w[3] + gap;
                  btn(bx, y, w[4], compact ? "Power" : "Shutdown",
                          () -> secure(() -> send(XvrBlockEntity.A_SHUTDOWN, 0, null)));
                  bx += w[4] + gap;
                  btn(bx, y, width - 6 - bx, "Close", this::onClose);
              }

              private void nav(int delta) {
                  if (focus >= 0) {
                      focus = (focus + delta + XvrBlockEntity.CHANNELS) % XvrBlockEntity.CHANNELS;
                  } else {
                      send(XvrBlockEntity.A_PAGE, delta, null);
                  }
              }

              private void buildPin() {
                  int bw = Math.min(180, width - 20);
                  int bx = width / 2 - bw / 2;
                  int by = height / 2 - 20;
                  edit(bx, by, bw, pinText, 8, s -> pinText = s).setFilter(s -> s.matches("[0-9]*"));
                  btn(bx, by + rowH + 2, bw, "Unlock", () -> {
                      XvrBlockEntity x = xvr();
                      if (x != null && x.getPin().equals(pinText)) {
                          unlocked = true;
                          usedPin = pinText;
                          pinText = "";
                          wrongPin = false;
                          tab = 0;
                      } else {
                          wrongPin = true;
                      }
                      rebuildWidgets();
                  });
              }

              private void buildMenu(XvrBlockEntity x) {
                  px = 6;
                  py = 4;
                  pw = width - 12;
                  // tab bar
                  int gap = 3;
                  int tabW = (pw - 12 - 5 * gap) / 6;
                  boolean shortTabs = tabW < 56;
                  for (int i = 0; i < 6; i++) {
                      final int idx = i;
                      String label = shortTabs ? TAB_SHORT[i] : TAB_NAMES[i];
                      btn(px + 6 + i * (tabW + gap), py + 4, tabW, (i == tab ? "> " : "") + label, () -> {
                          tab = idx;
                          confirmReset = false;
                          rebuildWidgets();
                      });
                  }
                  cw = Math.max(90, Math.min(200, (pw - 36) / 2));
                  c1 = px + 12;
                  c2 = c1 + cw + 12;
                  cy = py + 4 + btnH + 8;
                  int rows;
                  switch (tab) {
                      case 0:
                          rows = displayTab(x);
                          break;
                      case 1:
                          rows = channelsTab(x);
                          break;
                      case 2:
                          rows = recordTab(x);
                          break;
                      case 3:
                          rows = timeTab(x);
                          break;
                      case 4:
                          rows = networkTab(x);
                          break;
                      default:
                          rows = systemTab(x);
                          break;
                  }
                  infoY = cy + rows * rowH + 2;
              }

              private int displayTab(XvrBlockEntity x) {
                  btn(c1, cy, cw, "OSD name: " + onOff(x.isOsdName()),
                          () -> send(XvrBlockEntity.A_OSD_NAME, 0, null));
                  btn(c2, cy, cw, "OSD date/time: " + onOff(x.isOsdTime()),
                          () -> send(XvrBlockEntity.A_OSD_TIME, 0, null));
                  btn(c1, cy + rowH, cw, "REC indicator: " + onOff(x.isRecInd()),
                          () -> send(XvrBlockEntity.A_REC_IND, 0, null));
                  btn(c2, cy + rowH, cw, "Layout: " + layoutName(x.getLayout()), () -> {
                      int cur = x.getLayout();
                      send(XvrBlockEntity.A_LAYOUT, cur == 1 ? 4 : cur == 4 ? 9 : cur == 9 ? 16 : 1, null);
                  });
                  btn(c1, cy + 2 * rowH, cw, "Brightness - (" + x.getBrightness() + "%)",
                          () -> send(XvrBlockEntity.A_BRIGHT, -10, null));
                  btn(c2, cy + 2 * rowH, cw, "Brightness +",
                          () -> send(XvrBlockEntity.A_BRIGHT, 10, null));
                  btn(c1, cy + 3 * rowH, cw, "Live render: " + onOff(ClientPrefs.liveRender), () -> {
                      ClientPrefs.liveRender = !ClientPrefs.liveRender;
                      rebuildWidgets();
                  });
                  btn(c2, cy + 3 * rowH, cw, "Quality: " + ClientPrefs.qualityName(), () -> {
                      ClientPrefs.quality = (ClientPrefs.quality + 1) % ClientPrefs.qualityCount();
                      rebuildWidgets();
                  });
                  btn(c1, cy + 4 * rowH, cw, "Feed rate: " + ClientPrefs.fps() + "/s", () -> {
                      ClientPrefs.fpsIndex = (ClientPrefs.fpsIndex + 1) % ClientPrefs.fpsCount();
                      rebuildWidgets();
                  });
                  return 5;
              }

              private int channelsTab(XvrBlockEntity x) {
                  btn(c1, cy, cw, "< Previous channel", () -> {
                      selCh = (selCh + XvrBlockEntity.CHANNELS - 1) % XvrBlockEntity.CHANNELS;
                      nameText = null;
                      rebuildWidgets();
                  });
                  btn(c2, cy, cw, "Next channel >", () -> {
                      selCh = (selCh + 1) % XvrBlockEntity.CHANNELS;
                      nameText = null;
                      rebuildWidgets();
                  });
                  if (nameText == null) {
                      nameText = x.getRawChannelName(selCh);
                  }
                  edit(c1, cy + rowH, cw, nameText, 20, s -> nameText = s);
                  btn(c2, cy + rowH, cw, "Apply name", () -> send(XvrBlockEntity.A_CH_NAME, selCh, nameText));
                  btn(c1, cy + 2 * rowH, cw, "Enabled: " + onOff(x.isChannelEnabled(selCh)),
                          () -> send(XvrBlockEntity.A_CH_ENABLE, selCh, null));
                  btn(c2, cy + 2 * rowH, cw, "Mirror: " + onOff(x.isChannelMirror(selCh)),
                          () -> send(XvrBlockEntity.A_CH_MIRROR, selCh, null));
                  btn(c1, cy + 3 * rowH, cw, "Recording: " + onOff(x.isChannelRec(selCh)),
                          () -> secure(() -> send(XvrBlockEntity.A_CH_REC, selCh, null)));
                  btn(c2, cy + 3 * rowH, cw, "View this channel", () -> {
                      focus = selCh;
                      tab = -1;
                      rebuildWidgets();
                  });
                  return 4;
              }

              private int recordTab(XvrBlockEntity x) {
                  btn(c1, cy, cw, "Recording: " + onOff(x.isRecAll()),
                          () -> secure(() -> send(XvrBlockEntity.A_REC_ALL, 0, null)));
                  btn(c2, cy, cw, "Overwrite: " + onOff(x.isOverwrite()),
                          () -> secure(() -> send(XvrBlockEntity.A_OVERWRITE, 0, null)));
                  btn(c1, cy + rowH, cw, "Format HDD",
                          () -> secure(() -> send(XvrBlockEntity.A_FORMAT, 0, null)));
                  return 2;
              }

              private int timeTab(XvrBlockEntity x) {
                  btn(c1, cy, cw, "Source: " + (x.isTimeReal() ? "REAL CLOCK" : "GAME TIME"),
                          () -> send(XvrBlockEntity.A_TIME_SRC, 0, null));
                  btn(c2, cy, cw, "Format: " + new String[]{"YYYY-MM-DD", "DD-MM-YYYY", "MM-DD-YYYY"}[x.getDateFmt() % 3],
                          () -> send(XvrBlockEntity.A_DATE_FMT, 0, null));
                  btn(c1, cy + rowH, cw, "Time zone - (UTC" + (x.getTzOffset() >= 0 ? "+" : "") + x.getTzOffset() + ")",
                          () -> send(XvrBlockEntity.A_TZ, -1, null));
                  btn(c2, cy + rowH, cw, "Time zone +",
                          () -> send(XvrBlockEntity.A_TZ, 1, null));
                  return 2;
              }

              private int networkTab(XvrBlockEntity x) {
                  btn(c1, cy, cw, "PoE to cameras: " + onOff(x.isPoe()),
                          () -> secure(() -> send(XvrBlockEntity.A_POE, 0, null)));
                  return 1;
              }

              private int systemTab(XvrBlockEntity x) {
                  if (devText == null) {
                      devText = x.getDeviceName();
                  }
                  edit(c1, cy, cw, devText, 16, s -> devText = s);
                  btn(c2, cy, cw, "Apply name", () -> secure(() -> send(XvrBlockEntity.A_DEVNAME, 0, devText)));
                  btn(c1, cy + rowH, cw, "Reboot", () -> secure(() -> send(XvrBlockEntity.A_REBOOT, 0, null)));
                  btn(c2, cy + rowH, cw, "Shutdown", () -> secure(() -> send(XvrBlockEntity.A_SHUTDOWN, 0, null)));
                  edit(c1, cy + 2 * rowH, cw, newPinText, 8, s -> newPinText = s).setFilter(s -> s.matches("[0-9]*"));
                  btn(c2, cy + 2 * rowH, cw, "Set PIN", () -> secure(() -> {
                      send(XvrBlockEntity.A_PIN_SET, 0, newPinText);
                      usedPin = newPinText;
                      unlocked = true;
                      newPinText = "";
                  }));
                  btn(c1, cy + 3 * rowH, cw, "Clear PIN", () -> secure(() -> {
                      send(XvrBlockEntity.A_PIN_SET, 0, "");
                      usedPin = "";
                  }));
                  btn(c2, cy + 3 * rowH, cw, confirmReset ? "Click again!" : "Factory reset", () -> {
                      if (!confirmReset) {
                          confirmReset = true;
                          rebuildWidgets();
                      } else {
                          confirmReset = false;
                          secure(() -> send(XvrBlockEntity.A_RESET, 0, null));
                      }
                  });
                  return 4;
              }

              // ------------------------------------------------------------------ logic

              @Override
              public void tick() {
                  XvrBlockEntity x = xvr();
                  if (x != null && x.settingsHash() != lastHash) {
                      rebuildWidgets();
                  }
              }

              @Override
              public boolean mouseClicked(double mx, double my, int button) {
                  if (super.mouseClicked(mx, my, button)) {
                      return true;
                  }
                  XvrBlockEntity x = xvr();
                  if (tab == -1 && button == 0 && x != null && x.isPowered()) {
                      float viewH = height - TOOLBAR_H;
                      float sc = Math.min(width / XvrView.W, viewH / XvrView.H);
                      float ox = (width - XvrView.W * sc) / 2F;
                      float oy = (viewH - XvrView.H * sc) / 2F;
                      float vx = (float) ((mx - ox) / sc);
                      float vy = (float) ((my - oy) / sc);
                      if (vx >= 0 && vy >= 0 && vx < XvrView.W && vy < XvrView.H) {
                          if (focus >= 0) {
                              focus = -1;
                          } else {
                              int n = x.getLayout();
                              int cols = n == 1 ? 1 : n == 4 ? 2 : n == 9 ? 3 : 4;
                              int idx = (int) (vy / (XvrView.H / cols)) * cols + (int) (vx / (XvrView.W / cols));
                              int ch = x.getPage() * n + idx;
                              if (ch < XvrBlockEntity.CHANNELS) {
                                  focus = ch;
                              }
                          }
                          return true;
                      }
                  }
                  return false;
              }

              // ------------------------------------------------------------------ rendering

              @Override
              public void render(GuiGraphics g, int mx, int my, float pt) {
                  g.fill(0, 0, width, height, 0xFF000000);
                  Level lv = Minecraft.getInstance().level;
                  XvrBlockEntity x = xvr();
                  if (lv != null) {
                      float viewH = height - TOOLBAR_H;
                      float sc = Math.min(width / XvrView.W, viewH / XvrView.H);
                      float ox = (width - XvrView.W * sc) / 2F;
                      float oy = (viewH - XvrView.H * sc) / 2F;
                      PoseStack ps = g.pose();
                      ps.pushPose();
                      ps.translate(ox, oy, 0F);
                      ps.scale(sc, sc, sc);
                      ScreenCanvas c = new ScreenCanvas(this.font);
                      float t = lv.getGameTime() + pt;
                      if (x == null || !x.isPowered()) {
                          XvrView.noSignal(c);
                      } else {
                          XvrView.draw(c, x, lv, t, focus, true);
                      }
                      c.flush(ps, g.bufferSource());
                      ps.popPose();
                      g.flush();
                  }
                  if (tab >= 0 && x != null) {
                      g.fill(0, 0, width, height - TOOLBAR_H, 0xB0000000);
                      g.fill(px, py, px + pw, py + ph, 0xF0101820);
                      g.fill(px, py, px + pw, py + 1, 0xFF3A7BD5);
                      g.fill(px, py + ph - 1, px + pw, py + ph, 0xFF3A7BD5);
                  } else if (tab == -2) {
                      g.fill(0, 0, width, height - TOOLBAR_H, 0xD0000000);
                  }
                  super.render(g, mx, my, pt);
                  if (tab == -2) {
                      g.drawString(this.font, "Enter the XVR PIN", width / 2 - this.font.width("Enter the XVR PIN") / 2,
                              height / 2 - 34, 0xFFFFFFFF, false);
                      if (wrongPin) {
                          g.drawString(this.font, "Wrong PIN", width / 2 - this.font.width("Wrong PIN") / 2,
                                  height / 2 + 2 * rowH + 8, 0xFFFF5555, false);
                      }
                  } else if (tab >= 0 && x != null) {
                      info(g, x);
                  }
                  if (tab == -1 && focus >= 0) {
                      g.drawString(this.font, "Click the picture to go back to the grid", 6, 4, 0xFFFFFFFF, true);
                  }
              }

              private void line(GuiGraphics g, String s, int x, int y, int color) {
                  g.drawString(this.font, fit(s, pw - 24), x, y, color, false);
              }

              private void info(GuiGraphics g, XvrBlockEntity x) {
                  int white = 0xFFE0E6F0;
                  switch (tab) {
                      case 0:
                          line(g, "Higher quality / feed rate needs a strong device.", c1, infoY, 0xFF9AA4B8);
                          break;
                      case 1: {
                          int ch = selCh;
                          line(g, "Channel " + (ch + 1) + " / 16    IP 192.168.1." + (101 + ch), c1, infoY, white);
                          String st = x.isOnline(ch) ? "ONLINE" : x.getCamera(ch) != null ? "OFFLINE" : "NO CAMERA";
                          line(g, "Status: " + st + "   (LAN port " + (ch + 1) + ")", c1, infoY + 11, white);
                          break;
                      }
                      case 2: {
                          long used = x.getHddUsedMb();
                          int pct = (int) (used * 100L / XvrBlockEntity.HDD_MB);
                          line(g, String.format("HDD 1 TB   used %.1f GB (%d%%)", used / 1000.0, pct), c1, infoY, white);
                          int bw = pw - 28;
                          g.fill(c1, infoY + 12, c1 + bw, infoY + 20, 0xFF303840);
                          g.fill(c1, infoY + 12, c1 + (int) (bw * used / (double) XvrBlockEntity.HDD_MB),
                                  infoY + 20, pct > 90 ? 0xFFE05050 : 0xFF3CB46E);
                          Level lv = Minecraft.getInstance().level;
                          int n = x.recordingChannels();
                          String rem = "-";
                          if (n > 0) {
                              long sec = (XvrBlockEntity.HDD_MB - used) / (30L * n);
                              rem = String.format("%dh %02dm", sec / 3600, (sec % 3600) / 60);
                          }
                          boolean rec = lv != null && x.isRecordingActive(lv.getGameTime());
                          line(g, (rec ? "RECORDING " + n + " ch" : "NOT RECORDING") + "    Time left: " + rem,
                                  c1, infoY + 24, white);
                          break;
                      }
                      case 3: {
                          String now = x.isTimeReal()
                                  ? LocalDateTime.now().plusHours(x.getTzOffset())
                                  .format(DateTimeFormatter.ofPattern("yyyy-MM-dd HH:mm:ss"))
                                  : "game clock";
                          line(g, "Current time: " + now, c1, infoY, white);
                          break;
                      }
                      case 4: {
                          line(g, "XVR IP 192.168.1.10    Online cameras: " + x.onlineCount() + " / 16", c1, infoY, white);
                          int colW = Math.max(120, (pw - 28) / 2);
                          for (int i = 0; i < XvrBlockEntity.CHANNELS; i++) {
                              int colx = i < 8 ? c1 : c1 + colW;
                              int rowy = infoY + 14 + (i % 8) * 10;
                              String st = x.isOnline(i) ? "ONLINE" : x.getCamera(i) != null ? "OFFLINE" : "-";
                              g.drawString(this.font, fit(String.format("CH%02d 192.168.1.%d %s", i + 1, 101 + i, st), colW - 6),
                                      colx, rowy, x.isOnline(i) ? 0xFF66FF88 : 0xFF8890A0, false);
                          }
                          break;
                      }
                      default: {
                          Level lv = Minecraft.getInstance().level;
                          long up = lv != null && x.isPowered() ? (lv.getGameTime() - x.getPowerOnTime()) / 20L : 0L;
                          line(g, "Firmware v2.31    Uptime " + up / 60 + " min " + up % 60 + " s", c1, infoY, white);
                          line(g, "PIN: " + (x.getPin().isEmpty() ? "not set" : "set")
                                  + "    Cameras: " + x.onlineCount() + "/16", c1, infoY + 11, white);
                          break;
                      }
                  }
              }
          }
