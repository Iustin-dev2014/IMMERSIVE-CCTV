name: Build Immersive CCTV
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.1.1
      - name: Create project, generate textures and build
        run: |
          rm -rf cctv-build
          mkdir -p cctv-build
          cd cctv-build
          mkdir -p tools src/main/java/com/immersivecctv
          cat > settings.gradle <<'EOF_FILE'
          pluginManagement {
              repositories {
                  gradlePluginPortal()
                  maven {
                      name = 'MinecraftForge'
                      url = 'https://maven.minecraftforge.net/'
                  }
              }
          }

          rootProject.name = 'immersivecctv'
          EOF_FILE
          cat > gradle.properties <<'EOF_FILE'
          org.gradle.jvmargs=-Xmx3G
          org.gradle.daemon=false
          EOF_FILE
          cat > build.gradle <<'EOF_FILE'
          plugins {
              id 'java'
              id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
          }

          version = '0.3.0'
          group = 'com.immersivecctv'

          base {
              archivesName = 'immersivecctv-1.20.1'
          }

          java.toolchain.languageVersion = JavaLanguageVersion.of(17)

          minecraft {
              mappings channel: 'official', version: '1.20.1'

              runs {
                  client {
                      workingDirectory project.file('run')
                      property 'forge.logging.console.level', 'debug'
                      mods {
                          immersivecctv {
                              source sourceSets.main
                          }
                      }
                  }
              }
          }

          dependencies {
              minecraft 'net.minecraftforge:forge:1.20.1-47.3.0'
          }

          tasks.named('jar', Jar).configure {
              finalizedBy 'reobfJar'
          }

          tasks.withType(JavaCompile).configureEach {
              options.encoding = 'UTF-8'
          }
          EOF_FILE
          cat > src/main/java/com/immersivecctv/CableItem.java <<'EOF_FILE'
          package com.immersivecctv;

          import net.minecraft.core.BlockPos;
          import net.minecraft.core.Direction;
          import net.minecraft.nbt.CompoundTag;
          import net.minecraft.network.chat.Component;
          import net.minecraft.sounds.SoundEvents;
          import net.minecraft.sounds.SoundSource;
          import net.minecraft.world.InteractionResult;
          import net.minecraft.world.entity.player.Player;
          import net.minecraft.world.item.Item;
          import net.minecraft.world.item.ItemStack;
          import net.minecraft.world.item.context.UseOnContext;
          import net.minecraft.world.level.Level;
          import net.minecraft.world.level.block.state.BlockState;
          import net.minecraft.world.level.block.state.properties.BlockStateProperties;
          import net.minecraft.world.phys.Vec3;

          public class CableItem extends Item {
              public enum Kind { HDMI, ETHERNET }

              private static final double MAX_ETHERNET = 64.0D;

              private final Kind kind;

              public CableItem(Properties properties, Kind kind) {
                  super(properties);
                  this.kind = kind;
              }

              public static void give(Player player, Item item) {
                  ItemStack s = new ItemStack(item);
                  if (!player.getInventory().add(s)) {
                      player.drop(s, false);
                  }
              }

              private static boolean isXvr(BlockState s) {
                  return s.getBlock() instanceof XvrBlock;
              }

              private boolean isOther(BlockState s) {
                  return kind == Kind.HDMI ? s.getBlock() instanceof MonitorBlock : s.getBlock() instanceof CameraBlock;
              }

              private String otherName() {
                  return kind == Kind.HDMI ? "monitor" : "camera";
              }

              private static void say(Player p, String msg) {
                  p.displayClientMessage(Component.literal(msg), true);
              }

              private static void clearLink(ItemStack stack) {
                  stack.removeTagKey("LinkPos");
                  stack.removeTagKey("LinkPort");
                  stack.removeTagKey("LinkDim");
              }

              private static void storeLink(ItemStack stack, BlockPos pos, int port, String dim) {
                  CompoundTag tag = stack.getOrCreateTag();
                  tag.putLong("LinkPos", pos.asLong());
                  tag.putInt("LinkPort", port);
                  tag.putString("LinkDim", dim);
              }

              @Override
              public InteractionResult useOn(UseOnContext ctx) {
                  Level level = ctx.getLevel();
                  BlockPos pos = ctx.getClickedPos();
                  BlockState state = level.getBlockState(pos);
                  if (!isXvr(state) && !isOther(state)) {
                      return InteractionResult.PASS;
                  }
                  if (level.isClientSide) {
                      return InteractionResult.SUCCESS;
                  }
                  Player player = ctx.getPlayer();
                  if (player == null) {
                      return InteractionResult.PASS;
                  }
                  ItemStack stack = ctx.getItemInHand();
                  String dim = level.dimension().location().toString();

                  // which socket did the player click?
                  Direction facing = state.getValue(BlockStateProperties.HORIZONTAL_FACING);
                  Vec3 l = Ports.hitLocal(ctx.getClickLocation(), pos, facing);
                  boolean rear = ctx.getClickedFace() == facing.getOpposite();
                  int port = -1;
                  if (rear) {
                      if (isXvr(state)) {
                          port = kind == Kind.HDMI ? (Ports.xvrHdmiAt(l) ? 0 : -1) : Ports.xvrLanAt(l);
                      } else {
                          boolean on = kind == Kind.HDMI ? Ports.monHdmiAt(l) : Ports.camLanAt(l);
                          port = on ? 0 : -1;
                      }
                  }
                  if (port < 0) {
                      say(player, kind == Kind.HDMI
                              ? "Click exactly on the HDMI port on the back panel."
                              : "Click exactly on a LAN (RJ45) port on the back.");
                      return InteractionResult.SUCCESS;
                  }

                  boolean hasLink = stack.hasTag() && stack.getTag().contains("LinkPos");
                  if (!hasLink) {
                      storeLink(stack, pos, port, dim);
                      say(player, "Cable end 1 plugged in. Now click the " + (isXvr(state) ? otherName() : "XVR") + " port.");
                      return InteractionResult.SUCCESS;
                  }

                  BlockPos first = BlockPos.of(stack.getTag().getLong("LinkPos"));
                  int firstPort = stack.getTag().getInt("LinkPort");
                  String firstDim = stack.getTag().getString("LinkDim");
                  if (first.equals(pos)) {
                      clearLink(stack);
                      say(player, "Cable unplugged.");
                      return InteractionResult.SUCCESS;
                  }
                  BlockState firstState = level.getBlockState(first);
                  boolean firstValid = firstDim.equals(dim) && (isXvr(firstState) || isOther(firstState));
                  if (!firstValid) {
                      storeLink(stack, pos, port, dim);
                      say(player, "The first device is gone. Cable end 1 plugged in here.");
                      return InteractionResult.SUCCESS;
                  }
                  boolean compatible = (isXvr(firstState) && isOther(state)) || (isOther(firstState) && isXvr(state));
                  if (!compatible) {
                      say(player, "This cable connects an XVR with a " + otherName() + ".");
                      return InteractionResult.SUCCESS;
                  }

                  BlockPos xvrPos = isXvr(state) ? pos : first;
                  int xvrPort = isXvr(state) ? port : firstPort;
                  BlockPos otherPos = isXvr(state) ? first : pos;
                  if (kind == Kind.ETHERNET && xvrPos.distSqr(otherPos) > MAX_ETHERNET * MAX_ETHERNET) {
                      say(player, "Cable too short (max 64 blocks).");
                      return InteractionResult.SUCCESS;
                  }
                  if (!(level.getBlockEntity(xvrPos) instanceof XvrBlockEntity xvr)) {
                      return InteractionResult.SUCCESS;
                  }

                  boolean done = kind == Kind.HDMI
                          ? connectHdmi(level, xvr, xvrPos, otherPos, player)
                          : connectEthernet(level, xvr, xvrPort, otherPos, player);
                  if (done) {
                      clearLink(stack);
                      if (!player.getAbilities().instabuild) {
                          stack.shrink(1);
                      }
                      level.playSound(null, xvrPos, SoundEvents.ITEM_FRAME_ADD_ITEM, SoundSource.BLOCKS, 1.0F, 1.0F);
                  }
                  return InteractionResult.SUCCESS;
              }

              private boolean connectHdmi(Level level, XvrBlockEntity xvr, BlockPos xvrPos, BlockPos monPos, Player p) {
                  if (!(level.getBlockEntity(monPos) instanceof MonitorBlockEntity mon)) {
                      return false;
                  }
                  BlockPos oldMon = xvr.getMonitorPos();
                  if (oldMon != null && !oldMon.equals(monPos)
                          && level.getBlockEntity(oldMon) instanceof MonitorBlockEntity om) {
                      om.setXvrPos(null);
                  }
                  BlockPos oldXvr = mon.getXvrPos();
                  if (oldXvr != null && !oldXvr.equals(xvrPos)
                          && level.getBlockEntity(oldXvr) instanceof XvrBlockEntity ox) {
                      ox.setMonitorPos(null);
                  }
                  xvr.setMonitorPos(monPos);
                  mon.setXvrPos(xvrPos);
                  say(p, "HDMI connected: XVR -> monitor.");
                  return true;
              }

              private boolean connectEthernet(Level level, XvrBlockEntity xvr, int port, BlockPos camPos, Player p) {
                  int r = xvr.connectCamera(port, camPos, level.getGameTime());
                  if (r == -2) {
                      say(p, "This camera is already connected to the XVR.");
                      return false;
                  }
                  if (r == -1) {
                      say(p, "LAN port " + (port + 1) + " is already in use.");
                      return false;
                  }
                  say(p, "Camera connected to LAN " + (port + 1) + " (channel " + (port + 1) + ").");
                  return true;
              }
          }
          EOF_FILE
          cat > src/main/java/com/immersivecctv/CameraBlock.java <<'EOF_FILE'
          package com.immersivecctv;

          import net.minecraft.core.BlockPos;
          import net.minecraft.core.Direction;
          import net.minecraft.world.item.context.BlockPlaceContext;
          import net.minecraft.world.level.BlockGetter;
          import net.minecraft.world.level.block.Block;
          import net.minecraft.world.level.block.state.BlockState;
          import net.minecraft.world.level.block.state.StateDefinition;
          import net.minecraft.world.level.block.state.properties.BlockStateProperties;
          import net.minecraft.world.level.block.state.properties.DirectionProperty;
          import net.minecraft.world.phys.shapes.CollisionContext;
          import net.minecraft.world.phys.shapes.VoxelShape;

          public class CameraBlock extends Block {
              public static final DirectionProperty FACING = BlockStateProperties.HORIZONTAL_FACING;

              private static final VoxelShape NORTH = Block.box(5, 0, 1, 11, 9, 12);
              private static final VoxelShape SOUTH = Block.box(5, 0, 4, 11, 9, 15);
              private static final VoxelShape EAST = Block.box(4, 0, 5, 15, 9, 11);
              private static final VoxelShape WEST = Block.box(1, 0, 5, 12, 9, 11);

              public CameraBlock(Properties properties) {
                  super(properties);
                  this.registerDefaultState(this.stateDefinition.any().setValue(FACING, Direction.NORTH));
              }

              @Override
              protected void createBlockStateDefinition(StateDefinition.Builder<Block, BlockState> builder) {
                  builder.add(FACING);
              }

              @Override
              public BlockState getStateForPlacement(BlockPlaceContext ctx) {
                  return this.defaultBlockState().setValue(FACING, ctx.getHorizontalDirection().getOpposite());
              }

              @Override
              public VoxelShape getShape(BlockState state, BlockGetter level, BlockPos pos, CollisionContext ctx) {
                  switch (state.getValue(FACING)) {
                      case SOUTH:
                          return SOUTH;
                      case EAST:
                          return EAST;
                      case WEST:
                          return WEST;
                      default:
                          return NORTH;
                  }
              }
          }
          EOF_FILE
          cat > src/main/java/com/immersivecctv/CameraFeeds.java <<'EOF_FILE'
          package com.immersivecctv;

          import com.mojang.blaze3d.pipeline.RenderTarget;
          import com.mojang.blaze3d.pipeline.TextureTarget;
          import com.mojang.blaze3d.systems.RenderSystem;
          import com.mojang.blaze3d.vertex.PoseStack;
          import com.mojang.blaze3d.vertex.VertexSorting;
          import com.mojang.logging.LogUtils;
          import com.mojang.math.Axis;
          import net.minecraft.Util;
          import net.minecraft.client.Camera;
          import net.minecraft.client.CameraType;
          import net.minecraft.client.Minecraft;
          import net.minecraft.client.renderer.texture.AbstractTexture;
          import net.minecraft.core.BlockPos;
          import net.minecraft.core.Direction;
          import net.minecraft.resources.ResourceLocation;
          import net.minecraft.server.packs.resources.ResourceManager;
          import net.minecraft.world.entity.Entity;
          import net.minecraft.world.level.BlockGetter;
          import net.minecraft.world.level.block.state.BlockState;
          import net.minecraft.world.phys.Vec3;
          import net.minecraftforge.api.distmarker.Dist;
          import net.minecraftforge.client.event.ClientPlayerNetworkEvent;
          import net.minecraftforge.event.TickEvent;
          import net.minecraftforge.eventbus.api.SubscribeEvent;
          import net.minecraftforge.fml.common.Mod;
          import org.joml.Matrix3f;
          import org.joml.Matrix4f;
          import org.slf4j.Logger;

          import java.io.IOException;
          import java.util.HashMap;
          import java.util.Iterator;
          import java.util.Map;

          /**
           * Real live camera feeds: every requested camera renders the world from its own position
           * into an off-screen texture, a few times per second, between two normal frames.
           * The player never moves.
           */
          @Mod.EventBusSubscriber(modid = ImmersiveCCTV.MODID, bus = Mod.EventBusSubscriber.Bus.FORGE, value = Dist.CLIENT)
          public final class CameraFeeds {
              private static final Logger LOGGER = LogUtils.getLogger();
              private static final int[] WIDTHS = {256, 384, 512, 768, 1280};
              private static final int[] HEIGHTS = {144, 216, 288, 432, 720};
              private static final float PITCH = 12.0F;
              private static final float FOV = 72.0F;

              private static final Map<BlockPos, Feed> FEEDS = new HashMap<>();
              private static final CctvCamera CAMERA = new CctvCamera();
              private static boolean rendering = false;
              private static boolean failed = false;
              private static long lastGlobal = 0L;
              private static int counter = 0;

              private CameraFeeds() {
              }

              private static final class Feed {
                  final BlockPos pos;
                  TextureTarget target;
                  ResourceLocation loc;
                  int w;
                  long lastRender = 0L;
                  long lastRequest = 0L;
                  boolean hasFrame = false;

                  Feed(BlockPos pos) {
                      this.pos = pos;
                  }
              }

              /** Lets a feed texture (the colour buffer of a frame buffer) be used like a normal texture. */
              private static final class FeedTexture extends AbstractTexture {
                  private final RenderTarget target;

                  FeedTexture(RenderTarget target) {
                      this.target = target;
                  }

                  @Override
                  public void load(ResourceManager manager) throws IOException {
                  }

                  @Override
                  public int getId() {
                      return target.getColorTextureId();
                  }

                  @Override
                  public void releaseId() {
                  }

                  @Override
                  public void setFilter(boolean blur, boolean mipmap) {
                      super.setFilter(true, false);
                  }
              }

              private static final class CctvCamera extends Camera {
                  void aim(BlockGetter level, Entity entity, Vec3 pos, float yaw, float pitch) {
                      this.setup(level, entity, true, false, 1.0F);
                      this.setRotation(yaw, pitch);
                      this.setPosition(pos.x, pos.y, pos.z);
                  }
              }

              public static boolean isRendering() {
                  return rendering;
              }

              public static boolean isFailed() {
                  return failed;
              }

              /** Called while drawing a monitor. Returns the texture of the latest frame, or null if none yet. */
              public static ResourceLocation request(BlockPos camPos) {
                  if (failed || !ClientPrefs.liveRender) {
                      return null;
                  }
                  Feed f = FEEDS.get(camPos);
                  if (f == null) {
                      if (FEEDS.size() >= ClientPrefs.maxFeeds()) {
                          return null;
                      }
                      f = new Feed(camPos.immutable());
                      FEEDS.put(f.pos, f);
                  }
                  f.lastRequest = System.currentTimeMillis();
                  return f.hasFrame && f.target != null ? f.loc : null;
              }

              private static void destroy(Minecraft mc, Feed f) {
                  if (f.target != null) {
                      mc.getTextureManager().release(f.loc);
                      f.target.destroyBuffers();
                      f.target = null;
                  }
                  f.hasFrame = false;
              }

              private static void ensureTarget(Minecraft mc, Feed f) {
                  int q = ClientPrefs.quality;
                  int w = WIDTHS[q];
                  if (f.target != null && f.w == w) {
                      return;
                  }
                  destroy(mc, f);
                  f.w = w;
                  f.target = new TextureTarget(w, HEIGHTS[q], true, Minecraft.ON_OSX);
                  f.target.setFilterMode(9729);
                  f.loc = new ResourceLocation(ImmersiveCCTV.MODID, "feed/" + (counter++));
                  mc.getTextureManager().register(f.loc, new FeedTexture(f.target));
              }

              @SubscribeEvent
              public static void onLogout(ClientPlayerNetworkEvent.LoggingOut event) {
                  Minecraft mc = Minecraft.getInstance();
                  for (Feed f : FEEDS.values()) {
                      destroy(mc, f);
                  }
                  FEEDS.clear();
              }

              @SubscribeEvent
              public static void onRenderTick(TickEvent.RenderTickEvent event) {
                  if (event.phase != TickEvent.Phase.START) {
                      return;
                  }
                  Minecraft mc = Minecraft.getInstance();
                  long now = System.currentTimeMillis();

                  Iterator<Feed> it = FEEDS.values().iterator();
                  while (it.hasNext()) {
                      Feed f = it.next();
                      if (now - f.lastRequest > 3000L) {
                          destroy(mc, f);
                          it.remove();
                      }
                  }

                  if (failed || !ClientPrefs.liveRender || mc.level == null || mc.player == null
                          || Minecraft.useShaderTransparency()) {
                      return;
                  }
                  if (now - lastGlobal < 1000L / Math.max(1, ClientPrefs.fps())) {
                      return;
                  }
                  Feed best = null;
                  for (Feed f : FEEDS.values()) {
                      if (now - f.lastRequest <= 700L && (best == null || f.lastRender < best.lastRender)) {
                          best = f;
                      }
                  }
                  if (best == null) {
                      return;
                  }
                  best.lastRender = now;
                  lastGlobal = now;

                  BlockState st = mc.level.getBlockState(best.pos);
                  if (!(st.getBlock() instanceof CameraBlock) || !mc.level.hasChunkAt(best.pos)) {
                      return;
                  }
                  try {
                      ensureTarget(mc, best);
                      rendering = true;
                      renderFeed(mc, best, st.getValue(CameraBlock.FACING), event.renderTickTime);
                      best.hasFrame = true;
                  } catch (Throwable t) {
                      failed = true;
                      LOGGER.error("Immersive CCTV: live camera rendering failed, falling back to the simulated picture", t);
                  } finally {
                      rendering = false;
                      mc.getMainRenderTarget().bindWrite(true);
                  }
              }

              private static void renderFeed(Minecraft mc, Feed feed, Direction facing, float partial) {
                  BlockPos p = feed.pos;
                  Vec3 camPos = new Vec3(p.getX() + 0.5 + facing.getStepX() * 0.47,
                          p.getY() + 7.0 / 16.0,
                          p.getZ() + 0.5 + facing.getStepZ() * 0.47);
                  CAMERA.aim(mc.level, mc.player, camPos, facing.toYRot(), PITCH);

                  feed.target.setClearColor(0.05F, 0.05F, 0.06F, 1.0F);
                  feed.target.clear(Minecraft.ON_OSX);
                  feed.target.bindWrite(true);

                  float aspect = (float) feed.target.width / (float) feed.target.height;
                  Matrix4f projection = new Matrix4f().setPerspective(
                          (float) Math.toRadians(FOV), aspect, 0.05F, mc.gameRenderer.getRenderDistance() * 4.0F);
                  RenderSystem.setProjectionMatrix(projection, VertexSorting.DISTANCE_TO_ORIGIN);

                  PoseStack pose = new PoseStack();
                  pose.mulPose(Axis.XP.rotationDegrees(CAMERA.getXRot()));
                  pose.mulPose(Axis.YP.rotationDegrees(CAMERA.getYRot() + 180.0F));
                  Matrix3f inverse = new Matrix3f(pose.last().normal()).invert();
                  RenderSystem.setInverseViewRotationMatrix(inverse);

                  // Make sure every entity (and the player) is drawn: the camera looks like a normal
                  // third-person camera and entities are visible from much farther away than usual.
                  double oldScale = Entity.getViewScale();
                  CameraType oldType = mc.options.getCameraType();
                  Entity.setViewScale(Math.max(oldScale, 3.0D));
                  mc.options.setCameraType(CameraType.THIRD_PERSON_BACK);
                  try {
                      mc.levelRenderer.prepareCullFrustum(pose, CAMERA.getPosition(), projection);
                      mc.levelRenderer.renderLevel(pose, partial, Util.getNanos() + 2_000_000L, false, CAMERA,
                              mc.gameRenderer, mc.gameRenderer.lightTexture(), projection);
                  } finally {
                      Entity.setViewScale(oldScale);
                      mc.options.setCameraType(oldType);
                  }
              }
          }
          EOF_FILE
