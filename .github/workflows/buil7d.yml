              uv = uv or [0, 0, 16, 16]
              return {'from': frm, 'to': to,
                      'faces': {d: face(texture, uv) for d in ('north', 'south', 'east', 'west', 'up', 'down')}}


          def model(textures, elements):
              return {'parent': 'minecraft:block/block', 'textures': dict(textures), 'elements': elements}


