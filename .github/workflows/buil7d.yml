          cat > src/main/java/com/immersivecctv/ClientPrefs.java <<'EOF_FILE'
          package com.immersivecctv;

          /** Per-player (client side) performance options for the live camera feeds. */
          public final class ClientPrefs {
              private ClientPrefs() {
              }

              private static final String[] QUALITY_NAMES = {
                      "LOW 256x144", "MEDIUM 384x216", "HIGH 512x288", "EXTRA HIGH 768x432", "ULTRA 1280x720"};
              private static final int[] FPS = {5, 10, 15, 20, 30, 60};

              public static boolean liveRender = true;
              public static int quality = 0;
              public static int fpsIndex = 1;

              public static int qualityCount() {
                  return QUALITY_NAMES.length;
              }

              public static int fpsCount() {
                  return FPS.length;
              }

              /** Maximum number of camera render-targets that may exist at once (video memory). */
              public static int maxFeeds() {
                  return quality <= 2 ? 24 : quality == 3 ? 8 : 4;
              }

              /** Renders per second, shared by all cameras that are on screen. */
              public static int fps() {
                  return FPS[Math.max(0, Math.min(FPS.length - 1, fpsIndex))];
              }

              public static String qualityName() {
                  return QUALITY_NAMES[Math.max(0, Math.min(QUALITY_NAMES.length - 1, quality))];
              }
          }
          EOF_FILE
          cat > src/main/java/com/immersivecctv/ClientSetup.java <<'EOF_FILE'
          package com.immersivecctv;

          import net.minecraftforge.api.distmarker.Dist;
          import net.minecraftforge.client.event.EntityRenderersEvent;
          import net.minecraftforge.eventbus.api.SubscribeEvent;
          import net.minecraftforge.fml.common.Mod;

          @Mod.EventBusSubscriber(modid = ImmersiveCCTV.MODID, bus = Mod.EventBusSubscriber.Bus.MOD, value = Dist.CLIENT)
          public class ClientSetup {
              @SubscribeEvent
              public static void onRegisterRenderers(EntityRenderersEvent.RegisterRenderers event) {
                  event.registerBlockEntityRenderer(ModRegistry.MONITOR_BE.get(), MonitorRenderer::new);
                  event.registerBlockEntityRenderer(ModRegistry.XVR_BE.get(), XvrRenderer::new);
              }
          }
          EOF_FILE
          cat > src/main/java/com/immersivecctv/ImmersiveCCTV.java <<'EOF_FILE'
          package com.immersivecctv;

          import net.minecraftforge.eventbus.api.IEventBus;
          import net.minecraftforge.fml.common.Mod;
          import net.minecraftforge.fml.event.lifecycle.FMLCommonSetupEvent;
          import net.minecraftforge.fml.javafmlmod.FMLJavaModLoadingContext;

          @Mod(ImmersiveCCTV.MODID)
          public class ImmersiveCCTV {
              public static final String MODID = "immersivecctv";

              public ImmersiveCCTV() {
                  IEventBus bus = FMLJavaModLoadingContext.get().getModEventBus();
                  ModRegistry.BLOCKS.register(bus);
                  ModRegistry.ITEMS.register(bus);
                  ModRegistry.BLOCK_ENTITIES.register(bus);
                  ModRegistry.TABS.register(bus);
                  bus.addListener(this::commonSetup);
              }

              private void commonSetup(FMLCommonSetupEvent event) {
                  event.enqueueWork(Net::init);
              }
          }
          EOF_FILE
          cat > src/main/java/com/immersivecctv/ModRegistry.java <<'EOF_FILE'
          package com.immersivecctv;

          import net.minecraft.core.registries.Registries;
          import net.minecraft.network.chat.Component;
          import net.minecraft.world.item.BlockItem;
          import net.minecraft.world.item.CreativeModeTab;
          import net.minecraft.world.item.Item;
          import net.minecraft.world.item.ItemStack;
          import net.minecraft.world.level.block.Block;
          import net.minecraft.world.level.block.SoundType;
          import net.minecraft.world.level.block.entity.BlockEntityType;
          import net.minecraft.world.level.block.state.BlockBehaviour;
          import net.minecraft.world.level.material.MapColor;
          import net.minecraftforge.registries.DeferredRegister;
