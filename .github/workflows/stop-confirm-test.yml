name: STOP Web Confirmation Test

on:
  workflow_dispatch:

permissions:
  actions: write
  issues: write
  contents: read

jobs:
  stop-confirmation:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Close any active confirmation issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          issues="$(gh api --paginate "repos/${REPOSITORY}/issues?state=open&per_page=100" --jq '.[] | select(.pull_request == null) | select(.title | startswith("[CCTV TEST CONFIRM]")) | .number')"
          if [[ -n "${issues}" ]]; then
            while IFS= read -r issue_number; do
              [[ -z "${issue_number}" ]] && continue
              gh api --method PATCH "repos/${REPOSITORY}/issues/${issue_number}" -f state=closed >/dev/null
              echo "Closed temporary confirmation issue #${issue_number}."
            done <<< "${issues}"
          else
            echo "No open temporary confirmation issue found."
          fi
      - name: Cancel active confirmation workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          runs="$(gh api "repos/${REPOSITORY}/actions/workflows/confirm-test.yml/runs?status=in_progress&per_page=100" --jq '.workflow_runs[].id')"
          if [[ -n "${runs}" ]]; then
            while IFS= read -r run_id; do
              [[ -z "${run_id}" ]] && continue
              gh api --method POST "repos/${REPOSITORY}/actions/runs/${run_id}/cancel" >/dev/null
              echo "Requested cancellation of confirmation run ${run_id}."
            done <<< "${runs}"
          else
            echo "No active confirmation workflow run found."
          fi
      - name: Report stop result
        run: |
          {
            echo "## 🛑 Confirmation test stopped"
            echo
            echo "Any open temporary confirmation issue was closed and active confirmation runs were sent a cancellation request."
          } >> "$GITHUB_STEP_SUMMARY"
