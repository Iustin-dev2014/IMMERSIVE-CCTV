          package com.immersivecctv.item;

          import com.immersivecctv.blockentity.MonitorBlockEntity;
          import com.immersivecctv.blockentity.XvrBlockEntity;
          import net.minecraft.core.BlockPos;
          import net.minecraft.nbt.CompoundTag;
          import net.minecraft.network.chat.Component;
          import net.minecraft.world.InteractionResult;
          import net.minecraft.world.item.Item;
          import net.minecraft.world.item.ItemStack;
          import net.minecraft.world.item.context.UseOnContext;
          import net.minecraft.world.level.Level;
          import net.minecraft.world.level.block.entity.BlockEntity;

          public class HdmiCableItem extends Item {
              public HdmiCableItem(Properties prop) { super(prop); }

              @Override
              public InteractionResult useOn(UseOnContext ctx) {
                  Level level = ctx.getLevel();
                  BlockPos pos = ctx.getClickedPos();
                  ItemStack stack = ctx.getItemInHand();
                  CompoundTag tag = stack.getOrCreateTag();

                  if (!level.isClientSide()) {
                      BlockEntity be = level.getBlockEntity(pos);
                      if (tag.contains("FirstPos")) {
                          BlockPos firstPos = BlockPos.of(tag.getLong("FirstPos"));
                          BlockEntity firstBe = level.getBlockEntity(firstPos);
                          if (firstBe instanceof MonitorBlockEntity mon && be instanceof XvrBlockEntity xvr) {
                              mon.setConnectedXvr(pos);
                              xvr.setConnectedMonitor(firstPos);
                              tag.remove("FirstPos");
                              if (ctx.getPlayer() != null) ctx.getPlayer().displayClientMessage(Component.literal("✔ Conexiune HDMI realizată cu succes!"), true);
                              return InteractionResult.SUCCESS;
                          } else if (firstBe instanceof XvrBlockEntity xvr && be instanceof MonitorBlockEntity mon) {
                              mon.setConnectedXvr(firstPos);
                              xvr.setConnectedMonitor(pos);
                              tag.remove("FirstPos");
                              if (ctx.getPlayer() != null) ctx.getPlayer().displayClientMessage(Component.literal("✔ Conexiune HDMI realizată cu succes!"), true);
                              return InteractionResult.SUCCESS;
                          } else {
                              tag.remove("FirstPos");
                              if (ctx.getPlayer() != null) ctx.getPlayer().displayClientMessage(Component.literal("❌ Conexiune invalidă! Conectați între Monitor și XVR."), true);
                          }
                      } else {
                          if (be instanceof MonitorBlockEntity || be instanceof XvrBlockEntity) {
                              tag.putLong("FirstPos", pos.asLong());
                              if (ctx.getPlayer() != null) ctx.getPlayer().displayClientMessage(Component.literal("Cablu conectat la primul aparat. Click pe celălalt capăt!"), true);
                              return InteractionResult.SUCCESS;
                          }
                      }
                  }
                  return InteractionResult.sidedSuccess(level.isClientSide());
              }
          }
