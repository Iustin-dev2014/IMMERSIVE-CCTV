          cat << 'EOF' > src/main/java/com/immersivecctv/client/XvrMonitorScreen.java
          package com.immersivecctv.client;

          import com.immersivecctv.blockentity.MonitorBlockEntity;
          import com.immersivecctv.blockentity.XvrBlockEntity;
          import net.minecraft.client.Minecraft;
          import net.minecraft.client.gui.GuiGraphics;
          import net.minecraft.client.gui.screens.Screen;
          import net.minecraft.core.BlockPos;
          import net.minecraft.network.chat.Component;
          import net.minecraft.world.entity.LivingEntity;
          import net.minecraft.world.level.block.entity.BlockEntity;
          import net.minecraft.world.phys.AABB;
          import java.util.List;

          public class XvrMonitorScreen extends Screen {
              private final BlockPos monitorPos;
              private int selectedCamIndex = 0;
              private int bootTicks = 0;
              private boolean inSettings = false;
              private int filterMode = 0;
              private boolean motionAlarmEnabled = true;

              private float bounceX = 50, bounceY = 50;
              private float velX = 2.0f, velY = 1.5f;

              public XvrMonitorScreen(BlockPos monitorPos) {
                  super(Component.literal("XVR Surveillance OS"));
                  this.monitorPos = monitorPos;
              }

              @Override
              public void tick() {
                  super.tick();
                  bootTicks++;
              }

              @Override
              public void render(GuiGraphics gui, int mouseX, int mouseY, float partialTicks) {
                  gui.fill(0, 0, width, height, 0xFF05070A);

                  Minecraft mc = Minecraft.getInstance();
                  BlockEntity be = mc.level != null ? mc.level.getBlockEntity(monitorPos) : null;
                  MonitorBlockEntity monitor = (be instanceof MonitorBlockEntity) ? (MonitorBlockEntity) be : null;
                  BlockPos xvrPos = monitor != null ? monitor.getConnectedXvr() : null;
                  BlockEntity xvrBe = (xvrPos != null && mc.level != null) ? mc.level.getBlockEntity(xvrPos) : null;
                  XvrBlockEntity xvr = (xvrBe instanceof XvrBlockEntity) ? (XvrBlockEntity) xvrBe : null;

                  boolean noSignal = (xvr == null || !xvr.isPowered());

                  if (noSignal) {
                      renderNoSignalScreensaver(gui);
                      return;
                  }

                  if (bootTicks < 60) {
                      renderBootSequence(gui);
                      return;
                  }

                  if (inSettings) {
                      renderSettingsMenu(gui, mouseX, mouseY);
                  } else {
                      renderLiveSurveillance(gui, xvr, mouseX, mouseY);
                  }
              }

              private void renderNoSignalScreensaver(GuiGraphics gui) {
                  bounceX += velX;
                  bounceY += velY;
                  if (bounceX < 10 || bounceX > width - 180) velX = -velX;
                  if (bounceY < 10 || bounceY > height - 40) velY = -velY;

                  gui.fill((int)bounceX, (int)bounceY, (int)bounceX + 170, (int)bounceY + 35, 0xCCAA0000);
                  gui.renderOutline((int)bounceX, (int)bounceY, 170, 35, 0xFFFF5555);
                  gui.drawString(font, "● LIPSĂ SEMNAL (NO SIGNAL)", (int)bounceX + 8, (int)bounceY + 6, 0xFFFFFFFF, false);
                  gui.drawString(font, "Verifică HDMI sau Alimentare XVR", (int)bounceX + 8, (int)bounceY + 18, 0xFFFFAAAA, false);
              }

              private void renderBootSequence(GuiGraphics gui) {
                  int cy = height / 2 - 40;
                  gui.drawCenteredString(font, "=== IMMERSIVE XVR SURVEILLANCE SYSTEM ===", width / 2, cy, 0xFF00FFCC);
                  if (bootTicks > 15) gui.drawString(font, "> Încărcare Firmware v4.2.0-PRO... [OK]", width / 2 - 120, cy + 25, 0xFF55FF55, false);
                  if (bootTicks > 30) gui.drawString(font, "> Inițializare 8x Porturi RJ45 PoE... [OK]", width / 2 - 120, cy + 40, 0xFF55FF55, false);
                  if (bootTicks > 45) gui.drawString(font, "> Verificare integritate HDD RAID... [SĂNĂTOS]", width / 2 - 120, cy + 55, 0xFF55FF55, false);
              }

              private void renderLiveSurveillance(GuiGraphics gui, XvrBlockEntity xvr, int mouseX, int mouseY) {
                  Minecraft mc = Minecraft.getInstance();
                  gui.fill(0, 0, width, 24, 0xEE11151C);
                  boolean recBlink = (System.currentTimeMillis() / 600) % 2 == 0;
                  if (recBlink) {
                      gui.fill(10, 8, 18, 16, 0xFFFF0000);
                      gui.drawString(font, "REC [LIVE]", 24, 8, 0xFFFF2222, false);
                  } else {
                      gui.drawString(font, "REC [LIVE]", 24, 8, 0xFF882222, false);
                  }

                  gui.drawString(font, "XVR-8CH HD | STATUS: ONLINE | PoE 48V ACTIV", 100, 8, 0xFF00FFCC, false);
                  gui.drawString(font, "[SETĂRI XVR]", width - 90, 8, isHovering(mouseX, mouseY, width - 95, 4, 80, 16) ? 0xFFFFFF00 : 0xFFAAAAAA, false);

                  int feedX = 20, feedY = 32, feedW = width - 40, feedH = height - 70;
                  gui.fill(feedX, feedY, feedX + feedW, feedY + feedH, 0xFF080D14);
                  gui.renderOutline(feedX, feedY, feedW, feedH, 0xFF224466);

                  if (filterMode == 1) {
                      gui.fill(feedX, feedY, feedX + feedW, feedY + feedH, 0x3300FF33);
                  } else if (filterMode == 2) {
                      gui.fill(feedX, feedY, feedX + feedW, feedY + feedH, 0x33FF0055);
                  }

                  for (int y = feedY; y < feedY + feedH; y += 4) {
                      gui.fill(feedX, y, feedX + feedW, y + 1, 0x1A000000);
                  }

                  int cx = feedX + feedW / 2, cy = feedY + feedH / 2;
                  gui.fill(cx - 15, cy, cx + 15, cy + 1, 0x66FFFFFF);
                  gui.fill(cx, cy - 15, cx, cy + 15, 0x66FFFFFF);

                  List<BlockPos> cams = xvr.getConnectedCameras();
                  if (cams.isEmpty()) {
                      gui.drawCenteredString(font, "NICIO CAMERĂ CONECTATĂ PE PORTURILE POE", cx, cy - 10, 0xFF888888);
                      gui.drawCenteredString(font, "Trageți un cablu PoE de la cameră la unitatea XVR", cx, cy + 5, 0xFF555555);
                  } else {
                      if (selectedCamIndex >= cams.size()) selectedCamIndex = 0;
                      BlockPos camPos = cams.get(selectedCamIndex);
                      gui.drawString(font, "CAM 0" + (selectedCamIndex + 1) + " [" + camPos.getX() + ", " + camPos.getY() + ", " + camPos.getZ() + "]", feedX + 10, feedY + 10, 0xFF00FFCC, false);

                      if (mc.level != null && motionAlarmEnabled) {
                          AABB scanArea = new AABB(camPos).inflate(14.0);
                          List<LivingEntity> entities = mc.level.getEntitiesOfClass(LivingEntity.class, scanArea, e -> e != mc.player);
                          int ey = feedY + 28;
                          if (!entities.isEmpty()) {
                              gui.drawString(font, "⚠️ ALARMĂ: MIȘCARE DETECTATĂ ÎN PERIMETRU!", feedX + 10, ey, 0xFFFF3333, false);
                              ey += 14;
                              for (int i = 0; i < Math.min(entities.size(), 4); i++) {
                                  LivingEntity target = entities.get(i);
                                  double dist = Math.round(target.distanceToSqr(camPos.getX(), camPos.getY(), camPos.getZ()) * 10.0) / 10.0;
                                  gui.drawString(font, "[AI ȚINTĂ] " + target.getName().getString() + " - " + Math.round(Math.sqrt(dist)) + "m", feedX + 10, ey, 0xFFFFCC00, false);
                                  ey += 12;
                              }
                          } else {
                              gui.drawString(font, "RADAR MIȘCARE AI: NICIUN INTRUS", feedX + 10, ey, 0xFF44AA44, false);
                          }
                      }
                  }

                  int btnY = height - 30;
                  for (int i = 0; i < 4; i++) {
                      int bx = 20 + i * 85;
                      boolean active = (i == selectedCamIndex);
                      gui.fill(bx, btnY, bx + 75, btnY + 20, active ? 0xFF005577 : 0xFF1A222D);
                      gui.renderOutline(bx, btnY, 75, 20, active ? 0xFF00FFCC : 0xFF334455);
                      gui.drawCenteredString(font, "CAM 0" + (i + 1), bx + 37, btnY + 6, active ? 0xFFFFFFFF : 0xFFAAAAAA);
                  }
              }

              private void renderSettingsMenu(GuiGraphics gui, int mouseX, int mouseY) {
                  int mx = width / 2 - 120, my = height / 2 - 80;
                  gui.fill(mx, my, mx + 240, my + 160, 0xFA151C24);
                  gui.renderOutline(mx, my, 240, 160, 0xFF00FFCC);

                  gui.drawCenteredString(font, "=== MENIU SETĂRI XVR ===", width / 2, my + 10, 0xFFFFFFFF);

                  String filterName = filterMode == 0 ? "STANDARD HD" : (filterMode == 1 ? "NIGHT-VISION IR" : "THERMAL SCAN");
                  gui.drawString(font, "Filtru Video: " + filterName, mx + 20, my + 38, 0xFFCCCCCC, false);
                  gui.drawString(font, "[SCHIMBĂ FILTRU]", mx + 20, my + 52, 0xFF00FFCC, false);

                  gui.drawString(font, "Alarmă Mișcare: " + (motionAlarmEnabled ? "ACTIVATĂ" : "OPRITĂ"), mx + 20, my + 75, motionAlarmEnabled ? 0xFF55FF55 : 0xFFFF5555, false);
                  gui.drawString(font, "[COMUTĂ ALARMĂ]", mx + 20, my + 89, 0xFF00FFCC, false);

                  gui.drawString(font, "Stocare: HDD 2.4 TB [Sănătos - 82% Liber]", mx + 20, my + 112, 0xFFAAAAAA, false);

                  gui.drawString(font, "[ÎNAPOI LA CAMERE]", mx + 60, my + 135, 0xFFFFFF00, false);
              }

              @Override
              public boolean mouseClicked(double mouseX, double mouseY, int button) {
                  if (inSettings) {
                      int mx = width / 2 - 120, my = height / 2 - 80;
                      if (isHovering(mouseX, mouseY, mx + 20, my + 50, 120, 15)) {
                          filterMode = (filterMode + 1) % 3;
                          return true;
                      }
                      if (isHovering(mouseX, mouseY, mx + 20, my + 87, 120, 15)) {
                          motionAlarmEnabled = !motionAlarmEnabled;
                          return true;
                      }
                      if (isHovering(mouseX, mouseY, mx + 60, my + 132, 120, 18)) {
                          inSettings = false;
                          return true;
                      }
                  } else {
                      if (isHovering(mouseX, mouseY, width - 95, 4, 80, 16)) {
                          inSettings = true;
                          return true;
                      }
                      int btnY = height - 30;
                      for (int i = 0; i < 4; i++) {
                          int bx = 20 + i * 85;
                          if (isHovering(mouseX, mouseY, bx, btnY, 75, 20)) {
                              selectedCamIndex = i;
                              return true;
                          }
                      }
                  }
                  return super.mouseClicked(mouseX, mouseY, button);
              }

              private boolean isHovering(double mx, double my, int x, int y, int w, int h) {
                  return mx >= x && mx <= x + w && my >= y && my <= y + h;
              }

              @Override
              public boolean isPauseScreen() { return false; }
          }
          EOF

