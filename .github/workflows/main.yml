          cat << 'EOF' > src/main/java/com/immersivecctv/blockentity/XvrBlockEntity.java
          package com.immersivecctv.blockentity;

          import com.immersivecctv.ImmersiveCCTV;
          import net.minecraft.core.BlockPos;
          import net.minecraft.nbt.CompoundTag;
          import net.minecraft.nbt.ListTag;
          import net.minecraft.nbt.LongTag;
          import net.minecraft.nbt.Tag;
          import net.minecraft.network.protocol.game.ClientboundBlockEntityDataPacket;
          import net.minecraft.world.level.Level;
          import net.minecraft.world.level.block.entity.BlockEntity;
          import net.minecraft.world.level.block.state.BlockState;
          import java.util.ArrayList;
          import java.util.List;

          public class XvrBlockEntity extends BlockEntity {
              private boolean powered = true;
              private final List<BlockPos> connectedCameras = new ArrayList<>();
              private BlockPos connectedMonitor = null;
              public int lanBlinkTimer = 0;

              public XvrBlockEntity(BlockPos pos, BlockState state) {
                  super(ImmersiveCCTV.XVR_BE.get(), pos, state);
              }

              public boolean isPowered() { return powered; }
              public void togglePower() {
                  this.powered = !this.powered;
                  setChanged();
                  if (level != null && !level.isClientSide()) {
                      level.sendBlockUpdated(worldPosition, getBlockState(), getBlockState(), 3);
                  }
              }

              public List<BlockPos> getConnectedCameras() { return connectedCameras; }
              public void addCamera(BlockPos pos) {
                  if (!connectedCameras.contains(pos)) {
                      connectedCameras.add(pos);
                      setChanged();
                      if (level != null && !level.isClientSide()) {
                          level.sendBlockUpdated(worldPosition, getBlockState(), getBlockState(), 3);
                      }
                  }
              }

              public BlockPos getConnectedMonitor() { return connectedMonitor; }
              public void setConnectedMonitor(BlockPos pos) {
                  this.connectedMonitor = pos;
                  setChanged();
                  if (level != null && !level.isClientSide()) {
                      level.sendBlockUpdated(worldPosition, getBlockState(), getBlockState(), 3);
                  }
              }

              public void tick(Level lvl, BlockPos pos, BlockState state) {
                  if (powered && !connectedCameras.isEmpty()) {
                      lanBlinkTimer++;
                  }
              }

              @Override
              protected void saveAdditional(CompoundTag tag) {
                  super.saveAdditional(tag);
                  tag.putBoolean("Powered", powered);
                  if (connectedMonitor != null) {
                      tag.putLong("Monitor", connectedMonitor.asLong());
                  }
                  ListTag list = new ListTag();
                  for (BlockPos cp : connectedCameras) {
                      list.add(LongTag.valueOf(cp.asLong()));
                  }
                  tag.put("Cameras", list);
              }

              @Override
              public void load(CompoundTag tag) {
                  super.load(tag);
                  powered = tag.getBoolean("Powered");
                  if (tag.contains("Monitor")) {
                      connectedMonitor = BlockPos.of(tag.getLong("Monitor"));
                  } else {
                      connectedMonitor = null;
                  }
                  connectedCameras.clear();
                  if (tag.contains("Cameras", Tag.TAG_LIST)) {
                      ListTag list = tag.getList("Cameras", Tag.TAG_LONG);
                      for (int i = 0; i < list.size(); i++) {
                          connectedCameras.add(BlockPos.of(((LongTag) list.get(i)).getAsLong()));
                      }
                  }
              }

              @Override
              public CompoundTag getUpdateTag() {
                  CompoundTag tag = new CompoundTag();
                  saveAdditional(tag);
                  return tag;
              }

              @Override
              public ClientboundBlockEntityDataPacket getUpdatePacket() {
                  return ClientboundBlockEntityDataPacket.create(this);
              }
          }
          EOF

