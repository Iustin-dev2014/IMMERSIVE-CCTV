name: Build Immersive CCTV Mod

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install and Configure Gradle 8.5 (Bypass Gradle 9)
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          sudo unzip -q gradle-8.5-bin.zip -d /opt
          echo "/opt/gradle-8.5/bin" >> $GITHUB_PATH

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python Imaging (Pillow)
        run: pip install pillow

      - name: Generate Project Structure & Source Code
        run: |
          mkdir -p src/main/java/com/immersivecctv/block
          mkdir -p src/main/java/com/immersivecctv/blockentity
          mkdir -p src/main/java/com/immersivecctv/client
          mkdir -p src/main/java/com/immersivecctv/item
          mkdir -p src/main/resources/META-INF
          mkdir -p src/main/resources/assets/immersivecctv/lang
          mkdir -p src/main/resources/assets/immersivecctv/blockstates
          mkdir -p src/main/resources/assets/immersivecctv/models/block
          mkdir -p src/main/resources/assets/immersivecctv/models/item
          mkdir -p src/main/resources/assets/immersivecctv/textures/block
          mkdir -p src/main/resources/assets/immersivecctv/textures/item

          # ==========================================
          # 1. GRADLE CONFIGURATION
          # ==========================================
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  gradlePluginPortal()
                  maven {
                      name = 'MinecraftForge'
                      url = 'https://maven.minecraftforge.net/'
                  }
                  mavenCentral()
              }
          }
          rootProject.name = 'immersivecctv'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'eclipse'
              id 'maven-publish'
              id 'net.minecraftforge.gradle' version '[6.0,6.2)'
          }

          version = '1.0.0'
          group = 'com.immersivecctv'
          archivesBaseName = 'immersivecctv-1.20.1'

          java.toolchain.languageVersion = JavaLanguageVersion.of(17)

          minecraft {
              mappings channel: 'official', version: '1.20.1'
              copyIdeResources = true
              runs {
                  client {
                      workingDirectory project.file('run')
                      property 'forge.logging.markers', 'REGISTRIES'
                      property 'forge.logging.console.level', 'debug'
                      mods {
                          immersivecctv {
                              source sourceSets.main
                          }
                      }
                  }
              }
          }

          repositories {
              mavenCentral()
              maven {
                  name = 'MinecraftForge'
                  url = 'https://maven.minecraftforge.net/'
              }
          }

          dependencies {
              minecraft 'net.minecraftforge:forge:1.20.1-47.2.0'
          }

          tasks.withType(JavaCompile).configureEach {
              options.encoding = 'UTF-8'
          }

          jar {
              manifest {
                  attributes([
                      "Specification-Title"     : "immersivecctv",
                      "Specification-Vendor"    : "ImmersiveCCTV",
                      "Specification-Version"   : "1",
                      "Implementation-Title"    : project.name,
                      "Implementation-Version"  : project.jar.archiveVersion,
                      "Implementation-Vendor"   : "ImmersiveCCTV",
                      "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
                  ])
              }
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx3G
          org.gradle.daemon=false
          EOF

          # ==========================================
          # 2. METADATA & LANGUAGE
          # ==========================================
          cat << 'EOF' > src/main/resources/META-INF/mods.toml
          modLoader="javafml"
          loaderVersion="[47,)"
          license="MIT"
          [[mods]]
          modId="immersivecctv"
          version="1.0.0"
          displayName="Immersive CCTV"
          description='''Sistem profesional de supraveghere CCTV: XVR, Camere IR Bullet, Monitoare si cabluri fizice Cat6/HDMI.'''
          authors="ImmersiveCCTV Dev"

          [[dependencies.immersivecctv]]
              modId="forge"
              mandatory=true
              versionRange="[47,)"
              ordering="NONE"
              side="BOTH"

          [[dependencies.immersivecctv]]
              modId="minecraft"
              mandatory=true
              versionRange="[1.20.1,1.21)"
              ordering="NONE"
              side="BOTH"
          EOF

          cat << 'EOF' > src/main/resources/assets/immersivecctv/lang/en_us.json
          {
            "block.immersivecctv.xvr_unit": "Unitate Centrală XVR",
            "block.immersivecctv.cctv_monitor": "Monitor CCTV Wide Screen",
            "block.immersivecctv.bullet_camera": "Cameră Video XVR Bullet HD",
            "item.immersivecctv.hdmi_cable": "Cablu HDMI Heavy-Duty",
            "item.immersivecctv.poe_cable": "Cablu Ethernet PoE Cat6",
            "itemGroup.immersivecctv_tab": "Immersive CCTV"
          }
          EOF

      - name: Generate 64x64 HD Textures (Python PIL)
        run: |
          python3 - << 'EOF'
          from PIL import Image, ImageDraw
          import random

          def make_brushed_metal(w=64, h=64, base=(40, 42, 45)):
              img = Image.new('RGB', (w, h), base)
              draw = ImageDraw.Draw(img)
              random.seed(42)
              for y in range(h):
                  for x in range(w):
                      noise = random.randint(-8, 8)
                      r = max(0, min(255, base[0] + noise))
                      g = max(0, min(255, base[1] + noise))
                      b = max(0, min(255, base[2] + noise))
                      draw.point((x, y), fill=(r, g, b))
              return img

          # XVR Textures
          xvr_top = make_brushed_metal(64, 64, (32, 34, 38))
          d = ImageDraw.Draw(xvr_top)
          d.rectangle([4, 4, 60, 60], outline=(55, 58, 65), width=2)
          for y in range(16, 48, 4):
              d.line([(8, y), (24, y)], fill=(15, 15, 18), width=2)
              d.line([(40, y), (56, y)], fill=(15, 15, 18), width=2)
          xvr_top.save("src/main/resources/assets/immersivecctv/textures/block/xvr_top.png")

          xvr_side = make_brushed_metal(64, 64, (28, 30, 33))
          d = ImageDraw.Draw(xvr_side)
          for x in range(10, 54, 4):
              d.line([(x, 15), (x, 49)], fill=(12, 12, 15), width=2)
          xvr_side.save("src/main/resources/assets/immersivecctv/textures/block/xvr_side.png")

          xvr_front = make_brushed_metal(64, 64, (20, 22, 25))
          d = ImageDraw.Draw(xvr_front)
          for i in range(8):
              px = 6 + (i % 4) * 14
              py = 18 if i < 4 else 36
              d.rectangle([px, py, px + 10, py + 12], fill=(10, 10, 12), outline=(100, 105, 115))
              d.rectangle([px + 2, py + 3, px + 8, py + 6], fill=(218, 165, 32)) # Gold pins
          d.ellipse([50, 48, 58, 56], fill=(70, 75, 85), outline=(140, 145, 155)) # Power button
          d.ellipse([46, 18, 49, 21], fill=(0, 255, 60)) # Green PWR LED
          d.ellipse([54, 18, 57, 21], fill=(255, 140, 0)) # Orange LAN LED
          xvr_front.save("src/main/resources/assets/immersivecctv/textures/block/xvr_front.png")

          # Monitor Textures
          mon_screen = Image.new('RGB', (64, 64), (10, 14, 20))
          d = ImageDraw.Draw(mon_screen)
          d.rectangle([2, 2, 61, 61], outline=(30, 35, 45), width=2)
          mon_screen.save("src/main/resources/assets/immersivecctv/textures/block/monitor_screen.png")

          mon_back = make_brushed_metal(64, 64, (35, 38, 42))
          d = ImageDraw.Draw(mon_back)
          d.rectangle([24, 24, 40, 40], fill=(20, 22, 25), outline=(60, 65, 75))
          mon_back.save("src/main/resources/assets/immersivecctv/textures/block/monitor_back.png")

          # Camera Textures
          cam_body = make_brushed_metal(64, 64, (210, 215, 220))
          cam_body.save("src/main/resources/assets/immersivecctv/textures/block/camera_body.png")

          cam_lens = Image.new('RGB', (64, 64), (15, 16, 20))
          d = ImageDraw.Draw(cam_lens)
          d.ellipse([14, 14, 50, 50], fill=(10, 25, 45), outline=(80, 85, 95), width=2)
          d.ellipse([24, 24, 40, 40], fill=(5, 5, 15), outline=(30, 90, 180), width=2)
          import math
          for angle in range(0, 360, 30):
              rad = math.radians(angle)
              cx = int(32 + 20 * math.cos(rad))
              cy = int(32 + 20 * math.sin(rad))
              d.ellipse([cx-2, cy-2, cx+2, cy+2], fill=(139, 0, 0))
          cam_lens.save("src/main/resources/assets/immersivecctv/textures/block/camera_lens.png")

          # Cable Items
          hdmi = Image.new('RGBA', (64, 64), (0, 0, 0, 0))
          d = ImageDraw.Draw(hdmi)
          d.arc([8, 8, 56, 56], start=45, end=270, fill=(30, 30, 35, 255), width=6)
          d.rectangle([34, 10, 52, 22], fill=(218, 165, 32, 255), outline=(50, 50, 50, 255))
          hdmi.save("src/main/resources/assets/immersivecctv/textures/item/hdmi_cable.png")

          poe = Image.new('RGBA', (64, 64), (0, 0, 0, 0))
          d = ImageDraw.Draw(poe)
          d.arc([8, 8, 56, 56], start=30, end=250, fill=(0, 90, 200, 255), width=6)
          d.rectangle([34, 8, 50, 24], fill=(180, 220, 255, 200), outline=(0, 60, 150, 255))
          poe.save("src/main/resources/assets/immersivecctv/textures/item/poe_cable.png")
          print("Texturi generate cu succes!")
          EOF

      - name: Generate Blockstates & Models JSON
        run: |
          cat << 'EOF' > src/main/resources/assets/immersivecctv/blockstates/xvr_unit.json
          { "variants": { "": { "model": "immersivecctv:block/xvr_unit" } } }
          EOF

          cat << 'EOF' > src/main/resources/assets/immersivecctv/blockstates/cctv_monitor.json
          { "variants": { "": { "model": "immersivecctv:block/cctv_monitor" } } }
          EOF

          cat << 'EOF' > src/main/resources/assets/immersivecctv/blockstates/bullet_camera.json
          { "variants": { "": { "model": "immersivecctv:block/bullet_camera" } } }
          EOF

          cat << 'EOF' > src/main/resources/assets/immersivecctv/models/block/xvr_unit.json
          {
            "parent": "block/block",
            "textures": {
              "particle": "immersivecctv:block/xvr_front",
              "top": "immersivecctv:block/xvr_top",
              "bottom": "immersivecctv:block/xvr_top",
              "side": "immersivecctv:block/xvr_side",
              "front": "immersivecctv:block/xvr_front"
            },
            "elements": [
              {
                "from": [1, 0, 1],
                "to": [15, 5, 15],
                "faces": {
                  "north": { "texture": "#front", "cullface": "north" },
                  "south": { "texture": "#side", "cullface": "south" },
                  "west": { "texture": "#side", "cullface": "west" },
                  "east": { "texture": "#side", "cullface": "east" },
                  "up": { "texture": "#top" },
                  "down": { "texture": "#bottom", "cullface": "down" }
                }
              }
            ]
          }
          EOF

          cat << 'EOF' > src/main/resources/assets/immersivecctv/models/block/cctv_monitor.json
          {
            "parent": "block/block",
            "textures": {
              "particle": "immersivecctv:block/monitor_screen",
              "screen": "immersivecctv:block/monitor_screen",
              "back": "immersivecctv:block/monitor_back",
              "stand": "immersivecctv:block/xvr_side"
            },
            "elements": [
              {
                "from": [4, 0, 4],
                "to": [12, 1, 12],
                "faces": {
                  "up": { "texture": "#stand" },
                  "down": { "texture": "#stand", "cullface": "down" },
                  "north": { "texture": "#stand" },
                  "south": { "texture": "#stand" },
                  "west": { "texture": "#stand" },
                  "east": { "texture": "#stand" }
                }
              },
              {
                "from": [7, 1, 7],
                "to": [9, 6, 9],
                "faces": {
                  "north": { "texture": "#stand" },
                  "south": { "texture": "#stand" },
                  "west": { "texture": "#stand" },
                  "east": { "texture": "#stand" }
                }
              },
              {
                "from": [0, 4, 6],
                "to": [16, 16, 8],
                "faces": {
                  "north": { "texture": "#screen" },
                  "south": { "texture": "#back" },
                  "west": { "texture": "#back" },
                  "east": { "texture": "#back" },
                  "up": { "texture": "#back" },
                  "down": { "texture": "#back" }
                }
              }
            ]
          }
          EOF

          cat << 'EOF' > src/main/resources/assets/immersivecctv/models/block/bullet_camera.json
          {
            "parent": "block/block",
            "textures": {
              "particle": "immersivecctv:block/camera_lens",
              "body": "immersivecctv:block/camera_body",
              "lens": "immersivecctv:block/camera_lens"
            },
            "elements": [
              {
                "from": [5, 4, 3],
                "to": [11, 10, 13],
                "faces": {
                  "north": { "texture": "#lens" },
                  "south": { "texture": "#body" },
                  "west": { "texture": "#body" },
                  "east": { "texture": "#body" },
                  "up": { "texture": "#body" },
                  "down": { "texture": "#body" }
                }
              },
              {
                "from": [7, 10, 7],
                "to": [9, 16, 9],
                "faces": {
                  "north": { "texture": "#body" },
                  "south": { "texture": "#body" },
                  "west": { "texture": "#body" },
                  "east": { "texture": "#body" },
                  "up": { "texture": "#body", "cullface": "up" }
                }
              }
            ]
          }
          EOF

          cat << 'EOF' > src/main/resources/assets/immersivecctv/models/item/xvr_unit.json
          { "parent": "immersivecctv:block/xvr_unit" }
          EOF

          cat << 'EOF' > src/main/resources/assets/immersivecctv/models/item/cctv_monitor.json
          { "parent": "immersivecctv:block/cctv_monitor" }
          EOF

          cat << 'EOF' > src/main/resources/assets/immersivecctv/models/item/bullet_camera.json
          { "parent": "immersivecctv:block/bullet_camera" }
          EOF

          cat << 'EOF' > src/main/resources/assets/immersivecctv/models/item/hdmi_cable.json
          {
            "parent": "item/generated",
            "textures": { "layer0": "immersivecctv:item/hdmi_cable" }
          }
          EOF

          cat << 'EOF' > src/main/resources/assets/immersivecctv/models/item/poe_cable.json
          {
            "parent": "item/generated",
            "textures": { "layer0": "immersivecctv:item/poe_cable" }
          }
          EOF

      - name: Generate Java Mod Code
        run: |
          # 1. Main Mod Entry
          cat << 'EOF' > src/main/java/com/immersivecctv/ImmersiveCCTV.java
          package com.immersivecctv;

          import com.immersivecctv.block.*;
          import com.immersivecctv.blockentity.*;
          import com.immersivecctv.item.*;
          import net.minecraft.core.registries.Registries;
          import net.minecraft.network.chat.Component;
          import net.minecraft.world.item.*;
          import net.minecraft.world.level.block.Block;
          import net.minecraft.world.level.block.entity.BlockEntityType;
          import net.minecraft.world.level.block.state.BlockBehaviour;
          import net.minecraft.world.level.material.MapColor;
          import net.minecraftforge.common.MinecraftForge;
          import net.minecraftforge.eventbus.api.IEventBus;
          import net.minecraftforge.fml.common.Mod;
          import net.minecraftforge.fml.javafmlmod.FMLJavaModLoadingContext;
          import net.minecraftforge.registries.DeferredRegister;
          import net.minecraftforge.registries.ForgeRegistries;
          import net.minecraftforge.registries.RegistryObject;

          @Mod(ImmersiveCCTV.MODID)
          public class ImmersiveCCTV {
              public static final String MODID = "immersivecctv";

              public static final DeferredRegister<Block> BLOCKS = DeferredRegister.create(ForgeRegistries.BLOCKS, MODID);
              public static final DeferredRegister<Item> ITEMS = DeferredRegister.create(ForgeRegistries.ITEMS, MODID);
              public static final DeferredRegister<BlockEntityType<?>> BLOCK_ENTITIES = DeferredRegister.create(ForgeRegistries.BLOCK_ENTITY_TYPES, MODID);
              public static final DeferredRegister<CreativeModeTab> CREATIVE_TABS = DeferredRegister.create(Registries.CREATIVE_MODE_TAB, MODID);

              public static final RegistryObject<Block> XVR_BLOCK = BLOCKS.register("xvr_unit", 
                  () -> new XvrBlock(BlockBehaviour.Properties.of().mapColor(MapColor.COLOR_BLACK).strength(2.0f).noOcclusion()));
              public static final RegistryObject<Block> MONITOR_BLOCK = BLOCKS.register("cctv_monitor", 
                  () -> new MonitorBlock(BlockBehaviour.Properties.of().mapColor(MapColor.COLOR_BLACK).strength(1.5f).noOcclusion()));
              public static final RegistryObject<Block> CAMERA_BLOCK = BLOCKS.register("bullet_camera", 
                  () -> new CameraBlock(BlockBehaviour.Properties.of().mapColor(MapColor.METAL).strength(1.5f).noOcclusion()));

              public static final RegistryObject<Item> XVR_ITEM = ITEMS.register("xvr_unit", 
                  () -> new BlockItem(XVR_BLOCK.get(), new Item.Properties()));
              public static final RegistryObject<Item> MONITOR_ITEM = ITEMS.register("cctv_monitor", 
                  () -> new BlockItem(MONITOR_BLOCK.get(), new Item.Properties()));
              public static final RegistryObject<Item> CAMERA_ITEM = ITEMS.register("bullet_camera", 
                  () -> new BlockItem(CAMERA_BLOCK.get(), new Item.Properties()));
              public static final RegistryObject<Item> HDMI_CABLE = ITEMS.register("hdmi_cable", 
                  () -> new HdmiCableItem(new Item.Properties().stacksTo(1)));
              public static final RegistryObject<Item> POE_CABLE = ITEMS.register("poe_cable", 
                  () -> new PoeCableItem(new Item.Properties().stacksTo(1)));

              public static final RegistryObject<BlockEntityType<XvrBlockEntity>> XVR_BE = BLOCK_ENTITIES.register("xvr_unit",
                  () -> BlockEntityType.Builder.of(XvrBlockEntity::new, XVR_BLOCK.get()).build(null));
              public static final RegistryObject<BlockEntityType<MonitorBlockEntity>> MONITOR_BE = BLOCK_ENTITIES.register("cctv_monitor",
                  () -> BlockEntityType.Builder.of(MonitorBlockEntity::new, MONITOR_BLOCK.get()).build(null));
              public static final RegistryObject<BlockEntityType<CameraBlockEntity>> CAMERA_BE = BLOCK_ENTITIES.register("bullet_camera",
                  () -> BlockEntityType.Builder.of(CameraBlockEntity::new, CAMERA_BLOCK.get()).build(null));

              public static final RegistryObject<CreativeModeTab> TAB = CREATIVE_TABS.register("immersivecctv_tab",
                  () -> CreativeModeTab.builder()
                      .title(Component.translatable("itemGroup.immersivecctv_tab"))
                      .icon(() -> new ItemStack(XVR_ITEM.get()))
                      .displayItems((params, output) -> {
                          output.accept(XVR_ITEM.get());
                          output.accept(MONITOR_ITEM.get());
                          output.accept(CAMERA_ITEM.get());
                          output.accept(HDMI_CABLE.get());
                          output.accept(POE_CABLE.get());
                      })
                      .build());

              public ImmersiveCCTV() {
                  IEventBus bus = FMLJavaModLoadingContext.get().getModEventBus();
                  BLOCKS.register(bus);
                  ITEMS.register(bus);
                  BLOCK_ENTITIES.register(bus);
                  CREATIVE_TABS.register(bus);
              }
          }
          EOF

          # 2. Block Classes
          cat << 'EOF' > src/main/java/com/immersivecctv/block/XvrBlock.java
          package com.immersivecctv.block;

          import com.immersivecctv.blockentity.XvrBlockEntity;
          import net.minecraft.core.BlockPos;
          import net.minecraft.sounds.SoundEvents;
          import net.minecraft.sounds.SoundSource;
          import net.minecraft.world.InteractionHand;
          import net.minecraft.world.InteractionResult;
          import net.minecraft.world.entity.player.Player;
          import net.minecraft.world.level.Level;
          import net.minecraft.world.level.block.BaseEntityBlock;
          import net.minecraft.world.level.block.RenderShape;
          import net.minecraft.world.level.block.entity.BlockEntity;
          import net.minecraft.world.level.block.entity.BlockEntityTicker;
          import net.minecraft.world.level.block.entity.BlockEntityType;
          import net.minecraft.world.level.block.state.BlockState;
          import net.minecraft.world.phys.BlockHitResult;
          import org.jetbrains.annotations.Nullable;

          public class XvrBlock extends BaseEntityBlock {
              public XvrBlock(Properties prop) { super(prop); }

              @Override
              public RenderShape getRenderShape(BlockState state) { return RenderShape.MODEL; }

              @Nullable
              @Override
              public BlockEntity newBlockEntity(BlockPos pos, BlockState state) {
                  return new XvrBlockEntity(pos, state);
              }

              @Override
              public InteractionResult use(BlockState state, Level level, BlockPos pos, Player player, InteractionHand hand, BlockHitResult hit) {
                  if (player.getItemInHand(hand).isEmpty()) {
                      if (!level.isClientSide()) {
                          BlockEntity be = level.getBlockEntity(pos);
                          if (be instanceof XvrBlockEntity xvr) {
                              xvr.togglePower();
                              level.playSound(null, pos, SoundEvents.UI_BUTTON_CLICK.get(), SoundSource.BLOCKS, 1.0f, xvr.isPowered() ? 1.2f : 0.8f);
                          }
                      }
                      return InteractionResult.sidedSuccess(level.isClientSide());
                  }
                  return InteractionResult.PASS;
              }

              @Nullable
              @Override
              public <T extends BlockEntity> BlockEntityTicker<T> getTicker(Level level, BlockState state, BlockEntityType<T> type) {
                  return (lvl, p, st, be) -> {
                      if (be instanceof XvrBlockEntity xvr) xvr.tick(lvl, p, st);
                  };
              }
          }
          EOF

          cat << 'EOF' > src/main/java/com/immersivecctv/block/MonitorBlock.java
          package com.immersivecctv.block;

          import com.immersivecctv.blockentity.MonitorBlockEntity;
          import com.immersivecctv.client.ClientGuiOpener;
          import net.minecraft.core.BlockPos;
          import net.minecraft.world.InteractionHand;
          import net.minecraft.world.InteractionResult;
          import net.minecraft.world.entity.player.Player;
          import net.minecraft.world.level.Level;
          import net.minecraft.world.level.block.BaseEntityBlock;
          import net.minecraft.world.level.block.RenderShape;
          import net.minecraft.world.level.block.entity.BlockEntity;
          import net.minecraft.world.level.block.state.BlockState;
          import net.minecraft.world.phys.BlockHitResult;
          import net.minecraftforge.api.distmarker.Dist;
          import net.minecraftforge.fml.DistExecutor;
          import org.jetbrains.annotations.Nullable;

          public class MonitorBlock extends BaseEntityBlock {
              public MonitorBlock(Properties prop) { super(prop); }

              @Override
              public RenderShape getRenderShape(BlockState state) { return RenderShape.MODEL; }

              @Nullable
              @Override
              public BlockEntity newBlockEntity(BlockPos pos, BlockState state) {
                  return new MonitorBlockEntity(pos, state);
              }

              @Override
              public InteractionResult use(BlockState state, Level level, BlockPos pos, Player player, InteractionHand hand, BlockHitResult hit) {
                  if (player.getItemInHand(hand).isEmpty()) {
                      if (level.isClientSide()) {
                          DistExecutor.unsafeRunWhenOn(Dist.CLIENT, () -> () -> ClientGuiOpener.openMonitorScreen(pos));
                      }
                      return InteractionResult.sidedSuccess(level.isClientSide());
                  }
                  return InteractionResult.PASS;
              }
          }
          EOF

