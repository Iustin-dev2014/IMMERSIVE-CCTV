          import com.immersivecctv.blockentity.MonitorBlockEntity;
          import com.immersivecctv.blockentity.XvrBlockEntity;
          import com.mojang.blaze3d.vertex.PoseStack;
          import com.mojang.blaze3d.vertex.VertexConsumer;
          import net.minecraft.client.Minecraft;
          import net.minecraft.client.gui.Font;
          import net.minecraft.client.renderer.MultiBufferSource;
          import net.minecraft.client.renderer.RenderType;
          import net.minecraft.client.renderer.blockentity.BlockEntityRenderer;
          import net.minecraft.client.renderer.blockentity.BlockEntityRendererProvider;
          import net.minecraft.core.BlockPos;
          import net.minecraft.world.level.Level;
          import net.minecraft.world.level.block.entity.BlockEntity;
          import org.joml.Matrix4f;

          public class MonitorRenderer implements BlockEntityRenderer<MonitorBlockEntity> {
              public MonitorRenderer(BlockEntityRendererProvider.Context ctx) {}

              @Override
              public void render(MonitorBlockEntity monitor, float partialTicks, PoseStack poseStack, MultiBufferSource buffer, int packedLight, int packedOverlay) {
                  Level level = monitor.getLevel();
                  if (level == null) return;

                  BlockPos xvrPos = monitor.getConnectedXvr();
                  BlockEntity be = xvrPos != null ? level.getBlockEntity(xvrPos) : null;
                  XvrBlockEntity xvr = (be instanceof XvrBlockEntity) ? (XvrBlockEntity) be : null;

                  poseStack.pushPose();
                  poseStack.translate(0.5, 0.65, 0.36);
                  poseStack.scale(-0.015f, -0.015f, 0.015f);

                  Font font = Minecraft.getInstance().font;
                  Matrix4f mat = poseStack.last().pose();

                  if (xvr == null || !xvr.isPowered()) {
                      boolean blink = (System.currentTimeMillis() / 500) % 2 == 0;
                      int color = blink ? 0xFFFF0000 : 0xFF660000;
                      font.drawInBatch("● NO SIGNAL", -30, 0, color, false, mat, buffer, Font.DisplayMode.NORMAL, 0, packedLight);
                  } else {
                      boolean recBlink = (System.currentTimeMillis() / 600) % 2 == 0;
                      int recColor = recBlink ? 0xFFFF2222 : 0xFF770000;
                      font.drawInBatch("● REC", -32, -8, recColor, false, mat, buffer, Font.DisplayMode.NORMAL, 0, 15728880);
                      font.drawInBatch("XVR LIVE", 2, -8, 0xFF00FFCC, false, mat, buffer, Font.DisplayMode.NORMAL, 0, 15728880);
                      font.drawInBatch("CAM 01: ACTIVĂ", -32, 2, 0xFF55FF55, false, mat, buffer, Font.DisplayMode.NORMAL, 0, 15728880);
                      font.drawInBatch("[" + monitor.getBlockPos().toShortString() + "]", -32, 12, 0xFF888888, false, mat, buffer, Font.DisplayMode.NORMAL, 0, 15728880);
                  }
                  poseStack.popPose();

                  if (xvrPos != null) {
                      renderCable(monitor.getBlockPos(), xvrPos, poseStack, buffer, 0.12f, 0.12f, 0.14f);
                  }
              }

              public static void renderCable(BlockPos start, BlockPos end, PoseStack poseStack, MultiBufferSource buffer, float r, float g, float b) {
                  poseStack.pushPose();
                  VertexConsumer vc = buffer.getBuffer(RenderType.lines());
                  Matrix4f matrix = poseStack.last().pose();

                  double dx = end.getX() - start.getX();
                  double dy = end.getY() - start.getY();
                  double dz = end.getZ() - start.getZ();

                  double startX = 0.5, startY = 0.3, startZ = 0.5;
                  double endX = dx + 0.5, endY = dy + 0.3, endZ = dz + 0.5;

                  int segments = 16;
                  double prevX = startX, prevY = startY, prevZ = startZ;

                  for (int i = 1; i <= segments; i++) {
                      double t = (double) i / segments;
                      double curX = startX + (endX - startX) * t;
                      double curZ = startZ + (endZ - startZ) * t;
                      double droop = 0.5 * Math.sin(t * Math.PI);
                      double curY = startY + (endY - startY) * t - droop;

                      vc.vertex(matrix, (float) prevX, (float) prevY, (float) prevZ).color(r, g, b, 1.0f).normal(0.0f, 1.0f, 0.0f).endVertex();
                      vc.vertex(matrix, (float) curX, (float) curY, (float) curZ).color(r, g, b, 1.0f).normal(0.0f, 1.0f, 0.0f).endVertex();

                      prevX = curX;
                      prevY = curY;
                      prevZ = curZ;
                  }
                  poseStack.popPose();
              }
          }
          EOF

          cat << 'EOF' > src/main/java/com/immersivecctv/client/XvrRenderer.java
          package com.immersivecctv.client;

          import com.immersivecctv.blockentity.XvrBlockEntity;
          import com.mojang.blaze3d.vertex.PoseStack;
          import net.minecraft.client.renderer.MultiBufferSource;
          import net.minecraft.client.renderer.blockentity.BlockEntityRenderer;
          import net.minecraft.client.renderer.blockentity.BlockEntityRendererProvider;
          import net.minecraft.core.BlockPos;

          public class XvrRenderer implements BlockEntityRenderer<XvrBlockEntity> {
              public XvrRenderer(BlockEntityRendererProvider.Context ctx) {}

              @Override
              public void render(XvrBlockEntity xvr, float partialTicks, PoseStack poseStack, MultiBufferSource buffer, int packedLight, int packedOverlay) {
                  if (xvr.getLevel() == null) return;
                  for (BlockPos camPos : xvr.getConnectedCameras()) {
                      MonitorRenderer.renderCable(xvr.getBlockPos(), camPos, poseStack, buffer, 0.0f, 0.45f, 0.9f);
                  }
              }
          }
          EOF

          cat << 'EOF' > src/main/java/com/immersivecctv/client/ClientModEvents.java
          package com.immersivecctv.client;

          import com.immersivecctv.ImmersiveCCTV;
          import net.minecraftforge.api.distmarker.Dist;
          import net.minecraftforge.client.event.EntityRenderersEvent;
          import net.minecraftforge.eventbus.api.SubscribeEvent;
          import net.minecraftforge.fml.common.Mod;

          @Mod.EventBusSubscriber(modid = ImmersiveCCTV.MODID, bus = Mod.EventBusSubscriber.Bus.MOD, value = Dist.CLIENT)
          public class ClientModEvents {
              @SubscribeEvent
              public static void registerRenderers(EntityRenderersEvent.RegisterRenderers event) {
                  event.registerBlockEntityRenderer(ImmersiveCCTV.MONITOR_BE.get(), MonitorRenderer::new);
                  event.registerBlockEntityRenderer(ImmersiveCCTV.XVR_BE.get(), XvrRenderer::new);
              }
          }
          EOF

      - name: Verify Gradle Version
        run: gradle --version

      - name: Build Mod with Gradle
        run: gradle build --no-daemon --stacktrace

      - name: Prepare Artifact
        run: |
          mkdir -p output
          cp build/libs/*.jar output/
          cd output && zip -r immersive-cctv-mod-1.20.1.zip .

      - name: Upload Mod Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Immersive-CCTV-Forge-1.20.1
          path: output/immersive-cctv-mod-1.20.1.zip
