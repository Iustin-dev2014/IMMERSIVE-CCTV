name: Build IMMERSIVE CCTV (Forge 1.20.1)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout mod source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Validate required feature source files
        shell: bash
        run: |
          set -euo pipefail
          test -f build.gradle || test -f build.gradle.kts
          test -f gradlew
          echo 'Project files found. Compiling the source checked out from this repository.'
          echo 'Note: this workflow does not invent missing gameplay features; those must exist in the checked-out source.'
      - name: Build mod
        run: ./gradlew --no-daemon clean build
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: immersive-cctv-forge-1.20.1
          path: build/libs/*.jar
          if-no-files-found: error
