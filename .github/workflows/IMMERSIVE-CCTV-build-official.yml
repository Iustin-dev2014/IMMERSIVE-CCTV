      - name: Generate texture assets
        working-directory: immersive-cctv-build-source
        run: python scripts/generate_textures.py

      - name: Generate sound assets
        working-directory: immersive-cctv-build-source
        run: python scripts/generate_sounds.py

      - name: Validate resources
        working-directory: immersive-cctv-build-source
        run: python scripts/validate_resources.py

      - name: Build Forge mod
        working-directory: immersive-cctv-build-source
        run: gradle --no-daemon clean build

      - name: Upload compiled mod JAR
        uses: actions/upload-artifact@v6
        with:
          name: immersivecctv-1.4.0-forge-1.20.1
          path: immersive-cctv-build-source/build/libs/*.jar
          if-no-files-found: error
