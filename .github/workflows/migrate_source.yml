name: Migrate embedded source into repository

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/migrate_source.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore embedded source into normal project files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, io, pathlib, re, tarfile
          workflow = pathlib.Path(".github/workflows/build_repaired.yml").read_text(encoding="utf-8")
          match = re.search(r'payload\s*=\s*"""(.*?)"""', workflow, re.S)
          if not match:
              raise SystemExit("Could not find embedded source payload in build_repaired.yml")
          encoded = re.sub(r"\s+", "", match.group(1))
          raw = gzip.decompress(base64.b64decode(encoded))
          archive = tarfile.open(fileobj=io.BytesIO(raw), mode="r:*")
          members = archive.getmembers()
          if not members:
              raise SystemExit("Embedded archive is empty")
          root = pathlib.Path.cwd().resolve()
          extracted = 0
          for member in members:
              parts = pathlib.PurePosixPath(member.name).parts
              if not parts or member.name.startswith("/") or ".." in parts:
                  continue
              # Strip the packaging directory so build.gradle and src/ land at repo root.
              if parts[0] == "project":
                  parts = parts[1:]
              if parts and parts[0] == "ImmersiveCCTV-1.4.0":
                  parts = parts[1:]
              if not parts:
                  continue
              target = root.joinpath(*parts)
              if not target.resolve().is_relative_to(root):
                  raise SystemExit(f"Unsafe archive path: {member.name}")
              if member.isdir():
                  target.mkdir(parents=True, exist_ok=True)
                  continue
              if not member.isfile():
                  continue
              source = archive.extractfile(member)
              if source is None:
                  continue
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(source.read())
              extracted += 1
          print(f"Restored {extracted} files from embedded archive")
          for required in ("build.gradle", "settings.gradle", "gradle.properties", "src/main"):
              if not pathlib.Path(required).exists():
                  raise SystemExit(f"Required project path missing after extraction: {required}")
          PY

      - name: Commit extracted project files
        shell: bash
        run: |
          set -euo pipefail
          git add -A -- ':!/.github/workflows'
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Move IMMERSIVE CCTV source into standard repository layout"
          git push origin HEAD:main
