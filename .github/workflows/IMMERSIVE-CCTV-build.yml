          archive_bytes = base64.b64decode("".join(encoded.split()))
          root = pathlib.Path('.')
          with tarfile.open(fileobj=io.BytesIO(archive_bytes), mode='r:gz') as archive:
              for member in archive.getmembers():
                  relative = pathlib.PurePosixPath(member.name)
                  if relative.is_absolute() or '..' in relative.parts:
                      raise RuntimeError('Unsafe path in embedded project: ' + member.name)
                  if not member.isfile():
                      continue
                  destination = root.joinpath(*relative.parts)
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  source = archive.extractfile(member)
                  if source is None:
                      raise RuntimeError('Cannot extract embedded file: ' + member.name)
                  with source, destination.open('wb') as output:
                      output.write(source.read())
          print('Embedded project generated.')
          PYBOOTSTRAP

      - name: Generate textures and sounds, then validate resources
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/generate_textures.py
          python3 - <<'PYVALIDATE'
          import json, pathlib, struct
          for path in pathlib.Path('src/main/resources').rglob('*.json'):
              json.loads(path.read_text(encoding='utf-8'))
          pngs = list(pathlib.Path('src/main/resources').rglob('*.png'))
          for path in pngs:
              data = path.read_bytes()
              if data[:8] != b'\x89PNG\r\n\x1a\n' or struct.unpack('>II', data[16:24]) != (128, 128):
                  raise SystemExit(f'Invalid/non-128x128 PNG: {path}')
          sounds_json = json.loads(pathlib.Path('src/main/resources/assets/immersivecctv/sounds.json').read_text(encoding='utf-8'))
          sound_dir = pathlib.Path('src/main/resources/assets/immersivecctv/sounds')
          missing = [name for name, spec in sounds_json.items() if not (sound_dir / (spec['sounds'][0]['name'].split(':', 1)[1] + '.ogg')).is_file()]
          if missing:
              raise SystemExit('Missing sound assets: ' + ', '.join(missing))
          if len(sounds_json) < 200:
              raise SystemExit(f'Expected at least 200 sound events, got {len(sounds_json)}')
          print(f'Validated JSON resources, {len(pngs)} 128x128 textures, and {len(sounds_json)} sound events.')
          PYVALIDATE

      - name: Set up Gradle 8.1.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.1.1'

      - name: Compile and reobfuscate mod JAR
        run: gradle --no-daemon build

      - name: Assemble distributable ZIPs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          JAR_PATH="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' -print -quit)"
          if [[ -z "$JAR_PATH" ]]; then echo 'Build succeeded but no JAR was found in build/libs' >&2; exit 1; fi
          cp "$JAR_PATH" dist/ImmersiveCCTV-Forge-1.20.1.jar
          cat > dist/INSTALL.txt <<'INSTALL_EOF'
          Immersive CCTV 1.3.0 — Minecraft Forge 1.20.1

          Requires Minecraft Java Edition 1.20.1, Forge 47.2.0 and Java 17.
          Copy ImmersiveCCTV-Forge-1.20.1.jar into the game's mods folder.

          PHYSICAL CONNECTIONS:
          1. Place a Wall Power Outlet against a solid wall. Use AC Charger 12V on the XVR rear DC jack, then use Power Cable: click the outlet face, then the XVR power jack. Repeat outlet + Power Cable for the monitor. The XVR and monitor will not run without mains power.
          2. Hold the HDMI cable item. Click the small jack on the BACK of the monitor.
          3. Click the HDMI socket on the BACK of the XVR.
          4. Hold the blue PoE cable item. Click the socket on the BACK of the camera.
          5. Click one of the eight individual RJ45 sockets on the FRONT of the XVR.
          6. Use an empty hand and click the physical POWER button on the XVR front panel.
          7. Wait through the cold boot and sequential camera link stage, then right-click the powered monitor to open the console.
          8. Use XVR SETTINGS to toggle/restart the active camera or shut down the XVR. Shift-right-click the monitor/camera to disconnect its CCTV link, or the XVR to disconnect all.

          Camera feed note: the console displays a 192x108 textured world-raycast preview refreshed incrementally to limit stutters. It samples baked block textures, but it is not a full secondary Minecraft scene render; entity skins, animation, particles, clouds and some transparency effects may differ from the normal player view.
          INSTALL_EOF
          (cd dist && zip -j -q ImmersiveCCTV-Forge-1.20.1.zip ImmersiveCCTV-Forge-1.20.1.jar INSTALL.txt)
          zip -q -r dist/ImmersiveCCTV-Source.zip build.gradle settings.gradle gradle.properties src scripts README.md .github/workflows/build.yml
          echo 'Generated packages:'
          ls -lh dist/*.zip dist/*.jar

      - name: Upload JAR and source/distribution ZIPs
        uses: actions/upload-artifact@v4
        with:
          name: ImmersiveCCTV-Forge-1.20.1
          path: |
            dist/ImmersiveCCTV-Forge-1.20.1.zip
            dist/ImmersiveCCTV-Source.zip
            dist/ImmersiveCCTV-Forge-1.20.1.jar
          if-no-files-found: error
          retention-days: 14
