name: Web Confirmation Test

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: web-confirmation-test
  cancel-in-progress: false

jobs:
  wait-for-confirmation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify confirmation page is published
        shell: bash
        run: |
          set -euo pipefail
          page_url="https://iustin-dev2014.github.io/IMMERSIVE-CCTV/confirm-test/"
          echo "Checking that the confirmation page is published: ${page_url}"
          for attempt in {1..12}; do
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' --location --max-time 15 "${page_url}" || true)"
            if [[ "${status}" == "200" ]]; then
              echo "Confirmation page is online."
              exit 0
            fi
            echo "Attempt ${attempt}/12: page returned HTTP ${status:-no response}; retrying in 5 seconds."
            sleep 5
          done
          echo "::error::The confirmation page is not published (expected HTTP 200). Check Settings > Pages and the 'Deploy Web Confirmation Page' workflow."
          exit 1

      - name: Create confirmation session
        id: session
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          nonce="$(openssl rand -hex 32)"
          title="[CCTV TEST CONFIRM] Run ${RUN_ID}"
          issue_json="$(gh api "repos/${REPOSITORY}/issues" -f title="${title}" -f body="Temporary confirmation session for Actions run ${RUN_ID}. It is permanently deleted when the session ends.")"
          issue_number="$(printf '%s' "${issue_json}" | jq -r '.number')"
          page_url="https://iustin-dev2014.github.io/IMMERSIVE-CCTV/confirm-test/?issue=${issue_number}&token=${nonce}"
          echo "issue_number=${issue_number}" >> "$GITHUB_OUTPUT"
          echo "nonce=${nonce}" >> "$GITHUB_OUTPUT"
          echo "page_url=${page_url}" >> "$GITHUB_OUTPUT"
          {
            echo "## Confirm this test in your browser"
            echo
            echo "Open the page, copy the unique code, then post it as a comment on the temporary issue. The comment must come from **Iustin-dev2014**."
            echo
            echo "${page_url}"
            echo
            echo "The session expires after 5 minutes. The temporary issue is permanently deleted afterward."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Confirmation page: ${page_url}"

      - name: Wait up to five minutes for owner comment
        id: wait
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ steps.session.outputs.issue_number }}
          NONCE: ${{ steps.session.outputs.nonce }}
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 300))
          while (( SECONDS < deadline )); do
            comments="$(gh api --paginate "repos/${REPOSITORY}/issues/${ISSUE_NUMBER}/comments" 2>/dev/null || echo '[]')"
            if printf '%s' "${comments}" | jq -e --arg marker "CCTV_TEST_CONFIRM:${NONCE}" --arg owner "Iustin-dev2014" '[.[] | select(.body == $marker and .user.login == $owner)] | length > 0' >/dev/null; then
              echo "confirmed=true" >> "$GITHUB_OUTPUT"
              echo "Owner confirmation received through the GitHub issue comment."
              exit 0
            fi
            sleep 5
          done
          echo "confirmed=false" >> "$GITHUB_OUTPUT"
          echo "No owner confirmation received within five minutes; ending the session."

      - name: Permanently delete temporary confirmation issue
        if: always() && steps.session.outputs.issue_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ steps.session.outputs.issue_number }}
          CONFIRMED: ${{ steps.wait.outputs.confirmed }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          issue_json="$(gh api "repos/${REPOSITORY}/issues/${ISSUE_NUMBER}")"
          issue_node_id="$(printf '%s' "${issue_json}" | jq -r '.node_id')"
          if [[ -z "${issue_node_id}" || "${issue_node_id}" == "null" ]]; then
            echo "::error::Could not get the temporary issue's GraphQL node ID; permanent deletion was not attempted."
            exit 1
          fi
          if [[ "${CONFIRMED:-false}" == "true" ]]; then
            {
              echo "## ✅ Confirmation received"
              echo
              echo "The workflow validated the exact one-time comment from **Iustin-dev2014**."
              echo
              echo "The temporary issue was then permanently deleted."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## ⌛ Confirmation timed out"
              echo
              echo "No valid comment from **Iustin-dev2014** was received within 5 minutes."
              echo
              echo "The temporary issue was then permanently deleted."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          gh api graphql -f query='mutation($id: ID!) { deleteIssue(input: {issueId: $id}) { clientMutationId } }' -F id="${issue_node_id}"
          echo "Temporary issue #${ISSUE_NUMBER} was permanently deleted."
