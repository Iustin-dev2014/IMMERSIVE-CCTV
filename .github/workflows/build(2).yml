          package ro.immersivecctv.item;
          
          import net.minecraft.core.BlockPos;
          import net.minecraft.world.InteractionResult;
          import net.minecraft.world.item.Item;
          import net.minecraft.world.item.context.UseOnContext;
          import net.minecraft.world.level.Level;
          import net.minecraft.world.level.block.entity.BlockEntity;
          import ro.immersivecctv.LinkingManager;
          import ro.immersivecctv.blockentity.CameraBlockEntity;
          import ro.immersivecctv.blockentity.MonitorBlockEntity;
          import ro.immersivecctv.blockentity.XvrBlockEntity;
          
          public class CctvCableItem extends Item {
              public enum Kind { HDMI, POE }
              private final Kind kind;
          
              public CctvCableItem(Kind kind, Properties properties) {
                  super(properties);
                  this.kind = kind;
              }
          
              @Override
              public InteractionResult useOn(UseOnContext context) {
                  Level level = context.getLevel();
                  if (level.isClientSide) return InteractionResult.SUCCESS;
                  BlockPos pos = context.getClickedPos();
                  BlockEntity be = level.getBlockEntity(pos);
                  if (kind == Kind.HDMI && be instanceof MonitorBlockEntity && context.getPlayer() != null) {
                      LinkingManager.select(context.getPlayer(), LinkingManager.Endpoint.MONITOR, pos);
                      return InteractionResult.CONSUME;
                  }
                  if (kind == Kind.POE && be instanceof CameraBlockEntity && context.getPlayer() != null) {
                      LinkingManager.select(context.getPlayer(), LinkingManager.Endpoint.CAMERA, pos);
                      return InteractionResult.CONSUME;
                  }
                  if (be instanceof XvrBlockEntity && context.getPlayer() != null && LinkingManager.hasPending(context.getPlayer())) {
                      return LinkingManager.completePending(context.getPlayer(), level, pos) ? InteractionResult.CONSUME : InteractionResult.FAIL;
                  }
                  return InteractionResult.PASS;
              }
          }
