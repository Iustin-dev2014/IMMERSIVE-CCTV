      - name: Set up Gradle 8.1.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.1.1'

      - name: Compile and reobfuscate mod JAR
        run: gradle --no-daemon build

      - name: Assemble distributable ZIPs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          JAR_PATH="$(find build/libs -maxdepth 1 -type f -name "*.jar" ! -name "*sources*" -print -quit)"
          if [[ -z "$JAR_PATH" ]]; then echo "Build succeeded but no JAR was found in build/libs" >&2; exit 1; fi
          cp "$JAR_PATH" dist/ImmersiveCCTV-Forge-1.20.1.jar
          cat > dist/INSTALL.txt <<'INSTALL_EOF'
          Immersive CCTV — instalare

          Cerințe: Minecraft Java Edition 1.20.1 și Minecraft Forge 47.2.0, rulând pe Java 17.
          Copiază ImmersiveCCTV-Forge-1.20.1.jar în folderul .minecraft/mods.

          Utilizare rapidă:
          1. Pune monitorul, XVR-ul și camera din fila creativă Immersive CCTV.
          2. Click dreapta cu mâna goală pe monitor neconectat, apoi pe XVR pentru legătura HDMI.
          3. Click dreapta pe cameră, apoi pe XVR pentru legătura Ethernet PoE.
          4. Click dreapta cu mâna goală pe XVR pentru pornire/oprire.
          5. Click dreapta pe monitorul conectat deschide consola; Shift+click dreapta deconectează.

          Consola afișează o interfață CRT simulată și detectează entități vii în raza camerei. Nu este o captură render-to-texture a perspectivei optice reale.
          INSTALL_EOF
          (cd dist && zip -j -q ImmersiveCCTV-Forge-1.20.1.zip ImmersiveCCTV-Forge-1.20.1.jar INSTALL.txt)
          zip -q -r dist/ImmersiveCCTV-Source.zip build.gradle settings.gradle gradle.properties src scripts README.md .github/workflows/build.yml
          echo "Packages created:"
          ls -lh dist/*.zip dist/*.jar

      - name: Upload JAR and ZIP packages
        uses: actions/upload-artifact@v4
        with:
          name: ImmersiveCCTV-Forge-1.20.1
          path: |
            dist/ImmersiveCCTV-Forge-1.20.1.zip
            dist/ImmersiveCCTV-Source.zip
            dist/ImmersiveCCTV-Forge-1.20.1.jar
          if-no-files-found: error
          retention-days: 14
