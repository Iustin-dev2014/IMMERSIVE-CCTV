          package ro.immersivecctv.client;
          
          import com.mojang.blaze3d.vertex.PoseStack;
          import com.mojang.blaze3d.vertex.VertexConsumer;
          import net.minecraft.core.BlockPos;
          import net.minecraft.world.phys.Vec3;
          import net.minecraft.client.renderer.MultiBufferSource;
          import net.minecraft.client.renderer.RenderType;
          import net.minecraft.client.renderer.blockentity.BlockEntityRenderer;
          import net.minecraft.client.renderer.blockentity.BlockEntityRendererProvider;
          import ro.immersivecctv.blockentity.XvrBlockEntity;
          
          public class XvrCableRenderer implements BlockEntityRenderer<XvrBlockEntity> {
              public XvrCableRenderer(BlockEntityRendererProvider.Context context) {}
          
              @Override
              public void render(XvrBlockEntity be, float partialTick, PoseStack poseStack, MultiBufferSource buffers, int packedLight, int packedOverlay) {
                  VertexConsumer vc = buffers.getBuffer(RenderType.lines());
                  PoseStack.Pose pose = poseStack.last();
                  Vec3 start = new Vec3(0.5, 0.30, 0.5);
                  if (be.getMonitorPos() != null) {
                      Vec3 end = relative(be.getBlockPos(), be.getMonitorPos(), 0.36);
                      drawCatenary(vc, pose, start, end, 0.18, 0xFF12191E);
                  }
                  for (BlockPos camera : be.getCameras()) {
                      Vec3 end = relative(be.getBlockPos(), camera, 0.48);
                      drawCatenary(vc, pose, start, end, 0.24, 0xFF208DE0);
                  }
              }
          
              private Vec3 relative(BlockPos origin, BlockPos target, double endY) {
                  return new Vec3(target.getX() - origin.getX() + 0.5, target.getY() - origin.getY() + endY, target.getZ() - origin.getZ() + 0.5);
              }
          
              private void drawCatenary(VertexConsumer vc, PoseStack.Pose pose, Vec3 start, Vec3 end, double sag, int argb) {
                  int a = (argb >>> 24) & 255, r = (argb >>> 16) & 255, g = (argb >>> 8) & 255, b = argb & 255;
                  Vec3 previous = start;
                  for (int i = 1; i <= 18; i++) {
                      double t = i / 18.0;
                      Vec3 current = new Vec3(
                              start.x + (end.x - start.x) * t,
                              start.y + (end.y - start.y) * t - sag * 4.0 * t * (1.0 - t),
                              start.z + (end.z - start.z) * t);
                      vertex(vc, pose, previous, r, g, b, a);
                      vertex(vc, pose, current, r, g, b, a);
                      previous = current;
                  }
              }
          
              private void vertex(VertexConsumer vc, PoseStack.Pose pose, Vec3 p, int r, int g, int b, int a) {
                  vc.vertex(pose.pose(), (float) p.x, (float) p.y, (float) p.z)
                          .color(r, g, b, a).normal(pose.normal(), 0.0F, 1.0F, 0.0F).endVertex();
              }
          }
