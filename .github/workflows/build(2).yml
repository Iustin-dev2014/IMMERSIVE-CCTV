          import ro.immersivecctv.block.XvrBlock;
          import ro.immersivecctv.blockentity.CameraBlockEntity;
          import ro.immersivecctv.blockentity.MonitorBlockEntity;
          import ro.immersivecctv.blockentity.XvrBlockEntity;
          
          public class XvrScreen extends Screen {
              private final BlockPos monitorPos;
              private int channel;
              private int filter;
              private boolean alarm = true;
              private boolean settings;
              private long openedAt;
          
              public XvrScreen(BlockPos monitorPos) {
                  super(Component.literal("IMMERSIVE XVR SURVEILLANCE"));
                  this.monitorPos = monitorPos.immutable();
              }
          
              @Override
              protected void init() {
                  openedAt = System.currentTimeMillis();
                  rebuildButtons();
              }
          
              private void rebuildButtons() {
                  clearWidgets();
                  int y = height - 30;
                  int center = width / 2;
                  if (!settings) {
                      int buttonW = 55;
                      int gap = 4;
                      int total = 4 * buttonW + 3 * gap;
                      int x = center - total / 2;
                      for (int i = 0; i < 4; i++) {
                          final int selected = i;
                          addRenderableWidget(Button.builder(Component.literal(String.format("CAM %02d", i + 1)), b -> {
                              channel = selected;
                              rebuildButtons();
                          }).bounds(x + i * (buttonW + gap), y, buttonW, 20).build());
                      }
                      addRenderableWidget(Button.builder(Component.literal("SETĂRI"), b -> { settings = true; rebuildButtons(); })
                              .bounds(center - 46, y - 27, 92, 20).build());
                  } else {
                      addRenderableWidget(Button.builder(Component.literal("FILTRU: " + filterName()), b -> { filter = (filter + 1) % 3; rebuildButtons(); })
                              .bounds(center - 140, height / 2 + 16, 90, 20).build());
                      addRenderableWidget(Button.builder(Component.literal("ALARMĂ: " + (alarm ? "ACTIVATĂ" : "OPRITĂ")), b -> { alarm = !alarm; rebuildButtons(); })
                              .bounds(center - 45, height / 2 + 16, 100, 20).build());
                      addRenderableWidget(Button.builder(Component.literal("ÎNAPOI LA FEED"), b -> { settings = false; rebuildButtons(); })
                              .bounds(center + 60, height / 2 + 16, 92, 20).build());
                  }
              }
          
              private String filterName() {
                  return switch (filter) { case 1 -> "NIGHT IR"; case 2 -> "THERMAL"; default -> "STANDARD HD"; };
              }
          
              private MonitorBlockEntity monitor() {
                  Level level = Minecraft.getInstance().level;
                  return level != null && level.getBlockEntity(monitorPos) instanceof MonitorBlockEntity monitor ? monitor : null;
              }
          
              private XvrBlockEntity xvr() {
                  MonitorBlockEntity monitor = monitor();
                  Level level = Minecraft.getInstance().level;
                  if (monitor == null || monitor.getXvrPos() == null || level == null) return null;
                  BlockEntity be = level.getBlockEntity(monitor.getXvrPos());
                  return be instanceof XvrBlockEntity xvr ? xvr : null;
              }
          
              private boolean signal() {
                  XvrBlockEntity xvr = xvr();
                  MonitorBlockEntity monitor = monitor();
                  Level level = Minecraft.getInstance().level;
                  return xvr != null && monitor != null && level != null
                          && xvr.getMonitorPos() != null && xvr.getMonitorPos().equals(monitorPos)
                          && level.getBlockState(xvr.getBlockPos()).hasProperty(XvrBlock.POWERED)
                          && level.getBlockState(xvr.getBlockPos()).getValue(XvrBlock.POWERED);
              }
          
              private BlockPos currentCameraPos() {
                  XvrBlockEntity xvr = xvr();
                  if (xvr == null || xvr.getCameras().isEmpty()) return null;
                  List<BlockPos> cams = xvr.getCameras();
                  return cams.get(Math.floorMod(channel, cams.size()));
              }
          
              private List<LivingEntity> targets() {
                  Minecraft mc = Minecraft.getInstance();
                  if (!alarm || mc.level == null || !signal()) return List.of();
                  BlockPos camera = currentCameraPos();
                  if (camera == null) return List.of();
                  AABB area = new AABB(camera).inflate(14.0D);
                  Player self = mc.player;
                  return mc.level.getEntitiesOfClass(LivingEntity.class, area,
                          entity -> entity.isAlive() && entity != self && entity.distanceToSqr(camera.getX() + 0.5, camera.getY() + 0.5, camera.getZ() + 0.5) <= 196.0D);
              }
          
              @Override
              public void render(GuiGraphics g, int mouseX, int mouseY, float partialTick) {
                  boolean live = signal();
                  int bg = filter == 1 ? 0xFF031507 : (filter == 2 ? 0xFF17150A : 0xFF05090F);
                  g.fill(0, 0, width, height, bg);
                  int margin = Math.max(12, width / 26);
                  int top = 24;
                  int bottom = height - 62;
                  g.fill(margin - 2, top - 2, width - margin + 2, bottom + 2, 0xFF26343A);
                  g.fill(margin, top, width - margin, bottom, live ? (filter == 1 ? 0xFF051A0A : filter == 2 ? 0xFF292410 : 0xFF07121A) : 0xFF020304);
          
                  boolean booting = live && System.currentTimeMillis() - openedAt < 2800L;
                  if (!live) {
                      int boxW = Math.min(360, width - margin * 2 - 20);
                      int boxH = 36;
                      int t = (int) ((System.currentTimeMillis() - openedAt) / 22L);
                      int maxX = Math.max(0, width - margin * 2 - boxW);
                      int maxY = Math.max(0, bottom - top - boxH);
                      int x = margin + (int) (Math.abs(Math.sin(t * 0.043)) * maxX);
                      int y = top + (int) (Math.abs(Math.cos(t * 0.031)) * maxY);
                      g.fill(x, y, x + boxW, y + boxH, 0xFF500D11);
                      g.fill(x + 1, y + 1, x + boxW - 1, y + boxH - 1, 0xFF050505);
                      g.drawCenteredString(font, "LIPSĂ SEMNAL (NO SIGNAL)", x + boxW / 2, y + 7, 0xFFFF4040);
                      g.drawCenteredString(font, "Verifică HDMI sau alimentarea XVR", x + boxW / 2, y + 20, 0xFFB9B9B9);
                  } else if (booting) {
                      long elapsed = System.currentTimeMillis() - openedAt;
                      int cx = width / 2;
                      g.drawCenteredString(font, "=== IMMERSIVE XVR SURVEILLANCE ===", cx, height / 2 - 48, 0xFF71F4E2);
                      g.drawCenteredString(font, "Firmware v1.0.0 // SECURE BOOT", cx, height / 2 - 25, 0xFFCADDE0);
                      if (elapsed > 350) g.drawCenteredString(font, "[ OK ] Inițializare kernel XVR", cx, height / 2 - 7, 0xFF67F4A1);
                      if (elapsed > 900) g.drawCenteredString(font, "[ OK ] Inițializare porturi PoE", cx, height / 2 + 7, 0xFF67F4A1);
                      if (elapsed > 1450) g.drawCenteredString(font, "[ OK ] Test integritate HDD 2.4 TB", cx, height / 2 + 21, 0xFF67F4A1);
                      int barW = Math.min(260, width - margin * 2);
                      int barX = cx - barW / 2;
                      g.fill(barX, height / 2 + 38, barX + barW, height / 2 + 44, 0xFF24323A);
                      g.fill(barX, height / 2 + 38, barX + (int)(barW * Math.min(1.0, elapsed / 2800.0)), height / 2 + 44, 0xFF42D9C7);
                  } else {
                      String camName = String.format("CAM %02d", channel + 1);
                      g.drawString(font, "[AI] CRT FEED // " + camName, margin + 8, top + 8, filter == 1 ? 0xFF49FF65 : 0xFF79E5F2, false);
                      drawCrosshair(g, width / 2, (top + bottom) / 2, 0x887DE9F5);
                      drawTargets(g, targets(), margin, top, bottom);
                      long seconds = System.currentTimeMillis() / 1000L;
                      if (seconds % 2 == 0) g.drawString(font, "● REC", width - margin - 48, top + 8, 0xFFFF3333, false);
                      g.drawString(font, "XVR LIVE", margin + 8, bottom - 15, 0xFF55FFBD, false);
                      BlockPos cp = currentCameraPos();
                      if (cp != null) g.drawString(font, "CAM COORD: " + cp.getX() + " " + cp.getY() + " " + cp.getZ(), margin + 84, bottom - 15, 0xFFB0CED3, false);
                      if (!targets().isEmpty() && alarm) {
                          g.fill(width / 2 - 132, top + 27, width / 2 + 132, top + 42, 0xCC6F0000);
                          g.drawCenteredString(font, "⚠ ALARMĂ: MIȘCARE DETECTATĂ!", width / 2, top + 31, 0xFFFF5A5A);
                      }
                      // CRT scanlines, kept subtle so labels remain readable.
                      for (int y = top + 2; y < bottom; y += 4) g.fill(margin, y, width - margin, y + 1, 0x22000000);
                  }
          
                  g.fill(margin - 2, 4, width - margin + 2, 20, 0xFF111B23);
                  g.drawString(font, "=== IMMERSIVE XVR SURVEILLANCE ===", margin + 6, 9, 0xFFB8E8EE, false);
                  g.drawString(font, "POE " + ((xvr() != null && !xvr().getCameras().isEmpty()) ? "ONLINE" : "OFFLINE"), width - margin - 74, 9, 0xFF6AFF9A, false);
                  g.drawCenteredString(font, settings ? "SETĂRI XVR" : "CANAL: " + String.format("CAM %02d", channel + 1) + " | FILTRU: " + filterName(), width / 2, height - 48, 0xFFB7D8E0);
                  super.render(g, mouseX, mouseY, partialTick);
              }
          
              private void drawCrosshair(GuiGraphics g, int x, int y, int color) {
                  g.fill(x - 13, y, x - 4, y + 1, color);
                  g.fill(x + 4, y, x + 13, y + 1, color);
                  g.fill(x, y - 13, x + 1, y - 4, color);
                  g.fill(x, y + 4, x + 1, y + 13, color);
              }
          
              private void drawTargets(GuiGraphics g, List<LivingEntity> targets, int margin, int top, int bottom) {
                  int index = 0;
                  for (LivingEntity entity : targets) {
                      int usableW = Math.max(1, width - 2 * margin - 70);
                      int usableH = Math.max(1, bottom - top - 90);
                      int x = margin + 35 + Math.floorMod(entity.getUUID().hashCode() * 31, usableW);
                      int y = top + 48 + Math.floorMod(entity.getUUID().hashCode() * 17, usableH);
                      int boxW = 48 + Math.floorMod(entity.getId(), 36);
                      int boxH = 28 + Math.floorMod(entity.getId(), 20);
                      int c = 0xFFFF3535;
                      g.fill(x, y, x + boxW, y + 1, c); g.fill(x, y + boxH, x + boxW, y + boxH + 1, c);
                      g.fill(x, y, x + 1, y + boxH, c); g.fill(x + boxW, y, x + boxW + 1, y + boxH, c);
                      double distance = Math.sqrt(entity.distanceToSqr(currentCameraPos().getX() + 0.5, currentCameraPos().getY() + 0.5, currentCameraPos().getZ() + 0.5));
                      String label = "[AI ȚINTĂ] " + entity.getName().getString() + " - " + String.format(java.util.Locale.ROOT, "%.1fm", distance);
                      g.drawString(font, label, x, Math.max(top + 20, y - 10), c, false);
                      index++;
                      if (index >= 8) break;
                  }
              }
          
              @Override
              public boolean isPauseScreen() { return false; }
          }
