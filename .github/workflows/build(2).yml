name: Build Immersive CCTV (Forge 1.20.1)

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate complete Forge project from this workflow
        shell: bash
        run: |
          set -euo pipefail
          echo "Creating Immersive CCTV source tree..."
          mkdir -p '.'
          cat > 'README.md' <<'__IMMERSIVE_FILE_0000__'
          # Immersive CCTV — Forge 1.20.1
          
          Mod Minecraft Java Edition construit pentru Forge `1.20.1-47.2.0`, cu Java 17.
          
          ## Funcționalități incluse
          
          - Blocuri modelate din elemente cuboidale pentru unitatea XVR, monitor widescreen și camera Bullet IR.
          - Texturi 64×64 generate numai cu Python standard library.
          - Pornire/oprire XVR, feedback sonor și aspect frontal diferit pentru starea de alimentare.
          - Conectare HDMI monitor↔XVR și Ethernet PoE cameră↔XVR; conexiunile sunt salvate în block entities.
          - Cabluri vizibile cu curbură/săgeată, cablu HDMI negru și cablu PoE albastru.
          - Status live pe suprafața monitorului, ecran fullscreen in-game cu secvență de boot, ecran NO SIGNAL, stil CRT, canale, setări de filtru, alarmă și scanare a entităților vii într-o rază de 14 blocuri.
          - Creative tab dedicat cu toate cele cinci obiecte.
          
          ## Comenzi în joc
          
          1. Așază monitorul, XVR-ul și una sau mai multe camere.
          2. Pentru conexiune rapidă cu mâna goală: click dreapta pe monitor neconectat, apoi click dreapta pe XVR pentru HDMI. Pentru PoE, click dreapta pe cameră, apoi pe XVR.
          3. Alternativ, ține cablul HDMI/PoE în mână și folosește-l întâi pe endpoint, apoi pe XVR.
          4. Click dreapta cu mâna goală pe XVR pentru pornire/oprire.
          5. Click dreapta pe monitorul conectat deschide consola. `Shift` + click dreapta pe monitor/cameră deconectează acel cablu; `Shift` + click dreapta pe XVR elimină toate conexiunile.
          
          ## Build local
          
          Cu JDK 17 și Gradle 8.1.1 instalate:
          
          ```bash
          python3 scripts/generate_textures.py
          gradle --no-daemon build
          ```
          
          JAR-ul compilat apare în `build/libs/`.
          
          ## Limitări actuale
          
          Consola este un HUD CRT interactiv generat de mod, nu un render-to-texture al perspectivei optice reale a camerei. Detecția de mișcare urmărește entități vii din zonă, iar filtrul Night/Thermal este o stilizare a interfeței, nu un shader optic/termic aplicat lumii. Geometria blocurilor este realizată din elemente de model Minecraft, nu din mesh-uri cilindrice importate. Workflow-ul compilează sursele pe runnerul GitHub; fără acces la rețea în mediul de authoring nu am putut executa aici un build Forge complet.
          __IMMERSIVE_FILE_0000__

          mkdir -p '.'
          cat > 'build.gradle' <<'__IMMERSIVE_FILE_0001__'
          plugins {
              id 'eclipse'
              id 'maven-publish'
              id 'net.minecraftforge.gradle' version '[6.0,6.2)'
          }
          
          version = '1.0.0'
          group = 'ro.immersivecctv'
          base {
              archivesName = 'immersivecctv'
          }
          
          java.toolchain.languageVersion = JavaLanguageVersion.of(17)
          
          minecraft {
              mappings channel: 'official', version: '1.20.1'
              copyIdeResources = true
          
              runs {
                  configureEach {
                      workingDirectory project.file('run')
                      property 'forge.logging.console.level', 'info'
                      mods {
                          immersivecctv {
                              source sourceSets.main
                          }
                      }
                  }
                  client {}
                  server { args '--nogui' }
                  gameTestServer {}
                  data {
                      workingDirectory project.file('run-data')
                      args '--mod', 'immersivecctv', '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
                  }
              }
          }
          
          sourceSets.main.resources { srcDir 'src/generated/resources' }
          
          repositories {
              mavenCentral()
          }
          
          dependencies {
              minecraft 'net.minecraftforge:forge:1.20.1-47.2.0'
          }
          
          processResources {
              inputs.property 'version', project.version
              filesMatching(['META-INF/mods.toml']) {
                  expand 'file': [jarVersion: project.version]
              }
          }
          
          jar {
              manifest {
                  attributes([
                          'Specification-Title': 'immersivecctv',
                          'Specification-Vendor': 'ImmersiveCCTV',
                          'Specification-Version': '1',
                          'Implementation-Title': project.name,
                          'Implementation-Version': project.version,
                          'Implementation-Vendor': 'ImmersiveCCTV'
                  ])
              }
              finalizedBy 'reobfJar'
          }
          
          tasks.withType(JavaCompile).configureEach {
              options.encoding = 'UTF-8'
          }
          __IMMERSIVE_FILE_0001__

          mkdir -p '.'
          cat > 'gradle.properties' <<'__IMMERSIVE_FILE_0002__'
          org.gradle.jvmargs=-Xmx3G
          org.gradle.daemon=false
          __IMMERSIVE_FILE_0002__

          mkdir -p 'scripts'
          cat > 'scripts/generate_textures.py' <<'__IMMERSIVE_FILE_0003__'
          #!/usr/bin/env python3
          """Generate the mod's 64x64 RGBA textures with Python's standard library only."""
          from pathlib import Path
          import random, struct, zlib
          
          ROOT = Path(__file__).resolve().parents[1] / 'src/main/resources/assets/immersivecctv/textures'
          BLOCK = ROOT / 'block'; ITEM = ROOT / 'item'
          BLOCK.mkdir(parents=True, exist_ok=True); ITEM.mkdir(parents=True, exist_ok=True)
          W = H = 64
          
          class Canvas:
              def __init__(self, color=(0,0,0,255), seed=1):
                  self.p = bytearray(color * (W*H)); self.r = random.Random(seed)
              def rect(self, x1,y1,x2,y2,c):
                  for y in range(max(0,y1),min(H,y2)):
                      for x in range(max(0,x1),min(W,x2)):
                          i=(y*W+x)*4; self.p[i:i+4]=bytes(c)
              def line(self,x1,y1,x2,y2,c):
                  dx=abs(x2-x1); sx=1 if x1<x2 else -1; dy=-abs(y2-y1); sy=1 if y1<y2 else -1; err=dx+dy
                  while True:
                      if 0<=x1<W and 0<=y1<H:
                          i=(y1*W+x1)*4; self.p[i:i+4]=bytes(c)
                      if x1==x2 and y1==y2: break
                      e2=2*err
                      if e2>=dy: err+=dy; x1+=sx
                      if e2<=dx: err+=dx; y1+=sy
              def noise(self, amount=6):
                  for y in range(H):
                      for x in range(W):
                          i=(y*W+x)*4
                          n=self.r.randint(-amount,amount)
                          for k in range(3): self.p[i+k]=max(0,min(255,self.p[i+k]+n))
              def save(self,path):
                  raw=b''.join(b'\x00'+self.p[y*W*4:(y+1)*W*4] for y in range(H))
                  def chunk(t,d): return struct.pack('>I',len(d))+t+d+struct.pack('>I',zlib.crc32(t+d)&0xffffffff)
                  data=b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('>2I5B',W,H,8,6,0,0,0))+chunk(b'IDAT',zlib.compress(raw,9))+chunk(b'IEND',b'')
                  path.write_bytes(data)
          
          # Fine brushed metal: anisotropic horizontal grain, tiny highlights.
          c=Canvas((92,101,110,255),12)
          for y in range(64):
              shade=c.r.randint(-14,14)
              c.line(0,y,63,y,(max(0,92+shade),max(0,101+shade),max(0,110+shade),255))
              if y%7==0: c.line(0,y,63,y,(125,133,141,255))
          c.noise(3); c.save(BLOCK/'brushed_steel.png')
          
          # Dark vent grille.
          c=Canvas((24,29,34,255),2)
          for x in range(5,64,7):
              c.rect(x,5,x+3,59,(7,10,13,255)); c.line(x,5,x,59,(51,58,65,255))
          c.save(BLOCK/'vents.png')
          
          # Rubber feet.
          c=Canvas((27,29,31,255),3)
          for _ in range(160):
              x=c.r.randrange(64); y=c.r.randrange(64); v=c.r.randrange(20,45); c.rect(x,y,x+1,y+1,(v,v,v,255))
          c.save(BLOCK/'rubber.png')
          
          # Frontal XVR: 8 distinct RJ45 ports with copper contacts and LEDs.
          def make_front(on):
              c=Canvas((20,25,30,255),77 if on else 78)
              c.rect(0,0,64,7,(38,45,52,255)); c.line(0,7,63,7,(92,101,109,255))
              # Eight recessed Ethernet jacks.
              for i in range(8):
                  x=2+i*7
                  c.rect(x,13,x+6,32,(5,8,11,255)); c.rect(x+1,14,x+5,26,(21,28,32,255))
                  c.rect(x+1,26,x+5,29,(119,78,34,255))
                  for pin in range(4): c.rect(x+1+pin,26,x+2+pin,29,(224,170,72,255))
                  c.rect(x+1,10,x+2,12,(72,220,115,255) if on else (35,44,38,255))
                  c.rect(x+4,10,x+5,12,(250,157,40,255) if on else (56,42,27,255))
              # USB sockets and hard power switch.
              c.rect(4,39,16,51,(4,5,6,255)); c.rect(6,41,14,47,(105,117,124,255)); c.rect(6,48,14,49,(28,35,40,255))
              c.rect(20,39,32,51,(4,5,6,255)); c.rect(22,41,30,47,(126,137,143,255)); c.rect(22,48,30,49,(28,35,40,255))
              c.rect(45,36,61,55,(7,10,12,255)); c.rect(47,38,59,53,(62,69,74,255)); c.rect(49,40,57,51,(26,32,37,255))
              c.rect(51,42,55,49,(58,211,111,255) if on else (54,24,24,255))
              c.line(0,61,63,61,(75,84,92,255)); c.noise(2)
              return c
          make_front(True).save(BLOCK/'xvr_front_on.png')
          make_front(False).save(BLOCK/'xvr_front_off.png')
          
          # Monitor bezel and anti-reflective blue glass.
          c=Canvas((9,12,16,255),9); c.rect(1,1,62,62,(18,23,28,255)); c.rect(3,3,60,60,(3,6,10,255)); c.line(4,4,59,4,(68,79,88,255)); c.save(BLOCK/'monitor_bezel.png')
          c=Canvas((5,17,26,255),10)
          for y in range(64):
              base=max(0,24-int(y*.25)); c.line(0,y,63,y,(3,base,base+9,255))
          c.line(5,6,53,2,(23,65,81,180)); c.line(9,12,58,8,(14,45,58,170)); c.rect(4,4,60,5,(32,75,88,255)); c.save(BLOCK/'monitor_glass.png')
          
          # Matte camera barrel and rubberised visor.
          c=Canvas((38,45,51,255),11); c.noise(8); c.rect(0,0,63,5,(68,78,85,255)); c.rect(0,58,63,63,(18,22,25,255));
          for y in (12,18,24,30,36,42,48): c.line(4,y,59,y,(21,26,30,255))
          c.save(BLOCK/'camera_body.png')
          c=Canvas((8,15,23,255),13); c.rect(0,0,63,63,(10,17,25,255));
          for k in range(28):
              x=32+int(26*__import__('math').cos(k*6.283/28)); y=32+int(26*__import__('math').sin(k*6.283/28)); c.rect(x-1,y-1,x+2,y+2,(160,47,29,255))
          for rad,col in ((23,(130,42,28,255)),(18,(38,92,130,255)),(13,(12,33,52,255)),(8,(38,112,154,255)),(4,(3,8,14,255))):
              for y in range(64):
                  for x in range(64):
                      if (x-31.5)**2+(y-31.5)**2 <= rad*rad:
                          i=(y*64+x)*4; c.p[i:i+4]=bytes(col)
          c.line(15,14,26,10,(180,226,255,255)); c.line(17,16,29,12,(85,172,220,255)); c.save(BLOCK/'camera_lens.png')
          c=Canvas((56,64,69,255),14); c.noise(4); c.rect(4,4,60,60,(75,83,87,255)); c.rect(9,9,55,55,(46,53,58,255)); c.rect(13,13,51,51,(82,90,95,255));
          for x,y in ((7,7),(57,7),(7,57),(57,57)):
              c.rect(x-2,y-2,x+2,y+2,(10,13,15,255)); c.rect(x-1,y-1,x+1,y+1,(162,171,176,255))
          c.save(BLOCK/'camera_mount.png')
          
          # Inventory thumbnails are transparent and intentionally legible at 16px.
          c=Canvas((0,0,0,0),21); c.rect(7,7,57,57,(21,25,30,255)); c.rect(4,11,16,53,(184,190,194,255)); c.rect(48,11,60,53,(184,190,194,255)); c.rect(9,9,55,55,(9,13,18,255)); c.rect(11,11,53,53,(31,38,44,255)); c.line(15,16,48,16,(215,175,75,255)); c.save(ITEM/'hdmi_cable.png')
          c=Canvas((0,0,0,0),22); c.rect(20,8,44,56,(13,71,119,255)); c.rect(23,7,41,12,(35,145,213,255)); c.rect(23,52,41,57,(35,145,213,255)); c.rect(24,12,40,20,(89,189,231,255));
          for x in range(25,40,3): c.rect(x,15,x+1,19,(226,190,91,255))
          c.line(27,22,27,48,(83,179,229,255)); c.line(37,22,37,48,(83,179,229,255)); c.save(ITEM/'poe_cat6_cable.png')
          print('Generated 64x64 textures in', ROOT)
          __IMMERSIVE_FILE_0003__

          mkdir -p '.'
          cat > 'settings.gradle' <<'__IMMERSIVE_FILE_0004__'
          pluginManagement {
              repositories {
                  gradlePluginPortal()
                  maven { url = 'https://maven.minecraftforge.net/' }
                  mavenCentral()
              }
          }
          rootProject.name = 'immersive-cctv'
          __IMMERSIVE_FILE_0004__

          mkdir -p 'src/main/java/ro/immersivecctv'
          cat > 'src/main/java/ro/immersivecctv/ImmersiveCCTV.java' <<'__IMMERSIVE_FILE_0005__'
          package ro.immersivecctv;
          
          import net.minecraft.core.registries.Registries;
          import net.minecraft.network.chat.Component;
          import net.minecraft.world.item.BlockItem;
          import net.minecraft.world.item.CreativeModeTab;
          import net.minecraft.world.item.ItemStack;
          import net.minecraft.world.item.Item;
          import net.minecraft.world.level.block.Block;
          import net.minecraft.world.level.block.SoundType;
          import net.minecraft.world.level.block.state.BlockBehaviour;
          import net.minecraft.world.level.material.MapColor;
          import net.minecraftforge.eventbus.api.IEventBus;
          import net.minecraftforge.fml.common.Mod;
          import net.minecraftforge.fml.javafmlmod.FMLJavaModLoadingContext;
          import net.minecraftforge.registries.DeferredRegister;
          import net.minecraftforge.registries.ForgeRegistries;
          import net.minecraftforge.registries.RegistryObject;
          import net.minecraft.world.level.block.entity.BlockEntityType;
          import ro.immersivecctv.block.CameraBlock;
          import ro.immersivecctv.block.MonitorBlock;
          import ro.immersivecctv.block.XvrBlock;
          import ro.immersivecctv.blockentity.CameraBlockEntity;
          import ro.immersivecctv.blockentity.MonitorBlockEntity;
          import ro.immersivecctv.blockentity.XvrBlockEntity;
          import ro.immersivecctv.item.CctvCableItem;
          
          @Mod(ImmersiveCCTV.MODID)
          public final class ImmersiveCCTV {
              public static final String MODID = "immersivecctv";
          
              public static final DeferredRegister<Block> BLOCKS = DeferredRegister.create(ForgeRegistries.BLOCKS, MODID);
              public static final DeferredRegister<Item> ITEMS = DeferredRegister.create(ForgeRegistries.ITEMS, MODID);
              public static final DeferredRegister<BlockEntityType<?>> BLOCK_ENTITIES = DeferredRegister.create(ForgeRegistries.BLOCK_ENTITY_TYPES, MODID);
              public static final DeferredRegister<CreativeModeTab> TABS = DeferredRegister.create(Registries.CREATIVE_MODE_TAB, MODID);
          
              public static final RegistryObject<Block> XVR = BLOCKS.register("xvr", () -> new XvrBlock(
                      BlockBehaviour.Properties.of().mapColor(MapColor.METAL).strength(3.5F).sound(SoundType.METAL).noOcclusion()));
              public static final RegistryObject<Block> MONITOR = BLOCKS.register("monitor", () -> new MonitorBlock(
                      BlockBehaviour.Properties.of().mapColor(MapColor.COLOR_BLACK).strength(2.5F).sound(SoundType.METAL).noOcclusion()));
              public static final RegistryObject<Block> CAMERA = BLOCKS.register("camera", () -> new CameraBlock(
                      BlockBehaviour.Properties.of().mapColor(MapColor.METAL).strength(2.0F).sound(SoundType.METAL).noOcclusion()));
          
              public static final RegistryObject<Item> HDMI_CABLE = ITEMS.register("hdmi_cable",
                      () -> new CctvCableItem(CctvCableItem.Kind.HDMI, new Item.Properties().stacksTo(1)));
              public static final RegistryObject<Item> POE_CABLE = ITEMS.register("poe_cat6_cable",
                      () -> new CctvCableItem(CctvCableItem.Kind.POE, new Item.Properties().stacksTo(1)));
          
              public static final RegistryObject<Item> XVR_ITEM = ITEMS.register("xvr", () -> new BlockItem(XVR.get(), new Item.Properties()));
              public static final RegistryObject<Item> MONITOR_ITEM = ITEMS.register("monitor", () -> new BlockItem(MONITOR.get(), new Item.Properties()));
              public static final RegistryObject<Item> CAMERA_ITEM = ITEMS.register("camera", () -> new BlockItem(CAMERA.get(), new Item.Properties()));
          
              public static final RegistryObject<BlockEntityType<XvrBlockEntity>> XVR_BE = BLOCK_ENTITIES.register("xvr",
                      () -> BlockEntityType.Builder.of(XvrBlockEntity::new, XVR.get()).build(null));
              public static final RegistryObject<BlockEntityType<MonitorBlockEntity>> MONITOR_BE = BLOCK_ENTITIES.register("monitor",
                      () -> BlockEntityType.Builder.of(MonitorBlockEntity::new, MONITOR.get()).build(null));
              public static final RegistryObject<BlockEntityType<CameraBlockEntity>> CAMERA_BE = BLOCK_ENTITIES.register("camera",
                      () -> BlockEntityType.Builder.of(CameraBlockEntity::new, CAMERA.get()).build(null));
          
              public static final RegistryObject<CreativeModeTab> CCTV_TAB = TABS.register("main", () -> CreativeModeTab.builder()
                      .title(Component.literal("Immersive CCTV"))
                      .icon(() -> new ItemStack(XVR_ITEM.get()))
                      .displayItems((parameters, output) -> {
                          output.accept(XVR_ITEM.get());
                          output.accept(MONITOR_ITEM.get());
                          output.accept(CAMERA_ITEM.get());
                          output.accept(HDMI_CABLE.get());
                          output.accept(POE_CABLE.get());
                      }).build());
          
              public ImmersiveCCTV() {
                  IEventBus bus = FMLJavaModLoadingContext.get().getModEventBus();
                  BLOCKS.register(bus);
                  ITEMS.register(bus);
                  BLOCK_ENTITIES.register(bus);
                  TABS.register(bus);
              }
          }
          __IMMERSIVE_FILE_0005__

          mkdir -p 'src/main/java/ro/immersivecctv'
          cat > 'src/main/java/ro/immersivecctv/LinkingManager.java' <<'__IMMERSIVE_FILE_0006__'
          package ro.immersivecctv;
          
          import java.util.Map;
          import java.util.UUID;
          import java.util.concurrent.ConcurrentHashMap;
          import net.minecraft.core.BlockPos;
          import net.minecraft.network.chat.Component;
          import net.minecraft.world.entity.player.Player;
          import net.minecraft.world.level.Level;
          import net.minecraft.world.level.block.entity.BlockEntity;
          import ro.immersivecctv.blockentity.CameraBlockEntity;
          import ro.immersivecctv.blockentity.MonitorBlockEntity;
          import ro.immersivecctv.blockentity.XvrBlockEntity;
          
          public final class LinkingManager {
              public enum Endpoint { MONITOR, CAMERA }
              private record Pending(Endpoint endpoint, BlockPos pos) {}
              private static final Map<UUID, Pending> PENDING = new ConcurrentHashMap<>();
          
              private LinkingManager() {}
          
              public static void select(Player player, Endpoint endpoint, BlockPos pos) {
                  PENDING.put(player.getUUID(), new Pending(endpoint, pos.immutable()));
                  player.displayClientMessage(Component.literal(endpoint == Endpoint.MONITOR
                          ? "[CCTV] Monitor selectat. Click pe XVR pentru a conecta HDMI."
                          : "[CCTV] Camera selectată. Click pe XVR pentru a conecta PoE."), true);
              }
          
              public static boolean hasPending(Player player) { return PENDING.containsKey(player.getUUID()); }
          
              public static boolean completePending(Player player, Level level, BlockPos xvrPos) {
                  Pending pending = PENDING.remove(player.getUUID());
                  if (pending == null) return false;
                  BlockEntity be = level.getBlockEntity(xvrPos);
                  if (!(be instanceof XvrBlockEntity xvr)) return false;
          
                  if (pending.endpoint() == Endpoint.MONITOR) {
                      BlockEntity endpoint = level.getBlockEntity(pending.pos());
                      if (!(endpoint instanceof MonitorBlockEntity monitor)) {
                          player.displayClientMessage(Component.literal("[CCTV] Monitorul selectat nu mai există."), true);
                          return true;
                      }
                      BlockPos oldXvrPos = monitor.getXvrPos();
                      if (oldXvrPos != null && level.getBlockEntity(oldXvrPos) instanceof XvrBlockEntity oldXvr && !oldXvrPos.equals(xvrPos)) {
                          oldXvr.setMonitorPos(null);
                      }
                      BlockPos oldMonitorPos = xvr.getMonitorPos();
                      if (oldMonitorPos != null && level.getBlockEntity(oldMonitorPos) instanceof MonitorBlockEntity oldMonitor && !oldMonitorPos.equals(pending.pos())) {
                          oldMonitor.setXvrPos(null);
                      }
                      xvr.setMonitorPos(pending.pos());
                      monitor.setXvrPos(xvrPos);
                      player.displayClientMessage(Component.literal("[CCTV] HDMI conectat fizic: Monitor ↔ XVR."), true);
                      return true;
                  }
          
                  BlockEntity endpoint = level.getBlockEntity(pending.pos());
                  if (!(endpoint instanceof CameraBlockEntity camera)) {
                      player.displayClientMessage(Component.literal("[CCTV] Camera selectată nu mai există."), true);
                      return true;
                  }
                  BlockPos oldXvrPos = camera.getXvrPos();
                  if (oldXvrPos != null && level.getBlockEntity(oldXvrPos) instanceof XvrBlockEntity oldXvr) {
                      oldXvr.removeCamera(pending.pos());
                  }
                  xvr.addCamera(pending.pos());
                  camera.setXvrPos(xvrPos);
                  player.displayClientMessage(Component.literal("[CCTV] Ethernet PoE Cat6 conectat. Camera este legată de XVR."), true);
                  return true;
              }
          
              public static void disconnectMonitor(Player player, Level level, BlockPos pos) {
                  if (level.getBlockEntity(pos) instanceof MonitorBlockEntity monitor) {
                      BlockPos xvrPos = monitor.getXvrPos();
                      if (xvrPos != null && level.getBlockEntity(xvrPos) instanceof XvrBlockEntity xvr) xvr.setMonitorPos(null);
                      monitor.setXvrPos(null);
                      player.displayClientMessage(Component.literal("[CCTV] Cablul HDMI a fost deconectat."), true);
                  }
              }
          
              public static void disconnectCamera(Player player, Level level, BlockPos pos) {
                  if (level.getBlockEntity(pos) instanceof CameraBlockEntity camera) {
                      BlockPos xvrPos = camera.getXvrPos();
                      if (xvrPos != null && level.getBlockEntity(xvrPos) instanceof XvrBlockEntity xvr) xvr.removeCamera(pos);
                      camera.setXvrPos(null);
                      player.displayClientMessage(Component.literal("[CCTV] Cablul PoE a fost deconectat."), true);
                  }
              }
          
              public static void disconnectAll(Player player, Level level, BlockPos pos) {
                  if (!(level.getBlockEntity(pos) instanceof XvrBlockEntity xvr)) return;
                  BlockPos monitorPos = xvr.getMonitorPos();
                  if (monitorPos != null && level.getBlockEntity(monitorPos) instanceof MonitorBlockEntity monitor) monitor.setXvrPos(null);
                  xvr.setMonitorPos(null);
