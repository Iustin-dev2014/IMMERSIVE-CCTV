name: Laptop Stress Lab - CPU RAM Disk Benchmark

on:
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: "Stress duration in seconds (30-180)"
        required: true
        type: number
        default: 60
      cpu_workers:
        description: "CPU workers (0 = automatic, up to logical CPU count)"
        required: true
        type: number
        default: 0
      memory_mb:
        description: "Requested memory workload in MB (capped for safety)"
        required: true
        type: number
        default: 512

permissions:
  contents: read

jobs:
  stress-test:
    name: Bounded CPU, memory and disk benchmark
    runs-on: [self-hosted, windows]
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run bounded laptop benchmark
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $duration = [Math]::Max(30, [Math]::Min(180, [int]'${{ inputs.duration_seconds }}'))
          $logicalCpus = [Environment]::ProcessorCount
          $requestedWorkers = [int]'${{ inputs.cpu_workers }}'
          if ($requestedWorkers -le 0) { $workers = $logicalCpus } else { $workers = [Math]::Max(1, [Math]::Min($logicalCpus, $requestedWorkers)) }

          $os = Get-CimInstance Win32_OperatingSystem
          $totalRamMB = [Math]::Floor($os.TotalVisibleMemorySize / 1024)
          $freeRamMB = [Math]::Floor($os.FreePhysicalMemory / 1024)
          $requestedMemory = [Math]::Max(128, [Math]::Min(1024, [int]'${{ inputs.memory_mb }}'))
          $memoryCap = [Math]::Max(128, [Math]::Min(1024, [Math]::Floor($totalRamMB * 0.20)))
          $memoryTarget = [Math]::Min($requestedMemory, $memoryCap)
          $memoryTarget = [Math]::Min($memoryTarget, [Math]::Max(128, $freeRamMB - 1024))
          $memoryTarget = [Math]::Max(64, $memoryTarget)

          $start = Get-Date
          $cpuJobs = @()
          $cpuScript = {
            param($seconds)
            $clock = [Diagnostics.Stopwatch]::StartNew()
            [long]$iterations = 0
            [double]$value = 0.12345
            while ($clock.Elapsed.TotalSeconds -lt $seconds) {
              for ($j = 1; $j -le 5000; $j++) {
                $value = [Math]::Sqrt([Math]::Abs($value) + $j) * 0.999999
                $iterations++
              }
            }
            [pscustomobject]@{ Iterations = $iterations; FinalValue = $value }
          }

          Write-Host "Starting bounded CPU load: $workers worker(s), $duration seconds."
          for ($i = 0; $i -lt $workers; $i++) { $cpuJobs += Start-Job -ScriptBlock $cpuScript -ArgumentList $duration }

          $memoryWatch = [Diagnostics.Stopwatch]::StartNew()
          $buffers = New-Object 'System.Collections.Generic.List[byte[]]'
          $allocatedMB = 0
          try {
            while ($allocatedMB + 16 -le $memoryTarget) {
              $buffers.Add((New-Object byte[] (16MB)))
              $allocatedMB += 16
            }
            if ($allocatedMB -lt $memoryTarget) {
              $remainingBytes = [int](($memoryTarget - $allocatedMB) * 1MB)
              if ($remainingBytes -gt 0) { $buffers.Add((New-Object byte[] $remainingBytes)); $allocatedMB += [Math]::Floor($remainingBytes / 1MB) }
            }
            foreach ($buffer in $buffers) { for ($i = 0; $i -lt $buffer.Length; $i += 4096) { $buffer[$i] = [byte](($i + $buffer.Length) % 251) } }
          } catch {
            Write-Warning ("Memory allocation stopped safely: " + $_.Exception.Message)
          }
          $memoryWatch.Stop()
          Write-Host "Memory workload touched approximately $allocatedMB MB in $($memoryWatch.Elapsed.TotalSeconds.ToString('F2')) seconds."

          $diskPath = Join-Path $env:RUNNER_TEMP 'laptop-stress-lab.tmp'
          $diskBytes = 64MB
          $diskWriteWatch = [Diagnostics.Stopwatch]::StartNew()
          $chunk = New-Object byte[] (1MB)
          (New-Object Random).NextBytes($chunk)
          $stream = [IO.File]::Open($diskPath, [IO.FileMode]::Create, [IO.FileAccess]::Write, [IO.FileShare]::None)
          try { for ($i = 0; $i -lt 64; $i++) { $stream.Write($chunk, 0, $chunk.Length) }; $stream.Flush() } finally { $stream.Dispose() }
          $diskWriteWatch.Stop()
          $diskReadWatch = [Diagnostics.Stopwatch]::StartNew()
          $readBuffer = New-Object byte[] (1MB)
          $readBytes = 0L
          $stream = [IO.File]::OpenRead($diskPath)
          try { while (($n = $stream.Read($readBuffer, 0, $readBuffer.Length)) -gt 0) { $readBytes += $n } } finally { $stream.Dispose() }
          $diskReadWatch.Stop()
          Remove-Item -LiteralPath $diskPath -Force -ErrorAction SilentlyContinue

          $cpuResults = @()
          foreach ($job in $cpuJobs) {
            if ($job.State -eq 'Running') { Wait-Job $job -Timeout ($duration + 15) | Out-Null }
            $cpuResults += @(Receive-Job $job -ErrorAction SilentlyContinue)
            if ($job.State -eq 'Running') { Stop-Job $job -ErrorAction SilentlyContinue }
            Remove-Job $job -Force -ErrorAction SilentlyContinue
          }
          $iterationsTotal = 0L
          foreach ($r in $cpuResults) { if ($null -ne $r.Iterations) { $iterationsTotal += [long]$r.Iterations } }
          $cpuElapsed = [Math]::Max(1, ((Get-Date) - $start).TotalSeconds)
          $finalOs = Get-CimInstance Win32_OperatingSystem
          $finalFreeMB = [Math]::Floor($finalOs.FreePhysicalMemory / 1024)
          $writeMBps = [Math]::Round(($diskBytes / 1MB) / [Math]::Max(0.001, $diskWriteWatch.Elapsed.TotalSeconds), 1)
          $readMBps = [Math]::Round(($readBytes / 1MB) / [Math]::Max(0.001, $diskReadWatch.Elapsed.TotalSeconds), 1)
          $cpuScore = [Math]::Round($iterationsTotal / $cpuElapsed)
          $reportTime = Get-Date -Format 'yyyy-MM-dd HH:mm:ss K'
          $repo = '${{ github.repository }}'
          $html = @"
          <!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Laptop Stress Lab Report</title><style>
          :root{color-scheme:dark;--bg:#080b12;--panel:#141b29;--line:#303d54;--text:#f0f5ff;--muted:#a7b4ca;--cyan:#6fffe9;--orange:#ffb86b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top right,#27365a,transparent 45%),var(--bg);color:var(--text);font:16px/1.5 system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:24px 16px 48px}.hero,.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:14px}.hero{padding:32px;background:linear-gradient(130deg,#182b43,#17182a)}.tag{color:var(--cyan);font-size:12px;font-weight:800;letter-spacing:.15em}.hero h1{font-size:clamp(36px,7vw,64px);line-height:1;margin:14px 0}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.metric{font-size:32px;color:var(--cyan);font-weight:800;overflow-wrap:anywhere}.label{color:var(--muted)}.warning{border-color:#8a5b2d}.warning h2{color:var(--orange)}h2{margin-top:0}footer{color:var(--muted);text-align:center;font-size:12px;margin-top:22px}code{overflow-wrap:anywhere}@media(max-width:600px){.hero{padding:22px}.card{padding:17px}}</style></head><body><main>
          <section class="hero"><div class="tag">HARDWARE BENCHMARK / SELF-HOSTED WINDOWS</div><h1>Laptop<br>Stress Lab</h1><p>Bounded CPU, RAM-touch and temporary-disk benchmark. This is a workload snapshot, not a certified hardware rating.</p><p><b>$repo</b></p></section>
          <section class="grid">
          <div class="card"><div class="label">CPU workers</div><div class="metric">$workers / $logicalCpus</div><p class="muted">Iterations per second: $cpuScore</p></div>
          <div class="card"><div class="label">CPU workload window</div><div class="metric">$duration s</div><p class="muted">Total benchmark elapsed: $([Math]::Round($cpuElapsed,1)) s</p></div>
          <div class="card"><div class="label">RAM touched</div><div class="metric">$allocatedMB MB</div><p class="muted">System RAM: $totalRamMB MB · free after test: $finalFreeMB MB</p></div>
          <div class="card"><div class="label">Disk write</div><div class="metric">$writeMBps MB/s</div><p class="muted">Temporary 64 MB file</p></div>
          <div class="card"><div class="label">Disk read</div><div class="metric">$readMBps MB/s</div><p class="muted">Sequential read throughput</p></div>
          <div class="card"><div class="label">CPU math iterations</div><div class="metric">$iterationsTotal</div><p class="muted">Higher is better only when comparing similar machines and settings.</p></div>
          </section>
          <section class="card warning"><h2>⚠️ Safe-use notes</h2><ul><li>CPU load is capped at 180 seconds and the workflow has an 8-minute timeout.</li><li>Memory target is capped at 1 GB and 20% of detected physical RAM, with a reserve for Windows.</li><li>Disk test uses a temporary 64 MB file and deletes it after the read test.</li><li>Keep the laptop ventilated and plugged in. Stop the run if temperatures, fan noise or system responsiveness become concerning.</li><li>This benchmark does not deliberately stress the GPU or run indefinitely.</li></ul></section>
          <section class="card"><h2>Run details</h2><p>Generated: $reportTime</p><p>Requested memory: $requestedMemory MB · applied cap: $memoryCap MB</p><p>Disk write time: $([Math]::Round($diskWriteWatch.Elapsed.TotalSeconds,3)) s · read time: $([Math]::Round($diskReadWatch.Elapsed.TotalSeconds,3)) s</p><p>Runner: $env:COMPUTERNAME · PowerShell $($PSVersionTable.PSVersion)</p></section>
          <footer>Laptop Stress Lab · generated locally by GitHub Actions · temporary test file removed</footer></main></body></html>
          "@
          $reportPath = Join-Path $env:GITHUB_WORKSPACE 'laptop-stress-lab-report.html'
          Set-Content -LiteralPath $reportPath -Value $html -Encoding UTF8
          $buffers.Clear()
          [GC]::Collect()
          Write-Host "Benchmark finished. CPU iterations=$iterationsTotal; RAM touched=$allocatedMB MB; disk write=$writeMBps MB/s; disk read=$readMBps MB/s."
          Write-Host "HTML report: $reportPath"

      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: laptop-stress-lab-report
          path: laptop-stress-lab-report.html
          if-no-files-found: error
          retention-days: 30
