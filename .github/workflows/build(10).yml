          root = pathlib.Path(os.environ["PROJECT_DIR"])
          with tarfile.open(fileobj=io.BytesIO(payload), mode="r:gz") as archive:
              archive.extractall(path=root, filter="data")
          required = [
              root / "build.gradle",
              root / "src/main/java/ro/immersivecctv/client/CameraViewController.java",
              root / "src/main/java/ro/immersivecctv/client/ClientHooks.java",
              root / "src/main/java/ro/immersivecctv/client/XvrScreen.java",
              root / "src/main/java/ro/immersivecctv/blockentity/CameraBlockEntity.java",
              root / "src/main/java/ro/immersivecctv/blockentity/XvrBlockEntity.java",
              root / "src/main/resources/data/immersivecctv/recipes/ptz_camera.json",
              root / "src/main/resources/data/immersivecctv/advancements/ptz_camera.json",
              root / "scripts/validate_release.py",
          ]
          missing = [str(path.relative_to(root)) for path in required if not path.is_file()]
          if missing:
              raise SystemExit("Embedded source archive incomplete: " + ", ".join(missing))
          print(f"Restored {sum(1 for p in root.rglob('*') if p.is_file())} project files from {len(payload):,} bytes of embedded source.")
          PYBOOTSTRAP

      - name: Generate textures and sounds from the embedded source
        working-directory: immersive-cctv-source
        run: |
          python scripts/generate_textures.py
          python scripts/generate_sounds.py

      - name: Validate resources, recipes, advancements and implementation hooks
        working-directory: immersive-cctv-source
        run: |
          python scripts/validate_resources.py
          python scripts/validate_release.py

      - name: Build the embedded source tree (not the old repository source)
        working-directory: immersive-cctv-source
        run: gradle --no-daemon --stacktrace clean build

      - name: Verify the exact contents of the compiled mod JAR
        working-directory: immersive-cctv-source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob, os, zipfile
          jars = [p for p in glob.glob("build/libs/*.jar") if "sources" not in p.lower() and "dev" not in p.lower()]
          if not jars:
              raise SystemExit("Gradle succeeded but no distributable mod JAR was found.")
          jar = sorted(jars)[0]
          with zipfile.ZipFile(jar) as archive:
              entries = set(archive.namelist())
              required = [
                  "META-INF/mods.toml",
                  "ro/immersivecctv/client/CameraViewController.class",
                  "ro/immersivecctv/client/ClientHooks.class",
                  "ro/immersivecctv/client/XvrScreen.class",
                  "ro/immersivecctv/blockentity/CameraBlockEntity.class",
                  "ro/immersivecctv/blockentity/XvrBlockEntity.class",
                  "ro/immersivecctv/item/CctvServiceTool.class",
                  "data/immersivecctv/recipes/xvr.json",
                  "data/immersivecctv/recipes/ptz_camera.json",
                  "data/immersivecctv/recipes/power_outlet.json",
                  "data/immersivecctv/recipes/cctv_service_tool.json",
                  "data/immersivecctv/advancements/root.json",
                  "data/immersivecctv/advancements/ptz_camera.json",
              ]
              missing = [name for name in required if name not in entries]
              if missing:
                  raise SystemExit("Compiled JAR is missing required code/resources: " + ", ".join(missing))
              recipes = [name for name in entries if name.startswith("data/immersivecctv/recipes/") and name.endswith(".json")]
              advancements = [name for name in entries if name.startswith("data/immersivecctv/advancements/") and name.endswith(".json")]
              if len(recipes) < 10 or len(advancements) < 10:
                  raise SystemExit(f"JAR is incomplete: {len(recipes)} recipes, {len(advancements)} advancements")
          os.makedirs("dist", exist_ok=True)
          report = [
              "IMMERSIVE CCTV 1.4.0 — build validation report",
              f"Distributable JAR: {jar}",
              f"Recipes inside JAR: {len(recipes)}",
              f"Advancements inside JAR: {len(advancements)}",
              "Required renderer/authentication/service-tool classes and core datapack files: present",
              "Resource/implementation static validation: passed in earlier workflow step",
              "Important: this report verifies the build and packaged files, not a live Minecraft client session.",
          ]
          open("dist/RELEASE-VALIDATION.txt", "w", encoding="utf-8").write("\n".join(report) + "\n")
          print("\n".join(report))
          PY

      - name: Package the exact source used by this build
        working-directory: immersive-cctv-source
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          root = Path('.').resolve()
          output = root / 'dist' / 'ImmersiveCCTV-1.4.0-source.zip'
          output.parent.mkdir(parents=True, exist_ok=True)
          excluded = {'.gradle', 'build', 'run', 'run-data', '.git', '.idea'}
          with zipfile.ZipFile(output, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              for path in sorted(root.rglob('*')):
                  if not path.is_file():
                      continue
                  rel = path.relative_to(root)
                  if any(part in excluded for part in rel.parts) or rel.parts[0] == 'dist':
                      continue
                  info = zipfile.ZipInfo((Path('ImmersiveCCTV-1.4.0') / rel).as_posix(), date_time=(2024, 1, 1, 0, 0, 0))
                  info.compress_type = zipfile.ZIP_DEFLATED
                  z.writestr(info, path.read_bytes(), compress_type=zipfile.ZIP_DEFLATED, compresslevel=9)
          print(f'Created {output.name}: {output.stat().st_size:,} bytes')
          PY

      - name: Create SHA-256 checksums for the JAR and source ZIP
        working-directory: immersive-cctv-source
        shell: bash
        run: |
          set -euo pipefail
          (cd build/libs && sha256sum *.jar) > dist/SHA256SUMS.txt
          sha256sum dist/ImmersiveCCTV-1.4.0-source.zip >> dist/SHA256SUMS.txt
          cat dist/SHA256SUMS.txt

      - name: Upload distributable JAR, source ZIP and validation reports
        uses: actions/upload-artifact@v4
        with:
          name: IMMERSIVE-CCTV-1.4.0-Forge-1.20.1-Release-Candidate
          path: |
            immersive-cctv-source/build/libs/*.jar
            immersive-cctv-source/dist/ImmersiveCCTV-1.4.0-source.zip
            immersive-cctv-source/dist/RELEASE-VALIDATION.txt
            immersive-cctv-source/dist/SHA256SUMS.txt
          if-no-files-found: error
