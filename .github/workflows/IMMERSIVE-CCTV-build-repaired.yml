          """
          archive_bytes = base64.b64decode("".join(encoded.split()))
          root = pathlib.Path('.')
          with tarfile.open(fileobj=io.BytesIO(archive_bytes), mode='r:gz') as archive:
              for member in archive.getmembers():
                  relative = pathlib.PurePosixPath(member.name)
                  if relative.is_absolute() or '..' in relative.parts:
                      raise RuntimeError('Unsafe path in embedded project: ' + member.name)
                  if not member.isfile():
                      continue
                  destination = root.joinpath(*relative.parts)
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  source = archive.extractfile(member)
                  if source is None:
                      raise RuntimeError('Cannot extract embedded file: ' + member.name)
                  with source, destination.open('wb') as output:
                      output.write(source.read())
          print('Embedded project generated.')
          PYBOOTSTRAP

      - name: Fix unsupported renderer bounding-box override for Forge 1.20.1
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYFIX'
          from pathlib import Path
          import re

          path = Path('src/main/java/ro/immersivecctv/client/XvrCableRenderer.java')
          if not path.is_file():
              raise SystemExit(f'Nu există fișierul renderer așteptat: {path}')
          source = path.read_text(encoding='utf-8')
          pattern = re.compile(
              r'    @Override\n'
              r'    public AABB getRenderBoundingBox\(XvrBlockEntity be\) \{\n'
              r'.*?'
              r'    \}\n\n'
              r'    @Override\n'
              r'    public void render\(',
              re.DOTALL,
          )
          replacement = (
              '    @Override\n'
              '    public boolean shouldRenderOffScreen(XvrBlockEntity be) { return true; }\n\n'
              '    @Override\n'
              '    public int getViewDistance() { return 128; }\n\n'
              '    @Override\n'
              '    public void render('
          )
          if 'getRenderBoundingBox' in source:
              source, count = pattern.subn(replacement, source, count=1)
              if count != 1:
                  raise SystemExit('Am găsit getRenderBoundingBox, dar nu am putut aplica patch-ul sigur.')
              source = source.replace('import net.minecraft.world.phys.AABB;\n', '')
              path.write_text(source, encoding='utf-8')
              print('Reparat XvrCableRenderer: înlocuit getRenderBoundingBox cu metodele renderer compatibile.')
          elif 'shouldRenderOffScreen(XvrBlockEntity be)' in source and 'getViewDistance()' in source:
              print('Renderer-ul este deja reparat; nu sunt necesare modificări.')
          else:
              raise SystemExit('Structura renderer-ului nu corespunde versiunii așteptate; build oprit pentru a evita un patch greșit.')
          PYFIX

      - name: Generate textures and validate resources
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/generate_textures.py
          python3 - <<'PYVALIDATE'
          import json, pathlib, struct
          for path in pathlib.Path('src/main/resources').rglob('*.json'):
              json.loads(path.read_text(encoding='utf-8'))
          pngs = list(pathlib.Path('src/main/resources').rglob('*.png'))
          for path in pngs:
              data = path.read_bytes()
              if data[:8] != b'\x89PNG\r\n\x1a\n' or struct.unpack('>II', data[16:24]) != (64, 64):
                  raise SystemExit(f'Invalid/non-64x64 PNG: {path}')
          print(f'Validated JSON resources and {len(pngs)} 64x64 textures.')
          PYVALIDATE

      - name: Set up Gradle 8.1.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.1.1'

      - name: Compile and reobfuscate mod JAR
        run: gradle --no-daemon build

      - name: Assemble distributable ZIPs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          JAR_PATH="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' -print -quit)"
          if [[ -z "$JAR_PATH" ]]; then echo 'Build succeeded but no JAR was found in build/libs' >&2; exit 1; fi
          cp "$JAR_PATH" dist/ImmersiveCCTV-Forge-1.20.1.jar
          cat > dist/INSTALL.txt <<'INSTALL_EOF'
          Immersive CCTV 1.1.0 — Minecraft Forge 1.20.1

          Requires Minecraft Java Edition 1.20.1, Forge 47.2.0 and Java 17.
          Copy ImmersiveCCTV-Forge-1.20.1.jar into the game's mods folder.

          PHYSICAL CONNECTIONS:
          1. Hold the HDMI cable item. Click the small jack on the BACK of the monitor.
          2. Click the HDMI socket on the BACK of the XVR.
          3. Hold the blue PoE cable item. Click the socket on the BACK of the camera.
          4. Click one of the eight individual RJ45 sockets on the FRONT of the XVR.
          5. Use an empty hand and click the physical POWER button on the XVR front panel.
          6. Right-click the monitor with an empty hand to open the console. It requires a connected HDMI cable.
          7. Shift-right-click the monitor/camera to disconnect that cable, or the XVR to disconnect all.

          Camera feed note: the console builds a low-resolution view by raycasting the real world from the camera. It is a voxel preview rather than a full engine render-to-texture camera.
          INSTALL_EOF
          (cd dist && zip -j -q ImmersiveCCTV-Forge-1.20.1.zip ImmersiveCCTV-Forge-1.20.1.jar INSTALL.txt)
          zip -q -r dist/ImmersiveCCTV-Source.zip build.gradle settings.gradle gradle.properties src scripts README.md .github/workflows/build.yml
          echo 'Generated packages:'
          ls -lh dist/*.zip dist/*.jar

      - name: Upload JAR and source/distribution ZIPs
        uses: actions/upload-artifact@v4
        with:
          name: ImmersiveCCTV-Forge-1.20.1
          path: |
            dist/ImmersiveCCTV-Forge-1.20.1.zip
            dist/ImmersiveCCTV-Source.zip
            dist/ImmersiveCCTV-Forge-1.20.1.jar
          if-no-files-found: error
          retention-days: 14
