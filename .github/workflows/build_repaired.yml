          packed = base64.b64decode("".join(payload.split()), validate=True)
          raw = gzip.decompress(packed)
          target = pathlib.Path("project")
          target.mkdir(exist_ok=True)
          with tarfile.open(fileobj=io.BytesIO(raw), mode="r:") as archive:
              members = archive.getmembers()
              for member in members:
                  name = pathlib.PurePosixPath(member.name)
                  if name.is_absolute() or ".." in name.parts:
                      raise SystemExit(f"Unsafe source path in embedded archive: {member.name}")
              archive.extractall(target, filter="data")
          source = target / "ImmersiveCCTV-1.4.0"
          if not (source / "build.gradle").is_file():
              raise SystemExit("Embedded Gradle project did not restore correctly.")
          print(f"Restored {len(members)} embedded archive entries to {source}")
          PYTHON

      - name: Temporary source snapshot for targeted fixes
        uses: actions/upload-artifact@v4
        with:
          name: immersivecctv-source-snapshot
          path: project/ImmersiveCCTV-1.4.0/
          if-no-files-found: error
          retention-days: 1

      - name: Generate textures and sound assets
        working-directory: project/ImmersiveCCTV-1.4.0
        run: |
          python scripts/generate_textures.py
          python scripts/generate_sounds.py

      - name: Validate resources and required features
        working-directory: project/ImmersiveCCTV-1.4.0
        run: |
          python -m py_compile scripts/validate_resources.py scripts/validate_release.py
          python scripts/validate_resources.py
          python scripts/validate_release.py

      - name: Compile and package mod
        working-directory: project/ImmersiveCCTV-1.4.0
        run: gradle --no-daemon clean build

      - name: Verify built JAR contains router, fibre, cloud and CCTV features
        shell: bash
        run: |
          set -euo pipefail
          cd project/ImmersiveCCTV-1.4.0
          python3 - <<'PYTHON'
          import glob, zipfile
          jars = [p for p in glob.glob('build/libs/*.jar') if 'sources' not in p.lower()]
          if len(jars) != 1:
              raise SystemExit(f'Expected one distributable JAR, found: {jars}')
          jar = jars[0]
          required = [
              'ro/immersivecctv/client/CameraViewController.class',
              'ro/immersivecctv/client/CameraFallbackRenderer.class',
              'ro/immersivecctv/client/XvrScreen.class',
              'ro/immersivecctv/client/CloudRemoteLoginScreen.class',
              'ro/immersivecctv/block/RouterBlock.class',
              'ro/immersivecctv/block/InternetBlock.class',
              'ro/immersivecctv/blockentity/RouterBlockEntity.class',
              'ro/immersivecctv/blockentity/InternetBlockEntity.class',
              'ro/immersivecctv/blockentity/XvrBlockEntity.class',
              'ro/immersivecctv/item/NetworkCableItem.class',
              'ro/immersivecctv/item/FiberOpticCableItem.class',
              'ro/immersivecctv/item/CloudAccessRemoteItem.class',
              'ro/immersivecctv/item/CctvServiceTool.class',
              'data/immersivecctv/recipes/router.json',
              'data/immersivecctv/recipes/internet_block.json',
              'data/immersivecctv/recipes/cloud_access_remote.json',
              'META-INF/mods.toml',
          ]
          with zipfile.ZipFile(jar) as z:
              entries = set(z.namelist())
              missing = [name for name in required if name not in entries]
              if missing:
                  raise SystemExit('Built JAR missing required content: ' + ', '.join(missing))
              recipes = [n for n in entries if n.startswith('data/immersivecctv/recipes/') and n.endswith('.json')]
              advancements = [n for n in entries if n.startswith('data/immersivecctv/advancements/') and n.endswith('.json')]
              if len(recipes) < 15 or len(advancements) < 15:
                  raise SystemExit(f'Incomplete data resources: {len(recipes)} recipes, {len(advancements)} advancements')
          print(f'JAR verification passed: {jar}; router/fibre/cloud classes present; {len(recipes)} recipes; {len(advancements)} advancements.')
          PYTHON

      - name: Upload compiled mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: immersivecctv-beta4-forge-1.20.1
          path: project/ImmersiveCCTV-1.4.0/build/libs/immersivecctv-*.jar
          if-no-files-found: error
