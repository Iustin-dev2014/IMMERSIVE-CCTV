name: Build IMMERSIVE CCTV Beta 4 (Forge 1.20.1)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository (workflow host only)
        uses: actions/checkout@v4

      - name: Set up Java 17 (v5; no Gradle cache scan before embedded source restore)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Install FFmpeg for generated sound assets
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

