name: Temporary IMMERSIVE CCTV Project Audit

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "build.gradle"
      - "gradle.properties"
      - ".github/workflows/temporary-immersive-cctv-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    name: Inspect source, resources, and JSON assets
    runs-on: [self-hosted, windows]
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Audit project files
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $root = $env:GITHUB_WORKSPACE
          $reportPath = Join-Path $root "immersive-cctv-audit-report.md"
          $issues = New-Object System.Collections.Generic.List[string]
          $notes = New-Object System.Collections.Generic.List[string]

          $sourceRoot = Join-Path $root "src"
          $sourceFiles = @(Get-ChildItem -Path $sourceRoot -Recurse -File -ErrorAction SilentlyContinue)
          $javaFiles = @($sourceFiles | Where-Object { $_.Extension -eq ".java" })
          $jsonFiles = @($sourceFiles | Where-Object { $_.Extension -eq ".json" })
          $resourceFiles = @($sourceFiles | Where-Object { $_.FullName -match "[\\/]resources[\\/]" })
          $recipeFiles = @($sourceFiles | Where-Object { $_.FullName -match "[\\/]data[\\/].*[\\/]recipes[\\/].*\.json$" })
          $textureFiles = @($sourceFiles | Where-Object { $_.Extension -eq ".png" -and $_.FullName -match "[\\/]textures[\\/]" })
          $validJson = 0

          foreach ($file in $jsonFiles) {
            try {
              $raw = Get-Content -LiteralPath $file.FullName -Raw
              if ([string]::IsNullOrWhiteSpace($raw)) {
                $issues.Add("Empty JSON file: " + $file.FullName.Substring($root.Length).TrimStart("\", "/"))
              } else {
                $null = $raw | ConvertFrom-Json -ErrorAction Stop
                $validJson++
              }
            } catch {
              $issues.Add("Invalid JSON: " + $file.FullName.Substring($root.Length).TrimStart("\", "/") + " - " + $_.Exception.Message)
            }
          }

          $todoMatches = @()
          if ($javaFiles.Count -gt 0) {
            $todoMatches = @(Select-String -Path $javaFiles.FullName -Pattern "TODO|FIXME|XXX" -ErrorAction SilentlyContinue)
          }
          foreach ($match in $todoMatches) {
            $relative = $match.Path.Substring($root.Length).TrimStart("\", "/")
            $notes.Add(("{0}:{1} - {2}" -f $relative, $match.LineNumber, $match.Line.Trim()))
          }

          $gradleFile = Join-Path $root "build.gradle"
          $versionLine = "Not found"
          if (Test-Path $gradleFile) {
            $match = Select-String -Path $gradleFile -Pattern 'version\s*=\s*["'']([^"'']+)["'']' | Select-Object -First 1
            if ($match -and $match.Matches.Count -gt 0) { $versionLine = $match.Matches[0].Groups[1].Value }
          } else {
            $issues.Add("Missing build.gradle at repository root.")
          }

          $metadataPath = Join-Path $root "src\main\resources\META-INF\mods.toml"
          if (Test-Path $metadataPath) {
            $metadata = Get-Content -LiteralPath $metadataPath -Raw
            if ($metadata -notmatch 'modId\s*=\s*"immersive_cctv"') {
              $issues.Add("mods.toml does not contain the expected modId immersive_cctv (check if the project intentionally uses another ID).")
            }
          } else {
            $issues.Add("Missing src/main/resources/META-INF/mods.toml.")
          }

          $status = if ($issues.Count -eq 0) { "PASS - no blocking file/JSON issues detected" } else { "CHECK - $($issues.Count) issue(s) need review" }
          $lines = @(
            "# IMMERSIVE CCTV - Project Audit",
            "",
            "- **Result:** $status",
            "- **Branch:** $env:GITHUB_REF_NAME",
            "- **Commit:** $env:GITHUB_SHA",
            "- **Mod version (build.gradle):** $versionLine",
            "- **Java source files:** $($javaFiles.Count)",
            "- **JSON files:** $($jsonFiles.Count) total; $validJson valid",
            "- **Recipe JSON files:** $($recipeFiles.Count)",
            "- **Texture PNG files:** $($textureFiles.Count)",
            "- **Resource files under src:** $($resourceFiles.Count)",
            "- **TODO/FIXME/XXX markers:** $($todoMatches.Count)",
            "",
            "## Issues"
          )
          if ($issues.Count -eq 0) { $lines += "- None detected by these automated checks." } else { $lines += $issues | ForEach-Object { "- $_" } }
          $lines += @("", "## TODO / FIXME markers")
          if ($notes.Count -eq 0) { $lines += "- None found in Java source." } else { $lines += $notes | ForEach-Object { "- $_" } }
          $lines += @(
            "",
            "## Scope and limitations",
            "This is a static inventory and syntax check, not a Minecraft launch test or a Gradle compilation.",
            "A PASS means only that these specific checks passed; it does not guarantee every mod feature works in-game."
          )
          Set-Content -LiteralPath $reportPath -Value $lines -Encoding UTF8
          Write-Host ($lines -join [Environment]::NewLine)
          if ($issues.Count -gt 0) { Write-Host "Audit found items to review; the report will still be uploaded." }

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: immersive-cctv-project-audit
          path: immersive-cctv-audit-report.md
          if-no-files-found: error
          retention-days: 14
