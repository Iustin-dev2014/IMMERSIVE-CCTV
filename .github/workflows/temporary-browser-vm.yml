name: Temporary Browser VM (2 minutes + extend command)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temporary-browser-vm
  cancel-in-progress: true

jobs:
  browser-vm:
    name: Start temporary browser terminal
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check required password secret
        shell: bash
        env:
          VM_WEB_PASSWORD: ${{ secrets.VM_WEB_PASSWORD }}
        run: |
          if [[ -z "${VM_WEB_PASSWORD}" ]]; then
            echo "::error::Missing repository secret VM_WEB_PASSWORD. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Install browser terminal and tunnel tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ttyd

          mkdir -p "$RUNNER_TEMP/vmtest"
          curl --fail --silent --show-error --location \
            "https://github.com/cloudflare/cloudflared/releases/download/2026.10.1/cloudflared-linux-amd64" \
            -o "$RUNNER_TEMP/vmtest/cloudflared"
          chmod 700 "$RUNNER_TEMP/vmtest/cloudflared"

          command -v ttyd
          ttyd --version
          "$RUNNER_TEMP/vmtest/cloudflared" --version

      - name: Start protected terminal and temporary public tunnel
        shell: bash
        env:
          VM_WEB_PASSWORD: ${{ secrets.VM_WEB_PASSWORD }}
        run: |
          set -euo pipefail

          TTYD_BIN="$(command -v ttyd)"
          CLOUDFLARED="$RUNNER_TEMP/vmtest/cloudflared"

          # Pick a free local port instead of assuming 7681 is always available.
          TTYD_PORT="$(python3 - <<'PY'
          import socket
          s = socket.socket()
          s.bind(("127.0.0.1", 0))
          print(s.getsockname()[1])
          s.close()
          PY
          )"

          echo "Using local ttyd port: ${TTYD_PORT}"

          # The terminal command writes extension requests to a FIFO; the workflow timer
          # below consumes them and extends its own countdown.
          EXTEND_FIFO="$RUNNER_TEMP/vmtest/extend.fifo"
          BASHRC="$RUNNER_TEMP/vmtest/terminal.bashrc"
          mkfifo "$EXTEND_FIFO"
          export VM_EXTEND_FIFO="$EXTEND_FIFO"

          cat > "$BASHRC" <<'BASHRC'
          extend() {
            if [[ "${1:-}" == "" || ! "${1:-}" =~ ^[0-9]+$ ]]; then
              echo "Usage: extend <minutes> (1-300)"
              return 2
            fi
            if (( 10#${1} < 1 || 10#${1} > 300 )); then
              echo "Minutes must be between 1 and 300."
              return 2
            fi
            printf '%s\n' "${1}" > "$VM_EXTEND_FIFO"
            echo "Extension request sent to workflow: +${1} minute(s)."
          }
          echo "Temporary Ubuntu terminal. Initial session: 2 minutes."
          echo "To extend the workflow timer, type: extend <minutes> (1-300)"
          BASHRC

          # Open the FIFO read/write so the workflow can poll it without blocking.
          exec 9<> "$EXTEND_FIFO"

          # Start a clean interactive shell with the extend command available.
          "$TTYD_BIN" --interface 127.0.0.1 --port "$TTYD_PORT" \
            --credential "cctvtest:${VM_WEB_PASSWORD}" --writable \
            bash --noprofile --norc --rcfile "$BASHRC" -i \
            > "$RUNNER_TEMP/vmtest/ttyd.log" 2>&1 &
          TTYD_PID=$!

          cleanup() {
            if [[ -n "${TUNNEL_PID:-}" ]]; then
              kill "$TUNNEL_PID" 2>/dev/null || true
              wait "$TUNNEL_PID" 2>/dev/null || true
            fi
            if [[ -n "${TTYD_PID:-}" ]]; then
              kill "$TTYD_PID" 2>/dev/null || true
              wait "$TTYD_PID" 2>/dev/null || true
            fi
          }
          TUNNEL_PID=""
          trap cleanup EXIT

          URL=""
          for tunnel_attempt in $(seq 1 5); do
            echo "Starting Cloudflare Quick Tunnel (attempt ${tunnel_attempt}/5)..."
            : > "$RUNNER_TEMP/vmtest/cloudflared.log"
            "$CLOUDFLARED" tunnel --url "http://127.0.0.1:${TTYD_PORT}" --no-autoupdate > "$RUNNER_TEMP/vmtest/cloudflared.log" 2>&1 &
            TUNNEL_PID=$!

            for wait_attempt in $(seq 1 25); do
              if ! kill -0 "$TTYD_PID" 2>/dev/null; then
                echo "::error::The browser terminal stopped unexpectedly."
                cat "$RUNNER_TEMP/vmtest/ttyd.log"
                exit 1
              fi

              URL="$(grep -Eo 'https://[^[:space:]]+trycloudflare\.com' "$RUNNER_TEMP/vmtest/cloudflared.log" | head -n 1 || true)"
              if [[ -n "$URL" ]]; then
                break
              fi

              if ! kill -0 "$TUNNEL_PID" 2>/dev/null; then
                break
              fi
              sleep 1
            done

            if [[ -n "$URL" ]]; then
              break
            fi

            echo "Quick Tunnel attempt ${tunnel_attempt} did not produce a URL."
            cat "$RUNNER_TEMP/vmtest/cloudflared.log"
            kill "$TUNNEL_PID" 2>/dev/null || true
            wait "$TUNNEL_PID" 2>/dev/null || true
            TUNNEL_PID=""

            if [[ "$tunnel_attempt" -lt 5 ]]; then
              delay=$((tunnel_attempt * 4))
              echo "Retrying Cloudflare Quick Tunnel in ${delay}s..."
              sleep "$delay"
            fi
          done

          if [[ -z "$URL" ]]; then
            echo "::error::Could not obtain a temporary tunnel URL after 5 attempts."
            echo "Final Cloudflared output:"
            cat "$RUNNER_TEMP/vmtest/cloudflared.log"
            exit 1
          fi

          echo "=================================================="
          echo "TEMPORARY BROWSER VM IS READY"
          echo "Open this URL and sign in with:"
          echo "  Username: cctvtest"
          echo "  Password: the value you saved as VM_WEB_PASSWORD"
          echo "$URL"
          echo "The session starts with 2 minutes. In the terminal, use: extend <minutes> (1-300)"
          echo "Every accepted extension is applied by this workflow's timer."
          echo "Do not share the URL or password."
          echo "=================================================="

          remaining=120
          while (( remaining > 0 )); do
            if ! kill -0 "$TTYD_PID" 2>/dev/null; then
              echo "The browser terminal has stopped. Ending session."
              break
            fi

            if IFS= read -r -t 1 -u 9 request; then
              if [[ "$request" =~ ^[0-9]+$ ]] && (( 10#$request >= 1 && 10#$request <= 300 )); then
                added=$((10#$request * 60))
                remaining=$((remaining + added))
                echo "Timer extended by $request minute(s). New remaining time: $((remaining / 60))m $((remaining % 60))s."
              else
                echo "Ignored invalid extension request."
              fi
            else
              remaining=$((remaining - 1))
            fi
          done

          echo "Session time expired or terminal stopped. Closing the temporary browser VM now."
