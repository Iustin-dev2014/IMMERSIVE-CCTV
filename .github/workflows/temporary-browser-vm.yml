name: Temporary Browser VM (5 minutes)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temporary-browser-vm
  cancel-in-progress: true

jobs:
  browser-vm:
    name: Start temporary browser terminal
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check required password secret
        shell: bash
        env:
          VM_WEB_PASSWORD: ${{ secrets.VM_WEB_PASSWORD }}
        run: |
          if [[ -z "${VM_WEB_PASSWORD}" ]]; then
            echo "::error::Missing repository secret VM_WEB_PASSWORD. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Download pinned tools (with HTTP diagnostics)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/vmtest"

          # Pin exact releases instead of using /releases/latest/download.
          # ttyd 1.7.7: https://github.com/tsl0922/ttyd/releases/tag/1.7.7
          # cloudflared 2026.10.1: https://github.com/cloudflare/cloudflared/releases/tag/2026.10.1
          download_asset() {
            local label="$1"
            local url="$2"
            local destination="$3"
            local temporary="${destination}.part"
            local http_status=""
            local curl_status=0

            echo "::group::Download ${label}"
            echo "Pinned URL: ${url}"
            rm -f "$temporary"

            # Do not use curl --fail here: capture the HTTP status explicitly,
            # so a 404 is reported with the exact URL instead of a generic curl error.
            set +e
            http_status="$(curl --silent --show-error --location \
              --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 120 \
              --output "$temporary" --write-out '%{http_code}' "$url")"
            curl_status=$?
            set -e

            if [[ "$curl_status" -ne 0 || "$http_status" != "200" ]]; then
              echo "::error title=Asset download failed::${label}: URL=${url} HTTP_STATUS=${http_status:-unknown} CURL_EXIT=${curl_status}"
              if [[ "$http_status" == "404" ]]; then
                echo "::error::HTTP 404 means GitHub could not find this exact pinned release asset. Check the tag and filename shown above."
              elif [[ "$http_status" == "403" ]]; then
                echo "::error::HTTP 403: access denied or request rate-limited by the hosting service."
              elif [[ "$http_status" == "000" || -z "$http_status" ]]; then
                echo "::error::No HTTP response received. Check DNS, network connectivity, TLS, or a temporary GitHub outage."
              elif [[ "$http_status" =~ ^5 ]]; then
                echo "::error::The hosting server returned HTTP ${http_status}; this may be a temporary server-side problem."
              fi
              if [[ -s "$temporary" ]]; then
                echo "Response body preview (first 300 bytes; may be an error page):"
                head -c 300 "$temporary" || true
                echo
              fi
              rm -f "$temporary"
              echo "::endgroup::"
              exit 1
            fi

            mv "$temporary" "$destination"
            echo "Download OK: ${label} (HTTP ${http_status})"
            echo "::endgroup::"
          }

          download_asset "ttyd 1.7.7" \
            "https://github.com/tsl0922/ttyd/releases/download/1.7.7/ttyd.x86_64" \
            "$RUNNER_TEMP/vmtest/ttyd"

          download_asset "cloudflared 2026.10.1" \
            "https://github.com/cloudflare/cloudflared/releases/download/2026.10.1/cloudflared-linux-amd64" \
            "$RUNNER_TEMP/vmtest/cloudflared"

          chmod 700 "$RUNNER_TEMP/vmtest/ttyd" "$RUNNER_TEMP/vmtest/cloudflared"
          "$RUNNER_TEMP/vmtest/ttyd" --version
          "$RUNNER_TEMP/vmtest/cloudflared" --version

      - name: Start protected terminal and temporary public tunnel
        shell: bash
        env:
          VM_WEB_PASSWORD: ${{ secrets.VM_WEB_PASSWORD }}
        run: |
          set -euo pipefail
          TTYD="$RUNNER_TEMP/vmtest/ttyd"
          CLOUDFLARED="$RUNNER_TEMP/vmtest/cloudflared"

          # The browser terminal is password-protected. Do not print the password.
          # Start a clean shell so workflow secrets and GitHub runtime variables are not inherited.
          "$TTYD" --interface 127.0.0.1 --port 7681 --credential "cctvtest:${VM_WEB_PASSWORD}" --writable \
            env -i HOME="$HOME" USER="$USER" PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" TERM=xterm-256color \
            bash --noprofile --norc > "$RUNNER_TEMP/vmtest/ttyd.log" 2>&1 &
          TTYD_PID=$!

          cleanup() {
            if [[ -n "${TUNNEL_PID:-}" ]]; then
              kill "$TUNNEL_PID" 2>/dev/null || true
              wait "$TUNNEL_PID" 2>/dev/null || true
            fi
            kill "$TTYD_PID" 2>/dev/null || true
            wait "$TTYD_PID" 2>/dev/null || true
          }
          TUNNEL_PID=""
          trap cleanup EXIT

          # Quick Tunnel provisioning can temporarily fail with Cloudflare 409/Tunnelstore errors.
          # Retry with a fresh process and log file instead of failing on the first response.
          URL=""
          for tunnel_attempt in $(seq 1 5); do
            echo "Starting Cloudflare Quick Tunnel (attempt ${tunnel_attempt}/5)..."
            : > "$RUNNER_TEMP/vmtest/cloudflared.log"
            "$CLOUDFLARED" tunnel --url http://127.0.0.1:7681 --no-autoupdate > "$RUNNER_TEMP/vmtest/cloudflared.log" 2>&1 &
            TUNNEL_PID=$!

            for wait_attempt in $(seq 1 20); do
              if ! kill -0 "$TTYD_PID" 2>/dev/null; then
                echo "::error::The browser terminal stopped unexpectedly."
                cat "$RUNNER_TEMP/vmtest/ttyd.log"
                exit 1
              fi

              URL="$(grep -Eo 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' "$RUNNER_TEMP/vmtest/cloudflared.log" | head -n 1 || true)"
              if [[ -n "$URL" ]]; then
                break
              fi

              # If cloudflared exited (for example, Tunnelstore returned HTTP 409),
              # stop waiting and move to the next attempt.
              if ! kill -0 "$TUNNEL_PID" 2>/dev/null; then
                break
              fi
              sleep 1
            done

            if [[ -n "$URL" ]]; then
              break
            fi

            echo "Quick Tunnel attempt ${tunnel_attempt} did not produce a URL."
            cat "$RUNNER_TEMP/vmtest/cloudflared.log"
            kill "$TUNNEL_PID" 2>/dev/null || true
            wait "$TUNNEL_PID" 2>/dev/null || true
            TUNNEL_PID=""

            if [[ "$tunnel_attempt" -lt 5 ]]; then
              delay=$((tunnel_attempt * 4))
              echo "Retrying Cloudflare Quick Tunnel in ${delay}s..."
              sleep "$delay"
            fi
          done

          if [[ -z "$URL" ]]; then
            echo "::error::Could not obtain a temporary tunnel URL after 5 attempts. Cloudflare Quick Tunnel provisioning may be temporarily unavailable."
            echo "Final Cloudflared output:"
            cat "$RUNNER_TEMP/vmtest/cloudflared.log"
            exit 1
          fi

          echo "=================================================="
          echo "TEMPORARY BROWSER VM IS READY"
          echo "Open this URL and sign in with:"
          echo "  Username: cctvtest"
          echo "  Password: the value you saved as VM_WEB_PASSWORD"
          echo "$URL"
          echo "The session will close automatically after 5 minutes."
          echo "Do not share the URL or password."
          echo "=================================================="

          # Keep the runner alive for exactly five minutes after the tunnel is ready.
          sleep 300
          echo "Five minutes elapsed. Closing the temporary browser VM now."
