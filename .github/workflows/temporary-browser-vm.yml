name: Temporary Browser VM (10 minutes)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temporary-browser-vm
  cancel-in-progress: true

jobs:
  browser-vm:
    name: Start temporary browser terminal
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out VM UI assets
        uses: actions/checkout@v4

      - name: Check required password secret
        shell: bash
        env:
          VM_WEB_PASSWORD: ${{ secrets.VM_WEB_PASSWORD }}
        run: |
          if [[ -z "${VM_WEB_PASSWORD}" ]]; then
            echo "::error::Missing repository secret VM_WEB_PASSWORD. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Install browser terminal and tunnel tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ttyd
          mkdir -p "$RUNNER_TEMP/vmtest"
          npm install --prefix "$RUNNER_TEMP/vmtest/proxy" --no-save http-proxy@1.18.1
          curl --fail --silent --show-error --location \
            "https://github.com/cloudflare/cloudflared/releases/download/2026.10.1/cloudflared-linux-amd64" \
            -o "$RUNNER_TEMP/vmtest/cloudflared"
          chmod 700 "$RUNNER_TEMP/vmtest/cloudflared"

          command -v ttyd
          ttyd --version
          "$RUNNER_TEMP/vmtest/cloudflared" --version

      - name: Start protected terminal and temporary public tunnel
        shell: bash
        env:
          VM_WEB_PASSWORD: ${{ secrets.VM_WEB_PASSWORD }}
        run: |
          set -euo pipefail

          TTYD_BIN="$(command -v ttyd)"
          CLOUDFLARED="$RUNNER_TEMP/vmtest/cloudflared"
          export NODE_PATH="$RUNNER_TEMP/vmtest/proxy/node_modules"

          # Pick a free local port instead of assuming 7681 is always available.
          TTYD_PORT="$(python3 - <<'PY'
          import socket
          s = socket.socket()
          s.bind(("127.0.0.1", 0))
          print(s.getsockname()[1])
          s.close()
          PY
          )"

          VM_UI_PORT="$(python3 - <<'PY'
          import socket
          s = socket.socket()
          s.bind(("127.0.0.1", 0))
          print(s.getsockname()[1])
          s.close()
          PY
          )"

          echo "Using local ttyd port: ${TTYD_PORT}"
          echo "Using modern UI proxy port: ${VM_UI_PORT}"

          # Treat an intentional Linux shutdown as a normal end to this temporary workspace.
          export VM_SHUTDOWN_MARKER="$RUNNER_TEMP/vmtest/shutdown-requested"
          cat > "$RUNNER_TEMP/vmtest/vm-shell.rc" <<'SHELL_RC'
          export PS1='[user]@immersive-cctv! '
          shutdown() {
            printf '\n[WARNING] Linux session is shutting down. GitHub Actions will close this temporary workspace.\n'
            touch "${VM_SHUTDOWN_MARKER}"
            exit 0
          }
          poweroff() { shutdown "$@"; }
          halt() { shutdown "$@"; }
          reboot() {
            printf '\n[WARNING] Reboot requested. Closing this temporary Linux workspace instead.\n'
            touch "${VM_SHUTDOWN_MARKER}"
            exit 0
          }
          sudo() {
            local arg
            for arg in "$@"; do
              case "${arg##*/}" in
                shutdown|poweroff|halt|reboot) shutdown "$@"; return $? ;;
              esac
            done
            command sudo "$@"
          }
          SHELL_RC

          # Keep ttyd as the terminal engine; the proxy adds the touch-first interface.
          "$TTYD_BIN" --interface 127.0.0.1 --port "$TTYD_PORT" \
            --client-option fontSize=16 \
            --credential "cctvtest:${VM_WEB_PASSWORD}" --writable \
            bash --noprofile --rcfile "$RUNNER_TEMP/vmtest/vm-shell.rc" -i \
            > "$RUNNER_TEMP/vmtest/ttyd.log" 2>&1 &
          TTYD_PID=$!

          TTYD_PORT="$TTYD_PORT" VM_UI_PORT="$VM_UI_PORT" node "$GITHUB_WORKSPACE/.github/scripts/vm-ui-proxy.cjs" \
            > "$RUNNER_TEMP/vmtest/vm-ui-proxy.log" 2>&1 &
          UI_PROXY_PID=$!

          cleanup() {
            if [[ -n "${TUNNEL_PID:-}" ]]; then
              kill "$TUNNEL_PID" 2>/dev/null || true
              wait "$TUNNEL_PID" 2>/dev/null || true
            fi
            if [[ -n "${UI_PROXY_PID:-}" ]]; then
              kill "$UI_PROXY_PID" 2>/dev/null || true
              wait "$UI_PROXY_PID" 2>/dev/null || true
            fi
            if [[ -n "${TTYD_PID:-}" ]]; then
              kill "$TTYD_PID" 2>/dev/null || true
              wait "$TTYD_PID" 2>/dev/null || true
            fi
          }
          TUNNEL_PID=""
          trap cleanup EXIT

          # Verify the injected UI is actually served before publishing the tunnel URL.
          UI_READY=0
          for ui_attempt in $(seq 1 20); do
            if curl --fail --silent --show-error --user "cctvtest:${VM_WEB_PASSWORD}" \
              "http://127.0.0.1:${VM_UI_PORT}/" -o "$RUNNER_TEMP/vmtest/ui-check.html" 2>/dev/null \
              && grep -q "VM CONSOLE" "$RUNNER_TEMP/vmtest/ui-check.html" \
              && grep -q "data-chord" "$RUNNER_TEMP/vmtest/ui-check.html"; then
              UI_READY=1
              break
            fi
            sleep 1
          done
          if [[ "$UI_READY" -ne 1 ]]; then
            echo "::error::Modern terminal UI failed its local smoke test."
            cat "$RUNNER_TEMP/vmtest/vm-ui-proxy.log" || true
            cat "$RUNNER_TEMP/vmtest/ttyd.log" || true
            exit 1
          fi
          echo "Modern terminal UI smoke test passed."

          URL=""
          for tunnel_attempt in $(seq 1 5); do
            echo "Starting Cloudflare Quick Tunnel (attempt ${tunnel_attempt}/5)..."
            : > "$RUNNER_TEMP/vmtest/cloudflared.log"
            "$CLOUDFLARED" tunnel --url "http://127.0.0.1:${VM_UI_PORT}" --no-autoupdate > "$RUNNER_TEMP/vmtest/cloudflared.log" 2>&1 &
            TUNNEL_PID=$!

            for wait_attempt in $(seq 1 25); do
              if ! kill -0 "$TTYD_PID" 2>/dev/null; then
                echo "::error::The browser terminal stopped unexpectedly."
                cat "$RUNNER_TEMP/vmtest/ttyd.log"
                exit 1
              fi

              URL="$(grep -Eo 'https://[^[:space:]]+trycloudflare\.com' "$RUNNER_TEMP/vmtest/cloudflared.log" | head -n 1 || true)"
              if [[ -n "$URL" ]]; then
                break
              fi

              if ! kill -0 "$TUNNEL_PID" 2>/dev/null; then
                break
              fi
              sleep 1
            done

            if [[ -n "$URL" ]]; then
              break
            fi

            echo "Quick Tunnel attempt ${tunnel_attempt} did not produce a URL."
            cat "$RUNNER_TEMP/vmtest/cloudflared.log"
            kill "$TUNNEL_PID" 2>/dev/null || true
            wait "$TUNNEL_PID" 2>/dev/null || true
            TUNNEL_PID=""

            if [[ "$tunnel_attempt" -lt 5 ]]; then
              delay=$((tunnel_attempt * 4))
              echo "Retrying Cloudflare Quick Tunnel in ${delay}s..."
              sleep "$delay"
            fi
          done

          if [[ -z "$URL" ]]; then
            echo "::error::Could not obtain a temporary tunnel URL after 5 attempts."
            echo "Final Cloudflared output:"
            cat "$RUNNER_TEMP/vmtest/cloudflared.log"
            exit 1
          fi

          echo "=================================================="
          echo "TEMPORARY BROWSER VM WITH MODERN TOUCH UI IS READY"
          echo "Open this URL and sign in with:"
          echo "  Username: cctvtest"
          echo "  Password: the value you saved as VM_WEB_PASSWORD"
          echo "$URL"
          echo "The session will close automatically after 10 minutes."
          echo "Do not share the URL or password."
          echo "=================================================="

          # Poll for a deliberate shutdown request while keeping the ten-minute limit.
          for remaining_seconds in $(seq 1 600); do
            if [[ -f "$VM_SHUTDOWN_MARKER" ]]; then
              echo "::warning::Linux was shut down by the user; closing the temporary browser VM workflow normally."
              echo "The Linux session is closed. This GitHub Actions workspace will now close too."
              exit 0
            fi
            sleep 1
          done
          echo "Ten minutes elapsed. Closing the temporary browser VM now."
