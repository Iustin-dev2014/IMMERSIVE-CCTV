name: TEMP - Build IMMERSIVE CCTV on Windows Runner

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: "How hard should the temporary build test run?"
        type: choice
        required: true
        default: full
        options:
          - quick
          - full

permissions:
  contents: read

concurrency:
  group: temporary-immersive-cctv-build
  cancel-in-progress: false

jobs:
  build-mod:
    name: Compile IMMERSIVE CCTV (Windows self-hosted)
    # Deliberately targets the existing Windows runner only. No Linux/WSL runner is needed.
    runs-on: [self-hosted, windows]
    timeout-minutes: 90

    steps:
      - name: Checkout the mod source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Confirm Windows runner and Java
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:RUNNER_OS -ne "Windows") {
            throw "This temporary build workflow must run on the existing Windows self-hosted runner."
          }
          Write-Host "Runner OS: $env:RUNNER_OS"
          Write-Host "Persistent user profile: $env:USERPROFILE"
          java -version
          if (-not (Test-Path "build.gradle")) {
            throw "build.gradle was not found at the repository root."
          }
          Write-Host "Found build.gradle. Project version and Forge dependencies:"
          Select-String -Path "build.gradle" -Pattern "version\s*=|net\.minecraftforge:forge"

      - name: Install or reuse persistent Gradle distribution
        id: gradle
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $gradleVersion = "8.8"
          $gradleCommand = Get-Command gradle -ErrorAction SilentlyContinue
          if ($gradleCommand) {
            $versionText = (& gradle --version 2>&1 | Out-String)
            Write-Host $versionText
            if ($versionText -match "Gradle $gradleVersion") {
              "gradle_executable=gradle" >> $env:GITHUB_OUTPUT
              exit 0
            }
          }

          # Keep the Gradle distribution outside RUNNER_TEMP so it survives between jobs.
          $installRoot = Join-Path $env:USERPROFILE "tools\immersive-cctv-gradle"
          $zipPath = Join-Path $installRoot "gradle-$gradleVersion-bin.zip"
          $gradleHome = Join-Path $installRoot "gradle-$gradleVersion"
          $gradleBat = Join-Path $gradleHome "bin\gradle.bat"
          New-Item -ItemType Directory -Force -Path $installRoot | Out-Null

          if (-not (Test-Path $gradleBat)) {
            if (-not (Test-Path $zipPath)) {
              Write-Host "Gradle $gradleVersion archive is not cached; downloading it once to $zipPath"
              Invoke-WebRequest -Uri "https://services.gradle.org/distributions/gradle-$gradleVersion-bin.zip" -OutFile $zipPath
            } else {
              Write-Host "Reusing cached Gradle archive: $zipPath"
            }
            Write-Host "Extracting Gradle $gradleVersion into persistent storage..."
            Expand-Archive -Path $zipPath -DestinationPath $installRoot -Force
          } else {
            Write-Host "Reusing persistent Gradle installation: $gradleBat"
          }

          if (-not (Test-Path $gradleBat)) {
            throw "Could not find gradle.bat after checking persistent Gradle storage."
          }
          "gradle_executable=$gradleBat" >> $env:GITHUB_OUTPUT
          & $gradleBat --version

      - name: Build mod JAR
        shell: powershell
        env:
          BUILD_MODE: ${{ inputs.build_mode }}
        run: |
          $ErrorActionPreference = "Stop"
          # Explicitly retain Forge/Minecraft and other dependency caches for this Windows account.
          $env:GRADLE_USER_HOME = Join-Path $env:USERPROFILE ".gradle"
          New-Item -ItemType Directory -Force -Path $env:GRADLE_USER_HOME | Out-Null
          Write-Host "Persistent Gradle dependency cache: $env:GRADLE_USER_HOME"

          $gradle = "${{ steps.gradle.outputs.gradle_executable }}"
          if ([string]::IsNullOrWhiteSpace($gradle)) { throw "Gradle executable output is empty." }

          $arguments = @("--no-daemon", "--stacktrace", "clean", "build")
          if ($env:BUILD_MODE -eq "full") {
            $arguments = @("--no-daemon", "--stacktrace", "--warning-mode", "all", "clean", "build")
          }
          Write-Host "Build mode: $env:BUILD_MODE"
          Write-Host "Running Gradle: $gradle $($arguments -join ' ')"
          & $gradle @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "Gradle build failed with exit code $LASTEXITCODE."
          }

      - name: Verify output JAR and print build summary
        id: verify
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $jars = @(Get-ChildItem -Path "build\libs" -Filter "*.jar" -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -notmatch "-sources|-javadoc" })
          if ($jars.Count -eq 0) {
            throw "Gradle reported success, but no mod JAR was found in build\libs."
          }
          Write-Host "Build output(s):"
          $jars | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            Write-Host ("{0} | {1:N2} MB | SHA256 {2}" -f $_.FullName, ($_.Length / 1MB), $hash)
          }
          "jar_count=$($jars.Count)" >> $env:GITHUB_OUTPUT
          "jar_names=$((($jars | ForEach-Object { $_.Name }) -join ', '))" >> $env:GITHUB_OUTPUT

      - name: Upload compiled mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: immersive-cctv-windows-build-${{ github.run_number }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

      - name: Report result
        if: always()
        shell: powershell
        env:
          BUILD_OUTCOME: ${{ job.status }}
          JAR_NAMES: ${{ steps.verify.outputs.jar_names }}
        run: |
          Write-Host "=============================================="
          Write-Host "IMMERSIVE CCTV Windows build status: $env:BUILD_OUTCOME"
          if ($env:JAR_NAMES) { Write-Host "JAR(s): $env:JAR_NAMES" }
          Write-Host "When successful, download the artifact named immersive-cctv-windows-build-${{ github.run_number }} from this workflow run."
          Write-Host "=============================================="
